/* ============================================================
   Registros de Auditoria (SOX) — trilha imutável de movimentações
   Somente leitura + filtros + exportação (PDF via impressão, Excel).
   ============================================================ */
function TelaAuditoria({ dados, categoriasVisiveis }) {
  const [fCat, setFCat] = useState("Todas");
  const [fTexto, setFTexto] = useState("");
  const [fUsuario, setFUsuario] = useState("");
  const [fDe, setFDe] = useState("");   // yyyy-mm-dd
  const [fAte, setFAte] = useState("");

  // Sem categoriasVisiveis (GM): vê tudo. Com a lista (administrador de Subsistema): só as
  // categorias do(s) Subsistema(s) que ele administra — restrição aplicada aqui na origem dos
  // dados, então também vale para as exportações (Excel/PDF), não só para a tela.
  const categorias = categoriasVisiveis || LOG_CATEGORIAS;
  const todos = (dados.auditoria || []).filter((r) => categorias.includes(r.categoria));
  // Mais recentes primeiro (ordena pelo carimbo imutável ts)
  const ordenados = todos.slice().sort((a, b) => String(b.ts || "").localeCompare(String(a.ts || "")));
  const dentroData = (ts) => {
    if (!fDe && !fAte) return true;
    const dia = String(ts || "").slice(0, 10); // ISO yyyy-mm-dd — comparação lexicográfica segura
    if (fDe && dia < fDe) return false;
    if (fAte && dia > fAte) return false;
    return true;
  };
  const filtrados = ordenados.filter((r) =>
    (fCat === "Todas" || r.categoria === fCat) &&
    (!fUsuario || `${r.usuarioNome} ${r.usuarioEmail}`.toLowerCase().includes(fUsuario.toLowerCase())) &&
    (!fTexto || `${r.acao} ${r.detalhe}`.toLowerCase().includes(fTexto.toLowerCase())) &&
    dentroData(r.ts)
  );

  const exportarExcel = () => {
    const linhas = filtrados.map((r) => ({
      "Data/Hora": r.quando, "Usuário": r.usuarioNome, "E-mail": r.usuarioEmail, "Perfil": r.perfil,
      "Categoria": r.categoria, "Ação": r.acao, "Detalhe": r.detalhe, "Ref.": r.refId, "Carimbo (UTC)": r.ts,
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas.length ? linhas : [{}]), "Auditoria");
    XLSX.writeFile(wb, "Trilha_Auditoria.xlsx");
  };

  const corCat = { "Compra": "#2D3D70", "Cadastro": "#0f6b3f", "Movimentação": "#b45309", "Materiais": "#5b21b6", "Procedimentos": "#b45309", "Usuários": "#9d174d", "Acesso": "#334155" };
  const th = { padding: "8px 8px", fontSize: 11, textTransform: "uppercase", letterSpacing: ".03em", color: "#fff", background: CORES.azul, textAlign: "left", whiteSpace: "nowrap" };
  const td = { padding: "6px 8px", borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 12.5, color: CORES.azul, verticalAlign: "top" };

  return (
    <div>
      <div className="so-tela">
        <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Registros de Auditoria (SOX)</h2>
        <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 14px" }}>
          Trilha <strong>imutável</strong> de todas as movimentações do sistema (solicitações, conclusões, cancelamentos, materiais, usuários e acessos).
          Cada registro guarda <strong>quem</strong>, <strong>o quê</strong> e <strong>quando</strong>. Total: <strong>{todos.length}</strong> registro(s)
          {" · "}exibindo <strong>{filtrados.length}</strong> após filtros.
        </p>
        {categoriasVisiveis && categoriasVisiveis.length === 0 && (
          <p style={{ fontSize: 12.5, color: CORES.laranja, background: "#fff4e6", border: "1px solid #f0c98a", borderRadius: 8, padding: "8px 12px", margin: "0 0 14px" }}>
            Este Subsistema mantém sua própria trilha de auditoria dentro dele mesmo — não há registros deste tipo aqui.
          </p>
        )}
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 14 }}>
          <div style={{ flex: "1 1 150px" }}><Campo label="Categoria">
            <select style={inputStyle} value={fCat} onChange={(e) => setFCat(e.target.value)}>
              <option>Todas</option>
              {categorias.map((c) => <option key={c}>{c}</option>)}
            </select>
          </Campo></div>
          <div style={{ flex: "1 1 180px" }}><Campo label="Usuário"><input style={inputStyle} value={fUsuario} onChange={(e) => setFUsuario(e.target.value)} placeholder="Nome ou e-mail…" /></Campo></div>
          <div style={{ flex: "1 1 200px" }}><Campo label="Buscar (ação/detalhe)"><input style={inputStyle} value={fTexto} onChange={(e) => setFTexto(e.target.value)} placeholder="Texto livre…" /></Campo></div>
          <div style={{ flex: "0 1 150px" }}><Campo label="De"><input type="date" style={inputStyle} value={fDe} onChange={(e) => setFDe(e.target.value)} /></Campo></div>
          <div style={{ flex: "0 1 150px" }}><Campo label="Até"><input type="date" style={inputStyle} value={fAte} onChange={(e) => setFAte(e.target.value)} /></Campo></div>
          <div style={{ display: "flex", gap: 8 }}>
            <Botao tipo="contorno" onClick={exportarExcel}>Exportar Excel</Botao>
            <Botao tipo="laranja" onClick={() => window.print()}>Exportar PDF</Botao>
          </div>
        </div>
      </div>

      {/* Área imprimível — o CSS @media print isola este bloco (#area-relatorio) */}
      <div id="area-relatorio">
        <div className="so-impressao" style={{ marginBottom: 8 }}>
          <h3 style={{ margin: 0, color: CORES.azul }}>Trilha de Auditoria — Aura Minerals · Solicitação de Compras e Cadastros</h3>
          <div style={{ fontSize: 10 }}>Gerado em {agoraStr()} · {filtrados.length} registro(s){fCat !== "Todas" ? ` · Categoria: ${fCat}` : ""}{(fDe || fAte) ? ` · Período: ${fDe || "início"} a ${fAte || "hoje"}` : ""}</div>
        </div>
        <div style={{ overflowX: "auto" }}>
          <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 820 }}>
            <thead><tr>
              <th style={th}>Data/Hora</th><th style={th}>Usuário</th><th style={th}>Perfil</th>
              <th style={th}>Categoria</th><th style={th}>Ação</th><th style={th}>Detalhe</th><th style={th}>Ref.</th>
            </tr></thead>
            <tbody>
              {filtrados.map((r) => (
                <tr key={r.id}>
                  <td style={{ ...td, whiteSpace: "nowrap" }}>{r.quando}</td>
                  <td style={td}>{r.usuarioNome}<div style={{ fontSize: 10.5, color: CORES.cinza }}>{r.usuarioEmail}</div></td>
                  <td style={td}>{r.perfil}</td>
                  <td style={td}><span style={{ display: "inline-block", padding: "1px 8px", borderRadius: 10, fontSize: 11, fontWeight: 700, color: "#fff", background: corCat[r.categoria] || CORES.azul }}>{r.categoria}</span></td>
                  <td style={td}>{r.acao}</td>
                  <td style={{ ...td, maxWidth: 320, wordBreak: "break-word" }}>{r.detalhe || "—"}</td>
                  <td style={{ ...td, fontSize: 10.5, color: CORES.cinza, wordBreak: "break-all" }}>{r.refId || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {filtrados.length === 0 && (
          <p style={{ textAlign: "center", color: CORES.cinza, fontSize: 13, padding: "24px 0" }}>Nenhum registro encontrado para os filtros selecionados.</p>
        )}
        <p className="so-impressao" style={{ fontSize: 9, color: "#666", marginTop: 10 }}>
          Documento de auditoria gerado pelo sistema — conteúdo imutável (append-only). Números de produção exigem validação humana formal antes de uso externo.
        </p>
      </div>
    </div>
  );
}

/* Administradores Responsáveis — pertence ao Subsistema Compras e Cadastros (não é uma configuração
   de plataforma do AURA 360°): define quais GM são notificados quando um usuário comum envia uma
   solicitação de compra/cadastro. Sem vínculo definido, o alerta vai a todos os GM. */
function TelaAdministradoresResponsaveis({ dados, setDados, usuario }) {
  const alternarVinculo = async (email, adminEmail) => {
    const atual = dados.usuarios[email].administradores || [];
    const novos = atual.includes(adminEmail) ? atual.filter((a) => a !== adminEmail) : [...atual, adminEmail];
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...dados.usuarios[email], administradores: novos } } };
    nd = comLog(nd, usuario, "Usuários", "Alterou administradores responsáveis", `${email} → [${novos.join(", ") || "nenhum"}]`, email);
    setDados(nd); await salvarDados(nd);
  };

  const th = { padding: 8, fontSize: 11.5, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left" };
  const td = { padding: "8px", borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 14, color: CORES.azul };
  const listaAdm = Object.entries(dados.usuarios).filter(([, x]) => x.perfil === "GM");
  const usuariosComAcesso = Object.entries(dados.usuarios).filter(([, u]) => u.perfil !== "GM" && (u.permissoes || permissoesDefault()).subsistemas.COMPRAS);

  return (
    <div>
      <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Administradores Responsáveis</h2>
      <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 16px" }}>
        Cada usuário com acesso a Compras e Cadastros pode ter um ou mais <strong>GM responsáveis</strong>: as
        solicitações dele são notificadas apenas a esses responsáveis. Sem vínculo definido, o alerta vai a todos os GM.
      </p>
      <table style={{ borderCollapse: "collapse", width: "100%" }}>
        <thead><tr><th style={th}>Nome</th><th style={th}>E-mail</th><th style={th}>Administradores responsáveis</th></tr></thead>
        <tbody>
          {usuariosComAcesso.map(([email, u]) => {
            const vinc = (u.administradores || []).filter((e2) => dados.usuarios[e2] && dados.usuarios[e2].perfil === "GM");
            return (
              <tr key={email}>
                <td style={td}>{u.nome}</td>
                <td style={td}>{email}</td>
                <td style={{ ...td, minWidth: 210 }}>
                  <details>
                    <summary style={{ cursor: "pointer", fontSize: 13, color: vinc.length ? CORES.azul : CORES.laranja, fontWeight: 600 }}>
                      {vinc.length ? `${vinc.length} vinculado${vinc.length > 1 ? "s" : ""}: ${vinc.map((e2) => dados.usuarios[e2].nome.split(" ")[0]).join(", ")}` : "Nenhum — alerta irá a todos"}
                    </summary>
                    <div style={{ marginTop: 6, background: CORES.cinzaClaro, borderRadius: 6, padding: "8px 10px" }}>
                      {listaAdm.map(([e2, adm]) => (
                        <label key={e2} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: CORES.azul, padding: "3px 0", cursor: "pointer" }}>
                          <input type="checkbox" checked={vinc.includes(e2)} onChange={() => alternarVinculo(email, e2)}
                            style={{ width: 15, height: 15, accentColor: CORES.laranja }} />
                          {adm.nome} <span style={{ color: CORES.cinza }}>({e2})</span>
                        </label>
                      ))}
                    </div>
                  </details>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {usuariosComAcesso.length === 0 && (
        <p style={{ textAlign: "center", color: CORES.cinza, fontSize: 13, padding: "24px 0" }}>Nenhum usuário com acesso a Compras e Cadastros ainda.</p>
      )}
    </div>
  );
}

// Configurações do Subsistema Compras e Cadastros — só GM ou administrador delegado. Reúne o que
// antes eram 3 telas soltas na sidebar (Materiais, Registros/Auditoria, Administradores

      <div style={{ display: "flex", gap: 8, marginBottom: 18, borderBottom: `1px solid ${CORES.cinzaClaro}`, paddingBottom: 12 }}>

function TelaConfig({ dados, setDados, usuario, aba, setAba }) {
  const ehGM = usuario.perfil === "GM";
  const subsistemasQueAdministro = subsistemasAdministradosPor(usuario);
  if (!ehGM && subsistemasQueAdministro.length === 0) {
    return (
      <Cartao style={{ maxWidth: 520, margin: "0 auto", textAlign: "center", padding: 36 }}>
        <div style={{ fontSize: 40 }}>🔒</div>
        <h2 style={{ color: CORES.azul, margin: "8px 0 4px" }}>Acesso restrito</h2>
        <p style={{ color: CORES.cinza, fontSize: 14 }}>As Configurações exigem login de Administrador (GM) ou de administrador de algum Subsistema. Solicite acesso a um administrador do sistema.</p>
      </Cartao>
    );
  }

  const [novo, setNovo] = useState({ nome: "", email: "", perfil: "Usuário Comum" });
  const [novoSub, setNovoSub] = useState({ nome: "", email: "" });
  const [resetEmail, setResetEmail] = useState(null);
  const [novaSenha, setNovaSenha] = useState("");

  const mudarPerfil = async (email, perfil) => {
    const admins = Object.entries(dados.usuarios).filter(([, u]) => u.perfil === "GM");
    if (perfil !== "GM" && admins.length === 1 && admins[0][0] === email) {
      avisar("Não é possível remover o último administrador do sistema."); return;
    }
    // Ao rebaixar um administrador (de GM para qualquer outro perfil), ele deixa de ser responsável por qualquer usuário
    const usuarios = Object.fromEntries(Object.entries(dados.usuarios).map(([e, u]) => {
      let nu = e === email ? { ...u, perfil } : u;
      if (perfil !== "GM" && nu.administradores && nu.administradores.includes(email)) {
        nu = { ...nu, administradores: nu.administradores.filter((adm) => adm !== email) };
      }
      return [e, nu];
    }));
    let nd = { ...dados, usuarios };
    nd = comLog(nd, usuario, "Usuários", `Alterou perfil para "${perfil}"`, email, email);
    setDados(nd); await salvarDados(nd);
  };

  const adicionarUsuario = async () => {
    const email = novo.email.trim().toLowerCase();
    if (!novo.nome.trim()) { avisar("Informe o nome do usuário."); return; }
    if (!email.endsWith(DOMINIO) || email.length <= DOMINIO.length) { avisar(`O e-mail deve pertencer ao domínio ${DOMINIO}.`); return; }
    if (dados.usuarios[email]) { avisar("Este e-mail já está cadastrado."); return; }
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { nome: novo.nome.trim(), perfil: novo.perfil, ativo: true, permissoes: permissoesDefault() } } };
    nd = comLog(nd, usuario, "Usuários", "Cadastrou usuário", `${novo.nome.trim()} <${email}> — ${novo.perfil}`, email);
    setDados(nd); await salvarDados(nd);
    setNovo({ nome: "", email: "", perfil: "Usuário Comum" });
    avisar(`Usuário cadastrado. No primeiro acesso, ${novo.nome.trim().split(" ")[0]} criará a própria senha.`);
  };

  const editarNome = async (email, nome) => {
    if (!nome.trim() || nome.trim() === dados.usuarios[email].nome) return;
    const anterior = dados.usuarios[email].nome;
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...dados.usuarios[email], nome: nome.trim() } } };
    nd = comLog(nd, usuario, "Usuários", "Editou nome do usuário", `${email}: "${anterior}" → "${nome.trim()}"`, email);
    setDados(nd); await salvarDados(nd);
  };

  const removerUsuario = async (email) => {
    if (email === usuario.email) { avisar("Você não pode remover o próprio usuário logado."); return; }
    const admins = Object.entries(dados.usuarios).filter(([, u]) => u.perfil === "GM");
    if (dados.usuarios[email].perfil === "GM" && admins.length === 1) {
      avisar("Não é possível remover o último administrador do sistema."); return;
    }
    const { [email]: _, ...restantes } = dados.usuarios;
    // Remove o usuário excluído dos vínculos de responsabilidade dos demais
    const limpos = Object.fromEntries(Object.entries(restantes).map(([e, u]) =>
      [e, u.administradores ? { ...u, administradores: u.administradores.filter((a) => a !== email) } : u]));
    let nd = { ...dados, usuarios: limpos };
    nd = comLog(nd, usuario, "Usuários", "Removeu usuário", `${(dados.usuarios[email] && dados.usuarios[email].nome) || ""} <${email}>`, email);
    setDados(nd); await salvarDados(nd);
    avisar("Usuário removido. Ele perde o acesso ao sistema; as solicitações já registradas são preservadas.");
  };

  // Redefinir senha: apaga a atual; o usuário cria uma nova no próximo acesso,
  // ou o administrador define uma provisória digitada na hora (armazenada só como hash).
  const limparSenha = async (email) => {
    const { senha, ...semSenha } = dados.usuarios[email];
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: semSenha } };
    nd = comLog(nd, usuario, "Usuários", "Redefiniu senha (usuário criará nova no próximo acesso)", email, email);
    setDados(nd); await salvarDados(nd);
    setResetEmail(null); setNovaSenha("");
    avisar("Senha removida. O usuário criará uma nova no próximo acesso.");
  };

  const definirSenhaProvisoria = async (email) => {
    if (novaSenha.length < 6) { avisar("A senha provisória deve ter ao menos 6 caracteres."); return; }
    if (!criptoDisponivel()) { avisar("Este navegador não suporta o armazenamento seguro de senha."); return; }
    const salt = gerarSalt();
    const met = metodoHash();
    const hash = await hashSenha(novaSenha, salt, met);
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...dados.usuarios[email], senha: { salt, hash, metodo: met } } } };
    nd = comLog(nd, usuario, "Usuários", "Definiu senha provisória", email, email); // a senha em si nunca é registrada
    setDados(nd); await salvarDados(nd);
    setResetEmail(null); setNovaSenha("");
    avisar("Senha provisória definida. Recomende ao usuário trocá-la (Redefinir → criar nova no próximo acesso).");
  };

  // Checklist de permissões (Grupos/Subsistemas/Funcionalidades) — só GM edita.
  // Sem acesso ao Grupo/Subsistema: fica visível porém desabilitado para o usuário.
  // Dentro de um Subsistema já acessível: funcionalidades sem permissão ficam ocultas.
  // Implementação (com cascata) mora em alternarPermissaoUsuario, função de módulo reusada também
  // pela aba "Configurações" de dentro de cada Subsistema (ex.: Gestão de Procedimentos).
  const alternarPermissao = (email, categoria, id) => alternarPermissaoUsuario(dados, setDados, usuario, email, categoria, id);

  // Implementação mora em alternarAtivoUsuario (função de módulo, mesmo motivo acima).
  const alternarAtivo = (email) => alternarAtivoUsuario(dados, setDados, usuario, email);

  // Cadastro simplificado usado por um administrador de Subsistema (não-GM): o novo usuário
  // entra como "Usuário Comum", sem acesso a nada além do(s) Subsistema(s) que esse administrador
  // administra — ele não pode conceder acesso a áreas que não são dele.
  const criarUsuarioParaSubsistema = async () => {
    const email = novoSub.email.trim().toLowerCase();
    if (!novoSub.nome.trim()) { avisar("Informe o nome do usuário."); return; }
    if (!email.endsWith(DOMINIO) || email.length <= DOMINIO.length) { avisar(`O e-mail deve pertencer ao domínio ${DOMINIO}.`); return; }
    if (dados.usuarios[email]) { avisar("Este e-mail já está cadastrado."); return; }
    const permissoes = permissoesDefault();
    Object.keys(permissoes.subsistemas).forEach((id) => { permissoes.subsistemas[id] = subsistemasQueAdministro.includes(id); });
    Object.keys(permissoes.adminDe).forEach((id) => { permissoes.adminDe[id] = false; });
    CATALOGO_GRUPOS.forEach((g) => { permissoes.grupos[g.id] = g.subsistemas.some((s) => subsistemasQueAdministro.includes(s.id)); });
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { nome: novoSub.nome.trim(), perfil: "Usuário Comum", ativo: true, permissoes } } };
    nd = comLog(nd, usuario, "Usuários", "Cadastrou usuário (administrador de Subsistema)", `${novoSub.nome.trim()} <${email}>`, email);
    setDados(nd); await salvarDados(nd);
    setNovoSub({ nome: "", email: "" });
    avisar(`Usuário cadastrado com acesso ao(s) Subsistema(s) que você administra. No primeiro acesso, ${novoSub.nome.trim().split(" ")[0]} criará a própria senha.`);
  };

  const th = { padding: 8, fontSize: 11.5, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left" };
  const td = { padding: "8px", borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 14, color: CORES.azul };

  return (
    <Cartao style={{ maxWidth: "100%", margin: "0 auto", position: "relative" }}>
      {/* Configurações é o AURA 360° Planta como plataforma: cadastro/acesso de usuários e o log de
          eventos de plataforma (login, criação/edição de usuário). Ferramentas específicas de um
          Subsistema (Materiais, Registros de Compras, Administradores Responsáveis) NÃO ficam aqui —
          moraram dentro do próprio Subsistema (Administrativo → Compras e Cadastros), tanto para GM
          quanto para o administrador delegado. Registros aqui só mostra eventos de plataforma; nunca
          recebe atualizações de um Subsistema — essas só aparecem se a pessoa abrir o Subsistema. */}
      <div className="so-tela" style={{ display: "flex", gap: 8, marginBottom: 18, borderBottom: `1px solid ${CORES.cinzaClaro}`, paddingBottom: 12 }}>
        {(ehGM
          ? [["usuarios", "👥 Usuários"], ["registros", "📜 Registros (Auditoria)"], ["sobre", "ℹ️ Sobre"]]
          : [["usuarios", "👥 Usuários"], ["sobre", "ℹ️ Sobre"]]
        ).map(([id, rot]) => (
          <button key={id} onClick={() => setAba(id)} style={{
            padding: "8px 16px", border: "none", borderRadius: 6, cursor: "pointer", fontSize: 13.5, fontWeight: 700, fontFamily: "inherit",
            background: aba === id ? CORES.azul : CORES.cinzaClaro, color: aba === id ? "#fff" : CORES.azul,
          }}>{rot}</button>
        ))}
      </div>

      {aba === "registros" && ehGM && (
        <TelaAuditoria dados={dados} categoriasVisiveis={CATEGORIAS_PLATAFORMA} />
      )}

      {aba === "sobre" && (
        <div style={{ maxWidth: 560 }}>
          <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Sobre o sistema</h2>
          <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 18px" }}>Controle de versão e identificação do ambiente em execução.</p>
          <table style={{ borderCollapse: "collapse", width: "100%" }}>
            <tbody>
              {[
                ["Aplicativo", "AURA 360° Planta"],
                ["Versão", "v" + VERSAO_APP],
                ["Data da versão", formatarDataBR(VERSAO_DATA)],
                ["Ambiente", AMBIENTE_ROTULO + (AMBIENTE === "teste" ? " 🧪" : " ✅")],
              ].map(([k, v]) => (
                <tr key={k}>
                  <td style={{ ...td, fontWeight: 700, width: 160 }}>{k}</td>
                  <td style={td}>{v}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <p style={{ fontSize: 12, color: CORES.cinza, marginTop: 16, lineHeight: 1.6 }}>
            Este sistema é mantido em <strong>dois ambientes independentes</strong>: <strong>Testes</strong> (dados fictícios,
            para experimentação livre) e <strong>Homologação</strong> (ambiente oficial). Os dados de um ambiente nunca
            aparecem no outro. Consulte o histórico de versões (CHANGELOG) com o administrador do repositório.
          </p>
        </div>
      )}

      {aba === "usuarios" && ehGM && (
      <div>
      <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Configurações — Usuários</h2>
      <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 16px" }}>
        Somente usuários cadastrados aqui têm acesso ao sistema. Perfis: <strong>Usuário Comum</strong>, <strong>Administrador Subsistema</strong> (poderes
        delegados, restritos ao(s) Subsistema(s) marcados em "Administrador") e <strong>GM</strong> (administrador geral, acesso total).
        As senhas são armazenadas apenas como hash criptográfico — nem os administradores conseguem visualizá-las.
      </p>

      {/* Cadastro de novo usuário */}
      <div style={{ background: CORES.cinzaClaro, borderRadius: 10, padding: 16, marginBottom: 20 }}>
        <strong style={{ color: CORES.azul, fontSize: 13, textTransform: "uppercase", letterSpacing: ".05em" }}>Cadastrar usuário</strong>
        <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1.5fr 1fr auto", gap: 10, marginTop: 10, alignItems: "end" }}>
          <Campo label="Nome"><input style={inputStyle} value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} placeholder="Nome completo" /></Campo>
          <Campo label="E-mail"><input style={inputStyle} value={novo.email} onChange={(e) => setNovo({ ...novo, email: e.target.value })} placeholder={`nome.sobrenome${DOMINIO}`} /></Campo>
          <Campo label="Perfil">
            <select style={inputStyle} value={novo.perfil} onChange={(e) => setNovo({ ...novo, perfil: e.target.value })}>
              <option>Usuário Comum</option><option>Administrador Subsistema</option><option>GM</option>
            </select>
          </Campo>
          <Botao tipo="laranja" onClick={adicionarUsuario}>Adicionar</Botao>
        </div>
        <p style={{ fontSize: 11.5, color: CORES.cinza, margin: "8px 0 0" }}>O usuário cria a própria senha no primeiro acesso.</p>
      </div>

      <table style={{ borderCollapse: "collapse", width: "100%" }}>
        <thead><tr><th style={th}>Nome</th><th style={th}>E-mail</th><th style={th}>Perfil</th><th style={th}>Permissões (Grupos/Subsistemas)</th><th style={th}>Senha</th><th style={th}>Status</th><th style={th}>Ações</th></tr></thead>
        <tbody>
          {Object.entries(dados.usuarios).map(([email, u]) => (
            <tr key={email}>
              <td style={td}>
                <input style={{ ...inputStyle, padding: "5px 8px", fontSize: 13.5 }} defaultValue={u.nome} key={email + u.nome}
                  onBlur={(e) => editarNome(email, e.target.value)} title="Clique para editar o nome" />
              </td>
              <td style={td}>{email}{email === usuario.email ? <span style={{ fontSize: 11, color: CORES.laranja }}> (você)</span> : null}</td>
              <td style={td}>
                <select style={{ ...inputStyle, width: 160, padding: "5px 8px", fontSize: 13.5 }} value={u.perfil} onChange={(e) => mudarPerfil(email, e.target.value)}>
                  <option>Usuário Comum</option>
                  <option>Administrador Subsistema</option>
                  <option>GM</option>
                </select>
              </td>
              <td style={{ ...td, minWidth: 240 }}>
                {u.perfil === "GM" ? (
                  <span style={{ color: CORES.cinza, fontSize: 12.5 }}>— (GM tem acesso total)</span>
                ) : (() => {
                  const perm = u.permissoes || permissoesDefault();
                  const totalLiberado = CATALOGO_GRUPOS.reduce((n, g) => n + (perm.grupos[g.id] ? 1 : 0), 0);
                  const subsistemasComAcesso = CATALOGO_GRUPOS.flatMap((g) => g.subsistemas).filter((s) => perm.subsistemas[s.id]);
                  const ehAdminDoSubsistema = (s) => s.id === "POPS" ? !!(perm.papeisPops && perm.papeisPops.administrador) : !!(perm.adminDe && perm.adminDe[s.id]);
                  const alternarAdminDoSubsistema = (s) => s.id === "POPS"
                    ? alternarPapelPops(dados, setDados, usuario, email, "administrador")
                    : alternarPermissao(email, "adminDe", s.id);
                  const totalAdminDe = subsistemasComAcesso.filter(ehAdminDoSubsistema).length;
                  return (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-start" }}>
                      <DropdownMultiSelect rotulo="Permissões" resumo={`${totalLiberado}/${CATALOGO_GRUPOS.length} grupos`}>
                        <div style={{ display: "flex", flexDirection: "column", gap: 10, minWidth: 220 }}>
                          {CATALOGO_GRUPOS.map((g) => (
                            <div key={g.id}>
                              <label onClick={() => alternarPermissao(email, "grupos", g.id)} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: CORES.azul, fontWeight: 700, cursor: "pointer" }}>
                                <CheckboxTriEstado estado={estadoGrupo(perm, g)} />
                                {g.nome}
                              </label>
                              {g.subsistemas.length > 0 && (
                                <div style={{ marginLeft: 24, marginTop: 4, display: "flex", flexDirection: "column", gap: 4 }}>
                                  {g.subsistemas.map((s) => (
                                    <div key={s.id}>
                                      <label onClick={() => alternarPermissao(email, "subsistemas", s.id)} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: CORES.azul, cursor: "pointer" }}>
                                        <CheckboxTriEstado estado={estadoSubsistema(perm, s)} tamanho={14} />
                                        {s.nome}{s.externo ? " ↗" : ""}
                                      </label>
                                      {s.features.length > 0 && (
                                        <div style={{ marginLeft: 22, marginTop: 2, display: "flex", flexWrap: "wrap", gap: "2px 12px" }}>
                                          {s.features.map((f) => (
                                            <label key={f.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: CORES.cinza, cursor: "pointer" }}>
                                              <input type="checkbox" checked={perm.features[f.id] === true} onChange={() => alternarPermissao(email, "features", f.id)}
                                                style={{ width: 13, height: 13, accentColor: CORES.laranja }} />
                                              {f.nome}
                                            </label>
                                          ))}
                                        </div>
                                      )}
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          ))}
                          <p style={{ margin: 0, fontSize: 10.5, color: CORES.cinza, fontStyle: "italic" }}>
                            Marcar o Grupo/Subsistema dá acesso a ele como Leitor (só o Painel) — marque também as
                            telas específicas abaixo para liberar mais do que isso. Sem acesso ao Grupo/Subsistema:
                            fica visível, porém desabilitado.
                          </p>
                        </div>
                      </DropdownMultiSelect>
                      {u.perfil === "Administrador Subsistema" && (
                        <DropdownMultiSelect rotulo="Administrador" resumo={subsistemasComAcesso.length === 0 ? "nenhum liberado" : `${totalAdminDe}/${subsistemasComAcesso.length}`}>
                          <p style={{ margin: "0 0 8px", fontSize: 10.5, color: CORES.cinza, maxWidth: 240 }}>
                            Marque de qual(is) Subsistema(s) este usuário é administrador — só aparecem aqui os Subsistemas
                            que ele já acessa em "Permissões"; tirar o acesso a um Subsistema também remove a administração
                            dele. Gestão de Procedimentos usa o mesmo Papel "Administrador" atribuído em Configurações →
                            Usuários e Acessos, dentro do próprio Subsistema — marcar aqui ou lá dá no mesmo.
                          </p>
                          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                            {subsistemasComAcesso.map((s) => (
                              <label key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: CORES.azul, cursor: "pointer" }}>
                                <input type="checkbox" checked={ehAdminDoSubsistema(s)} onChange={() => alternarAdminDoSubsistema(s)}
                                  style={{ width: 14, height: 14, accentColor: CORES.laranja }} />
                                {s.nome}
                              </label>
                            ))}
                            {subsistemasComAcesso.length === 0 && (
                              <span style={{ fontSize: 11, color: CORES.cinza, fontStyle: "italic" }}>Libere o acesso a algum Subsistema em "Permissões" antes de torná-lo administrador dele.</span>
                            )}
                          </div>
                        </DropdownMultiSelect>
                      )}
                    </div>
                  );
                })()}
              </td>
              <td style={{ ...td, fontSize: 12.5 }}>
                {AUTENTICACAO_REAL
                  ? <span style={{ color: CORES.cinza }}>Login Microsoft</span>
                  : u.senha ? <span style={{ color: "seagreen" }}>Definida ✓</span> : <span style={{ color: CORES.laranja }}>Criará no 1º acesso</span>}
              </td>
              <td style={{ ...td, whiteSpace: "nowrap" }}>
                <Botao tipo={u.ativo === false ? "contorno" : "perigo"} style={{ padding: "4px 10px", fontSize: 12 }} disabled={email === usuario.email}
                  title={email === usuario.email ? "Não é possível desativar o próprio usuário" : ""}
                  onClick={() => alternarAtivo(email)}>{u.ativo === false ? "Desativado — Reativar" : "Ativo — Desativar"}</Botao>
              </td>
              <td style={{ ...td, whiteSpace: "nowrap" }}>
                {!AUTENTICACAO_REAL && <Botao tipo="contorno" style={{ padding: "4px 10px", fontSize: 12, marginRight: 6 }}
                  onClick={() => { setResetEmail(resetEmail === email ? null : email); setNovaSenha(""); }}>Redefinir senha</Botao>}
                <Botao tipo="perigo" style={{ padding: "4px 10px", fontSize: 12 }} disabled={email === usuario.email}
                  title={email === usuario.email ? "Não é possível remover o próprio usuário" : "Remover acesso"}
                  onClick={() => removerUsuario(email)}>Remover</Botao>
                {resetEmail === email && (
                  <div style={{ marginTop: 8, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                    <input style={{ ...inputStyle, width: 180, padding: "5px 8px", fontSize: 13 }} type="password" value={novaSenha}
                      onChange={(e) => setNovaSenha(e.target.value)} placeholder="Senha provisória (mín. 6)" />
                    <Botao style={{ padding: "5px 10px", fontSize: 12 }} onClick={() => definirSenhaProvisoria(email)}>Definir</Botao>
                    <Botao tipo="contorno" style={{ padding: "5px 10px", fontSize: 12 }} onClick={() => limparSenha(email)}
                      title="O usuário criará a nova senha no próximo acesso">Limpar (criará no acesso)</Botao>
                  </div>
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      </div>
      )}

      {/* Usuários — versão restrita para quem é "Administrador Subsistema" (não-GM): só toca no(s)
          Subsistema(s) que lhe foram delegados. Sem perfil, sem "administradores responsáveis",
          sem outros Subsistemas — e sem excluir usuário (isso continua só do GM). */}
      {aba === "usuarios" && !ehGM && (() => {
        const nomesAdmin = subsistemasQueAdministro.map((id) => (CATALOGO_GRUPOS.flatMap((g) => g.subsistemas).find((s) => s.id === id) || {}).nome || id);
        const linhas = Object.entries(dados.usuarios).filter(([, u]) => u.perfil !== "GM");
        return (
          <div>
            <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Administração — {nomesAdmin.join(", ")}</h2>
            <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 16px" }}>
              Você administra {nomesAdmin.length > 1 ? "estes Subsistemas" : "este Subsistema"} por delegação do GM: pode liberar/bloquear
              o acesso de usuários a ele(s), cadastrar novos usuários e desativar acessos. Outras áreas do AURA 360° Planta
              (outros Subsistemas, perfis, senhas) continuam só com o GM.
            </p>

            <div style={{ background: CORES.cinzaClaro, borderRadius: 10, padding: 16, marginBottom: 20 }}>
              <strong style={{ color: CORES.azul, fontSize: 13, textTransform: "uppercase", letterSpacing: ".05em" }}>Cadastrar usuário</strong>
              <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1.5fr auto", gap: 10, marginTop: 10, alignItems: "end" }}>
                <Campo label="Nome"><input style={inputStyle} value={novoSub.nome} onChange={(e) => setNovoSub({ ...novoSub, nome: e.target.value })} placeholder="Nome completo" /></Campo>
                <Campo label="E-mail"><input style={inputStyle} value={novoSub.email} onChange={(e) => setNovoSub({ ...novoSub, email: e.target.value })} placeholder={`nome.sobrenome${DOMINIO}`} /></Campo>
                <Botao tipo="laranja" onClick={criarUsuarioParaSubsistema}>Adicionar</Botao>
              </div>
              <p style={{ fontSize: 11.5, color: CORES.cinza, margin: "8px 0 0" }}>
                Entra como Usuário Comum, já com acesso a {nomesAdmin.join(", ")}. Cria a própria senha no primeiro acesso.
              </p>
            </div>

            <table style={{ borderCollapse: "collapse", width: "100%" }}>
              <thead><tr>
                <th style={th}>Nome</th><th style={th}>E-mail</th>
                {subsistemasQueAdministro.map((subId) => <th key={subId} style={th}>{nomesAdmin[subsistemasQueAdministro.indexOf(subId)]}</th>)}
                <th style={th}>Status</th>
              </tr></thead>
              <tbody>
                {linhas.map(([email, u]) => {
                  const perm = u.permissoes || permissoesDefault();
                  return (
                    <tr key={email}>
                      <td style={td}>{u.nome}</td>
                      <td style={td}>{email}</td>
                      {subsistemasQueAdministro.map((subId) => {
                        const sub = CATALOGO_GRUPOS.flatMap((g) => g.subsistemas).find((s) => s.id === subId) || { features: [] };
                        return (
                          <td key={subId} style={{ ...td, minWidth: 170 }}>
                            {/* Sem checkbox de "acesso" separado: marcar uma tela já libera o
                                Subsistema como consequência (ver alternarPermissaoUsuario) — mesmo
                                padrão de Papéis marcados diretamente usado em Gestão de Procedimentos. */}
                            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                              {sub.features.map((f) => (
                                <label key={f.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: CORES.azul, cursor: "pointer" }}>
                                  <input type="checkbox" checked={perm.features[f.id] === true} onChange={() => alternarPermissao(email, "features", f.id)}
                                    style={{ width: 14, height: 14, accentColor: CORES.laranja }} />
                                  {f.nome}
                                </label>
                              ))}
                              {sub.features.length === 0 && <span style={{ fontSize: 11.5, color: CORES.cinza, fontStyle: "italic" }}>Sem telas configuráveis</span>}
                            </div>
                          </td>
                        );
                      })}
                      <td style={{ ...td, whiteSpace: "nowrap" }}>
                        <Botao tipo={u.ativo === false ? "contorno" : "perigo"} style={{ padding: "4px 10px", fontSize: 12 }} disabled={email === usuario.email}
                          onClick={() => alternarAtivo(email)}>{u.ativo === false ? "Desativado — Reativar" : "Ativo — Desativar"}</Botao>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })()}
    </Cartao>
  );
}

/* ============================================================
   Login — Microsoft Entra ID (MSAL)
   ------------------------------------------------------------
   >>> CONFIGURAÇÃO PELA TI (Portal do Azure → Entra ID → Registros de Aplicativo):
   1. Novo registro: "Solicitação de Compras Aura" | Conta somente neste diretório (single tenant)
   2. Plataforma: SPA (Single-Page Application) | Redirect URI = URL onde este app será hospedado
   3. Permissões delegadas (API do Microsoft Graph, com consentimento do admin):
      User.Read | Mail.Send | Files.Read.All | Sites.ReadWrite.All | Sites.Manage.All
   4. Copiar "ID do aplicativo (cliente)" e "ID do diretório (locatário)" para os campos abaixo.
   Enquanto vazios, o app roda em MODO DEMONSTRAÇÃO (login simulado, sem validação real).
   ============================================================ */
const MSAL_CONFIG = {
  clientId: "",   // ← TI: colar aqui o ID do aplicativo (cliente)
  tenantId: "",   // ← TI: colar aqui o ID do diretório (locatário) da Aura Minerals
};
const AUTENTICACAO_REAL = !!(MSAL_CONFIG.clientId && MSAL_CONFIG.tenantId && typeof window !== "undefined" && window.msal);

/* ============================================================
   E-mails — templates e envio
   - Modo real (Entra ID configurado): envio AUTOMÁTICO via Microsoft Graph (Mail.Send)
   - Modo demonstração: abre o aplicativo de e-mail com a mensagem pronta (basta clicar Enviar)
   ============================================================ */
/* Layout padrão dos comunicados internos Aura (HTML de e-mail, estilos inline p/ Outlook) */

async function enviarEmailGraph(msg) {
  if (!AUTENTICACAO_REAL) return null; // sem Entra ID não há envio automático
  try {
    const app = obterMsal();
    const conta = app.getAllAccounts()[0];
    if (!conta) return null;
    let token;
    try { token = (await app.acquireTokenSilent({ scopes: ["Mail.Send"], account: conta })).accessToken; }
    catch (e) { token = (await app.acquireTokenPopup({ scopes: ["Mail.Send"] })).accessToken; }
    const resp = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
      method: "POST",
      headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: {
          subject: msg.assunto,
          body: msg.corpoHtml ? { contentType: "HTML", content: msg.corpoHtml } : { contentType: "Text", content: msg.corpo },
          toRecipients: msg.para.map((a) => ({ emailAddress: { address: a } })),
        },
        saveToSentItems: true,
      }),
    });
    return { enviado: resp.ok };
  } catch (e) { return null; }
}

let _msalApp = null;
function obterMsal() {
  if (!_msalApp) {
    _msalApp = new window.msal.PublicClientApplication({
      auth: {
        clientId: MSAL_CONFIG.clientId,
        authority: `https://login.microsoftonline.com/${MSAL_CONFIG.tenantId}`, // single tenant: só contas reais da Aura
        redirectUri: window.location.origin + window.location.pathname,
      },
      cache: { cacheLocation: "sessionStorage" },
    });
  }
  return _msalApp;
}

/* ============================================================
   DADOS MULTIUSUÁRIO — SharePoint Lists via Microsoft Graph
   ------------------------------------------------------------
   Com o Entra ID ativo, solicitações, cadastros e usuários ficam em
   listas compartilhadas em um site do SharePoint — todos os usuários
   veem os mesmos dados. As listas são criadas automaticamente na 1ª vez.
   Permissões Graph (delegadas): Sites.ReadWrite.All (+ Sites.Manage.All
   apenas para a criação inicial das listas).
   Sem Entra ID (demonstração), os dados permanecem locais no navegador.
   ============================================================ */
const SP_SITE_HOST = "tenant-teste.sharepoint.com";
const SP_SITE_PATH = "/sites/Site_Teste";
const _SP_SUFIXO = AMBIENTE === "teste" ? "Teste" : "";
const SP_LISTAS = { compras: "AuraSolicitacoesCompras" + _SP_SUFIXO, cadastros: "AuraSolicitacoesCadastros" + _SP_SUFIXO, usuarios: "AuraUsuariosSistema" + _SP_SUFIXO, auditoria: "AuraLogAuditoria" + _SP_SUFIXO };

let _spSiteId = null;
let _spListIds = {};
let _spItemIds = { compras: {}, cadastros: {}, usuarios: {}, auditoria: {} }; // id do registro -> id do item na lista
let _ultimoSync = null; // último estado sincronizado (base do diff)

async function tokenGraph(scopes) {
  const app = obterMsal();
  const conta = app.getAllAccounts()[0];
  if (!conta) throw new Error("sem sessão Microsoft");
  try { return (await app.acquireTokenSilent({ scopes, account: conta })).accessToken; }
  catch (e) { return (await app.acquireTokenPopup({ scopes })).accessToken; }
}

async function gfetch(url, opts = {}, scopes = ["Sites.ReadWrite.All"]) {
  const t = await tokenGraph(scopes);
  const r = await fetch("https://graph.microsoft.com/v1.0" + url, {
    ...opts,
    headers: { Authorization: `Bearer ${t}`, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (!r.ok) throw new Error(`Graph ${r.status} em ${url}`);
  return r;
}

async function spSite() {
  if (_spSiteId) return _spSiteId;
  const r = await gfetch(`/sites/${SP_SITE_HOST}:${SP_SITE_PATH}`);
  _spSiteId = (await r.json()).id;
  return _spSiteId;
}

async function spLista(chave) {
  if (_spListIds[chave]) return _spListIds[chave];
  const site = await spSite();
  const nome = SP_LISTAS[chave];
  try {
    const r = await gfetch(`/sites/${site}/lists?$filter=displayName eq '${nome}'`);
    const j = await r.json();
    if (j.value && j.value.length) { _spListIds[chave] = j.value[0].id; return _spListIds[chave]; }
  } catch (e) { /* segue para criação */ }
  // Cria a lista automaticamente (1ª execução) — requer Sites.Manage.All
  const r = await gfetch(`/sites/${site}/lists`, {
    method: "POST",
    body: JSON.stringify({
      displayName: nome,
      list: { template: "genericList" },
      columns: [{ name: "Dados", text: { allowMultipleLines: true, textType: "plain" } }],
    }),
  }, ["Sites.Manage.All"]);
  const j = await r.json();
  if (!j.id) throw new Error("não foi possível criar a lista " + nome);
  _spListIds[chave] = j.id;
  return j.id;
}

async function spCarregarLista(chave) {
  const site = await spSite();
  const lista = await spLista(chave);
  let url = `/sites/${site}/lists/${lista}/items?expand=fields(select=Title,Dados)&$top=200`;
  const regs = [];
  _spItemIds[chave] = {};
  while (url) {
    const r = await gfetch(url);
    const j = await r.json();
    for (const it of (j.value || [])) {
      try {
        const id = it.fields.Title;
        _spItemIds[chave][id] = it.id;
        regs.push({ id, dado: JSON.parse(it.fields.Dados || "{}") });
      } catch (e) { /* item corrompido: ignora */ }
    }
    url = j["@odata.nextLink"] ? j["@odata.nextLink"].replace("https://graph.microsoft.com/v1.0", "") : null;
  }
  return regs;
}

async function spCriar(chave, id, dado) {
  const site = await spSite();
  const lista = await spLista(chave);
  const r = await gfetch(`/sites/${site}/lists/${lista}/items`, {
    method: "POST",
    body: JSON.stringify({ fields: { Title: String(id), Dados: JSON.stringify(dado) } }),
  });
  const j = await r.json();
  if (j.id) _spItemIds[chave][id] = j.id;
}

async function spAtualizar(chave, id, dado) {
  const itemId = _spItemIds[chave][id];
  if (!itemId) { await spCriar(chave, id, dado); return; }
  const site = await spSite();
  const lista = await spLista(chave);
  await gfetch(`/sites/${site}/lists/${lista}/items/${itemId}/fields`, {
    method: "PATCH",
    body: JSON.stringify({ Dados: JSON.stringify(dado) }),
  });
}

async function spExcluir(chave, id) {
  const itemId = _spItemIds[chave][id];
  if (!itemId) return;
  const site = await spSite();
  const lista = await spLista(chave);
  await gfetch(`/sites/${site}/lists/${lista}/items/${itemId}`, { method: "DELETE" });
  delete _spItemIds[chave][id];
}

// Carrega o estado compartilhado completo das listas
async function carregarDoGraph() {
  const [cps, cds, us, aud] = await Promise.all([
    spCarregarLista("compras"), spCarregarLista("cadastros"), spCarregarLista("usuarios"), spCarregarLista("auditoria"),
  ]);
  let usuarios = {};
  us.forEach((r) => { usuarios[r.id] = r.dado; });
  usuarios = migrarUsuarios(usuarios);
  // Garante o primeiro administrador (0.1)
  if (!usuarios[PRIMEIRO_ADMIN]) {
    usuarios[PRIMEIRO_ADMIN] = { nome: nomeDoEmail(PRIMEIRO_ADMIN), perfil: "GM" };
    await spCriar("usuarios", PRIMEIRO_ADMIN, usuarios[PRIMEIRO_ADMIN]);
  } else if (usuarios[PRIMEIRO_ADMIN].perfil !== "GM") {
    usuarios[PRIMEIRO_ADMIN].perfil = "GM";
    await spAtualizar("usuarios", PRIMEIRO_ADMIN, usuarios[PRIMEIRO_ADMIN]);
  }
  // Auditoria: ordenada por carimbo (ts) para exibição estável e cronológica
  const auditoria = aud.map((r) => r.dado).sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));
  return { compras: cps.map((r) => r.dado), cadastros: cds.map((r) => r.dado), usuarios, auditoria };
}

// Envia ao SharePoint apenas o que mudou (criações, alterações e exclusões)
async function sincronizarGraph(anterior, novo) {
  for (const chave of ["compras", "cadastros"]) {
    const antes = new Map((anterior[chave] || []).map((x) => [x.id, x]));
    const depois = new Map((novo[chave] || []).map((x) => [x.id, x]));
    for (const [id, reg] of depois) {
      if (!antes.has(id)) await spCriar(chave, id, reg);
      else if (JSON.stringify(antes.get(id)) !== JSON.stringify(reg)) await spAtualizar(chave, id, reg);
    }
    for (const id of antes.keys()) if (!depois.has(id)) await spExcluir(chave, id);
  }
  // Usuários: nunca grava hash de senha na lista compartilhada (modo real usa o login Microsoft)
  const semSenha = (u) => { const { senha, ...pub } = u || {}; return pub; };
  const uAntes = anterior.usuarios || {};
  const uDepois = novo.usuarios || {};
  for (const [email, u] of Object.entries(uDepois)) {
    if (!uAntes[email]) await spCriar("usuarios", email, semSenha(u));
    else if (JSON.stringify(semSenha(uAntes[email])) !== JSON.stringify(semSenha(u))) await spAtualizar("usuarios", email, semSenha(u));
  }
  for (const email of Object.keys(uAntes)) if (!uDepois[email]) await spExcluir("usuarios", email);
  // Auditoria: APPEND-ONLY — apenas novos registros são criados; nunca se altera ou exclui (imutabilidade SOX)
  const audAntes = new Set((anterior.auditoria || []).map((x) => x.id));
  for (const reg of (novo.auditoria || [])) {
    if (!audAntes.has(reg.id)) await spCriar("auditoria", reg.id, reg);
  }
}

// Anexos dos cadastros: enviados para a pasta AuraAnexosCadastros na biblioteca do site
let _pastaAnexosOk = false;
async function garantirPastaAnexos() {
  if (_pastaAnexosOk) return;
  const site = await spSite();
  try {
    await gfetch(`/sites/${site}/drive/root/children`, {
      method: "POST",
      body: JSON.stringify({ name: "AuraAnexosCadastros", folder: {}, "@microsoft.graph.conflictBehavior": "fail" }),
    });
  } catch (e) { /* já existe */ }
  _pastaAnexosOk = true;
}
async function enviarAnexoSharePoint(arquivo) {
  await garantirPastaAnexos();
  const site = await spSite();
  const nomeSeguro = Date.now().toString(36) + "_" + arquivo.name.replace(/[^\w.\-]+/g, "_");
  const t = await tokenGraph(["Sites.ReadWrite.All"]);
  const r = await fetch(`https://graph.microsoft.com/v1.0/sites/${site}/drive/root:/AuraAnexosCadastros/${nomeSeguro}:/content`, {
    method: "PUT",
    headers: { Authorization: `Bearer ${t}`, "Content-Type": arquivo.type || "application/octet-stream" },
    body: await arquivo.arrayBuffer(),
  });
  if (!r.ok) throw new Error("upload do anexo falhou: " + r.status);
  const j = await r.json();
  return { nome: arquivo.name, url: j.webUrl };
}

function TelaLogin({ aoEntrar, tentarLoginDemo, criarSenhaELogar, resetPrimeiroAdmin }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [senha2, setSenha2] = useState("");
  const [fase, setFase] = useState("login"); // "login" | "criarSenha"
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  // ---- Modo real: login via popup da Microsoft (valida credenciais de verdade) ----
  const entrarMicrosoft = async () => {
    setErro(""); setCarregando(true);
    try {
      const resp = await obterMsal().loginPopup({ scopes: ["User.Read", "Mail.Send"] });
      const conta = resp.account;
      const e = (conta.username || "").toLowerCase();
      if (!e.endsWith(DOMINIO)) {
        setErro(`Esta conta não pertence ao domínio ${DOMINIO}.`);
      } else {
        const r = await aoEntrar(e, conta.name); // valida se o usuário está cadastrado no sistema
        if (r && r.erro) setErro(r.erro);
      }
    } catch (ex) {
      if (!String(ex).includes("user_cancelled")) setErro("Falha na autenticação Microsoft. Tente novamente ou contate a TI.");
    } finally { setCarregando(false); }
  };

  // ---- Modo demonstração: e-mail cadastrado + senha ----
  const entrarDemo = async () => {
    setErro("");
    const e = email.trim().toLowerCase();
    if (!e.endsWith(DOMINIO)) { setErro(`Acesso permitido apenas para contas do domínio ${DOMINIO}.`); return; }
    setCarregando(true);
    const r = await tentarLoginDemo(e, senha);
    setCarregando(false);
    if (r.erro) setErro(r.erro);
    else if (r.criarSenha) { setFase("criarSenha"); setSenha(""); }
  };

  const confirmarNovaSenha = async () => {
    setErro("");
    if (senha.length < 6) { setErro("A senha deve ter ao menos 6 caracteres."); return; }
    if (senha !== senha2) { setErro("As senhas não conferem."); return; }
    setCarregando(true);
    const r = await criarSenhaELogar(email.trim().toLowerCase(), senha);
    setCarregando(false);
    if (r && r.erro) setErro(r.erro);

function App() {
  const [dados, setDados] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [area, setArea] = useState(null); // null = Home do portal | "ADMIN" | "SEG" | "OPER"
  const [tela, setTela] = useState("MENU"); // navegação dentro da área Administrativo
  const [appAdmin, setAppAdmin] = useState(null); // segundo menu do Administrativo: null | "COMPRAS" (futuros sistemas entram aqui)
  const [emails, setEmails] = useState(null);
  const [configAba, setConfigAba] = useState("usuarios"); // aba ativa em Configurações (usado no atalho/breadcrumb)
  const [sistemaEmbutido, setSistemaEmbutido] = useState(null); // subsistema externo aberto embutido (iframe), sem janela/aba extra

  useEffect(() => {
    (async () => {
      const d = await carregarDados();
      setDados(d);
      try {
        const s = await window.storage.get(SESSION_KEY, false);
        if (s && s.value) {
          const email = JSON.parse(s.value);
          if (d.usuarios[email]) setUsuario({ email, ...d.usuarios[email] });
        }
      } catch (e) { /* sem sessão */ }
    })();
  }, []);

  // Acesso restrito: apenas usuários cadastrados entram no sistema
  const concluirLogin = async (email, nomeOficial, d0) => {
    let d = d0 || dados || dadosVazios();
    if (nomeOficial && d.usuarios[email] && d.usuarios[email].nome !== nomeOficial) {
      d = { ...d, usuarios: { ...d.usuarios, [email]: { ...d.usuarios[email], nome: nomeOficial } } };
      setDados(d); await salvarDados(d);
    }
    const perfilU = d.usuarios[email] || {};
    d = comLog(d, { email, nome: perfilU.nome, perfil: perfilU.perfil }, "Acesso", "Entrou no sistema", AUTENTICACAO_REAL ? "Login Microsoft (Entra ID)" : "Login (modo demonstração)", email);
    setDados(d); await salvarDados(d);
    setUsuario({ email, ...d.usuarios[email] });
    try { await window.storage.set(SESSION_KEY, JSON.stringify(email), false); } catch (e) {}
    setArea(null); setTela("MENU");
  };

  // Modo real (Entra ID): a Microsoft valida a credencial; o SharePoint traz os dados compartilhados
  const entrar = async (email, nomeOficial) => {
    let d = dados || dadosVazios();
    if (AUTENTICACAO_REAL) {
      try {
        const dG = await carregarDoGraph();
        d = { ...d, ...dG };
        _ultimoSync = fotografar(d);
        setDados(d);
        try { await window.storage.set(STORAGE_KEY, JSON.stringify(d), true); } catch (e) {}
      } catch (e) {
        console.error(e);
        return { erro: "Conta autenticada, mas não foi possível acessar as listas do sistema no SharePoint. Peça à TI para verificar as permissões do aplicativo (Sites.ReadWrite.All e Sites.Manage.All)." };
      }
    }
    if (!d.usuarios[email]) return { erro: "Conta autenticada, mas não cadastrada no sistema. Solicite acesso a um administrador." };
    if (d.usuarios[email].ativo === false) return { erro: "Este usuário está desativado. Solicite reativação a um administrador." };
    await concluirLogin(email, nomeOficial, d);
    return { ok: true };
  };

  // Modo demonstração: e-mail cadastrado + senha (hash)
  const tentarLoginDemo = async (email, senha) => {
    const d = dados || dadosVazios();
    const u = d.usuarios[email];
    if (!u) return { erro: "E-mail não cadastrado. Solicite acesso a um administrador do sistema." };
    if (u.ativo === false) return { erro: "Este usuário está desativado. Solicite reativação a um administrador." };
    if (!u.senha) return { criarSenha: true }; // primeiro acesso: define a própria senha
    if (!criptoDisponivel()) return { erro: "Este navegador não suporta a verificação segura de senha." };
    try {
      const h = await hashSenha(senha || "", u.senha.salt, u.senha.metodo);
      if (h !== u.senha.hash) return { erro: "Senha incorreta." };
    } catch (e) { return { erro: "Falha na verificação da senha." }; }
    await concluirLogin(email);
    return { ok: true };
  };

  const criarSenhaELogar = async (email, senha) => {
    const d0 = dados || dadosVazios();
    if (!d0.usuarios[email]) return { erro: "E-mail não cadastrado." };
    if (d0.usuarios[email].ativo === false) return { erro: "Este usuário está desativado. Solicite reativação a um administrador." };
    if (!criptoDisponivel()) return { erro: "Este navegador não suporta o armazenamento seguro de senha." };
    try {
      const salt = gerarSalt();
      const met = metodoHash();
      const hash = await hashSenha(senha, salt, met);
      const d = { ...d0, usuarios: { ...d0.usuarios, [email]: { ...d0.usuarios[email], senha: { salt, hash, metodo: met } } } };
      setDados(d); await salvarDados(d);
      await concluirLogin(email, undefined, d);
      return { ok: true };
    } catch (e) { return { erro: "Falha ao salvar a senha." }; }
  };

  // Recuperação (modo demonstração): limpa a senha do primeiro administrador para que ele
  // crie uma nova no próximo acesso — evita bloqueio caso a senha seja esquecida.
  const resetPrimeiroAdmin = async () => {
    const d0 = dados || dadosVazios();
    const u = d0.usuarios[PRIMEIRO_ADMIN] || { nome: nomeDoEmail(PRIMEIRO_ADMIN), perfil: "GM" };
    const { senha, ...semSenha } = u;
    let nd = { ...d0, usuarios: { ...d0.usuarios, [PRIMEIRO_ADMIN]: { ...semSenha, perfil: "GM" } } };
    nd = comLog(nd, { email: PRIMEIRO_ADMIN, nome: semSenha.nome, perfil: "GM" }, "Acesso", "Redefiniu a própria senha (primeiro administrador) pela tela de login", "", PRIMEIRO_ADMIN);
    setDados(nd); await salvarDados(nd);
    return { ok: true };
  };

  // Multiusuário: recarrega os dados compartilhados a cada 60s (modo Entra ID)
  useEffect(() => {
    if (!usuario || !AUTENTICACAO_REAL) return;
    const t = setInterval(async () => {
      try {
        const dG = await carregarDoGraph();
        _ultimoSync = fotografar(dG);
        setDados((prev) => ({ ...prev, ...dG }));
      } catch (e) { /* offline momentâneo: tenta no próximo ciclo */ }
    }, 60000);
    return () => clearInterval(t);
  }, [usuario]);

  const sair = async () => {
    if (dados && usuario) {
      const d = comLog(dados, usuario, "Acesso", "Saiu do sistema", "", usuario.email);
      setDados(d); await salvarDados(d);
    }
    setUsuario(null); setArea(null); setTela("MENU"); setAppAdmin(null);
    try { await window.storage.delete(SESSION_KEY, false); } catch (e) {}
  };

  const listaAdmins = (d) => Object.entries(d.usuarios).filter(([, u]) => u.perfil === "GM").map(([e]) => e);

  // Tenta envio automático (Graph); sem Entra ID, prepara o e-mail para abrir no Outlook
  const notificar = async (mensagens) => {
    const resultados = [];
    for (const m of mensagens) {
      const r = await enviarEmailGraph(m);
      resultados.push({ ...m, enviado: !!(r && r.enviado) });
    }
    setEmails({ resultados });
  };

  // Novos pedidos: confirmação ao solicitante + alerta aos administradores RESPONSÁVEIS pelo solicitante
  const notificarSolicitacao = (tipo, u, d, resumo, dataHora, tabela) => {
    // Administradores vinculados ao usuário; sem vínculo definido, alerta todos (garantia de que nada se perde)
    const vinculados = ((d.usuarios[u.email] && d.usuarios[u.email].administradores) || [])
      .filter((e) => d.usuarios[e] && d.usuarios[e].perfil === "GM");
    const admins = vinculados.length ? vinculados : listaAdmins(d);
    const rotuloAdmins = vinculados.length
      ? `Alerta aos administradores responsáveis (${tipo})`
      : `Alerta aos administradores (${tipo}) — solicitante sem responsável vinculado`;
    const htmlAdmin = tabela ? emailHtml({
      subtitulo: `Nova Solicitação de ${tipo}`,
      saudacao: "Administrador(a)",
      intro: `Informamos que uma nova solicitação de <strong>${tipo.toUpperCase()}</strong> foi registrada no sistema por <strong>${u.nome}</strong> em ${dataHora} e aguarda sua análise.`,
      cabecalhos: tabela.cabecalhos, linhas: tabela.linhas,
      observacao: "Acesse o sistema (menu <strong>Relatórios</strong>) para analisar, concluir ou cancelar a solicitação.",
    }) : undefined;
    const htmlUsuario = tabela ? emailHtml({
      subtitulo: `Recebemos sua Solicitação de ${tipo}`,
      saudacao: u.nome,
      intro: `Sua solicitação de <strong>${tipo.toUpperCase()}</strong> foi registrada com sucesso em ${dataHora}. Os administradores do sistema já foram notificados.`,
      cabecalhos: tabela.cabecalhos, linhas: tabela.linhas,
      observacao: "Você pode acompanhar o andamento pelo sistema e será avisado(a) por e-mail a cada etapa (solicitado, concluído ou cancelado).",
    }) : undefined;
    notificar([
      { rotulo: "Confirmação ao solicitante", para: [u.email], ...tplConfirmacao(u.nome, tipo, resumo, dataHora), corpoHtml: htmlUsuario },
      { rotulo: rotuloAdmins, para: admins, ...tplAlertaAdmin(u.nome, tipo, resumo, dataHora), corpoHtml: htmlAdmin },
    ]);
  };

  // Mudança de etapa: informa o solicitante original (comunicado HTML padrão Aura)
  const notificarEtapa = (registro, etapa, detalhes, registradoPor) => {
    if (!registro.email) return;
    const html = emailHtml({
      subtitulo: `Atualização de Solicitação — ${etapa}`,
      saudacao: registro.solicitante,
      intro: `Houve uma atualização em uma solicitação sua registrada no sistema.`,
      cabecalhos: ["Item", "Nova etapa", "Detalhes", "Registrado por", "Data/Hora"],
      linhas: [[registro.descricao || "", etapa, detalhes || "—", registradoPor, agoraStr()]],
      observacao: "Consulte os detalhes completos na tela de <strong>Relatórios</strong> do sistema.",
    });
    notificar([
      { rotulo: `Aviso ao solicitante — ${etapa}`, para: [registro.email], ...tplEtapa(registro.solicitante, registro.descricao || "", etapa, detalhes, registradoPor), corpoHtml: html },
    ]);
  };

  if (!dados) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: CORES.cinzaClaro, color: CORES.azul, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      Carregando sistema…
    </div>
  );
  if (!usuario) return <TelaLogin aoEntrar={entrar} tentarLoginDemo={tentarLoginDemo} criarSenhaELogar={criarSenhaELogar} resetPrimeiroAdmin={resetPrimeiroAdmin} />;

  // perfil sempre atualizado (caso um admin altere)
  const usuarioAtual = { ...usuario, ...(dados.usuarios[usuario.email] || {}) };

  const MENU = [
    { id: "COMPRAS", rotulo: "Solicitação de Compras", icone: "🛒", desc: "Requisite itens da base de materiais", feature: "TELA_COMPRAS" },
    { id: "CADASTROS", rotulo: "Solicitação de Cadastros", icone: "📋", desc: "Solicite cadastro de novos materiais", feature: "TELA_CADASTROS" },
  ];
  // Funcionalidades sem permissão ficam OCULTAS (o usuário já está dentro de um Subsistema ao qual tem acesso)
  const ehGM = EH_GM(usuarioAtual);
  const subsistemasQueAdministroApp = subsistemasAdministradosPor(usuarioAtual);
  const souAdminDeAlgumSubsistema = subsistemasQueAdministroApp.length > 0;
  const permissoesUsuario = usuarioAtual.permissoes || permissoesDefault();
  const MENU_VISIVEL = ehGM ? MENU : MENU.filter((m) => permissoesUsuario.features[m.feature] === true);
  // Ferramentas administrativas do próprio Subsistema Compras e Cadastros — moram AQUI, dentro do
  // Subsistema, e não em Configurações (que é só a plataforma AURA 360° como um todo). Só GM ou
  // quem administra Compras e Cadastros por delegação enxerga essas telas. Materiais, Registros
  // (Auditoria) e Administradores Responsáveis ficam juntos dentro de Configurações — nenhuma das
  // três é vista por um usuário comum, então não precisam de itens próprios na sidebar.
  const MENU_ADMIN_COMPRAS = [
    { id: "RELATORIOS", rotulo: "Relatórios de Compras / Cadastros", icone: "📊" },
    { id: "CONFIGURACOES", rotulo: "Configurações", icone: "⚙️" },
  ];
  const souAdminDeCompras = ehGM || subsistemasQueAdministroApp.includes("COMPRAS");
  // Painel é a primeira tela do Subsistema (antes de Solicitação de Compras/Cadastros/Relatórios) —
  // sempre visível a quem acessa o Subsistema, sem depender do checklist de funcionalidades.
  const itensAdmin = [{ id: "PAINEL", rotulo: "Painel", icone: "📊" }, ...MENU_VISIVEL, ...(souAdminDeCompras ? MENU_ADMIN_COMPRAS : [])];

  // Gestão de Procedimentos (Subsistema de Segurança) — telas visíveis dependem do Papel único do
  // usuário (Administrador/Auditor/Avaliador/SSMA/Leitor), não mais de um checklist de features.
  const capProcedimentosPops = capacidadePops(usuarioAtual, PAPEL_POPS_PROCEDIMENTOS, dados);
  const capSSMAPops = capacidadePops(usuarioAtual, PAPEL_POPS_SSMA, dados);
  const capListaMestraPops = capacidadePops(usuarioAtual, PAPEL_POPS_LISTA_MESTRA, dados);
  const MENU_POPS_VISIVEL = [
    ...(capProcedimentosPops !== "oculto" ? [{ id: "PROCEDIMENTOS", rotulo: "Procedimentos", icone: "📄" }] : []),
    ...(capSSMAPops !== "oculto" ? [{ id: "SSMA", rotulo: "SSMA", icone: "🛡️" }] : []),
    ...(capListaMestraPops !== "oculto" ? [{ id: "LISTA_MESTRA", rotulo: "Lista Mestra", icone: "📋" }] : []),
  ];
  // Configurações do próprio Subsistema (parâmetros + quem tem acesso) — só GM ou quem tem o
  // Papel "Administrador" em Gestão de Procedimentos enxerga. GM sempre enxerga (mesmo depois de
  // já existir um Administrador — precisa continuar podendo ajustar papéis por aqui).
  const souAdminDePops = ehGM || temPapelPops(usuarioAtual, "administrador", dados);
  const MENU_ADMIN_POPS = [{ id: "CONFIGURACOES", rotulo: "Configurações", icone: "⚙️" }];
  const itensPops = [{ id: "PAINEL", rotulo: "Painel", icone: "📊" }, ...MENU_POPS_VISIVEL, ...(souAdminDePops ? MENU_ADMIN_POPS : [])];

  // Telas que devem ocupar a tela toda (sem a faixa de 80vw central, com apenas uma margem fina):
  // os Subsistemas nativos (sidebar própria) e Configurações — ganham mais espaço útil sem a
  // moldura do portal. `sistemaEmbutido` fica de infraestrutura pronta para um futuro Subsistema
  // externo (hoje nenhum usa mais — Gestão de Procedimentos passou a ser nativo).
  const telaCheia = (area === "ADMIN" && appAdmin === "COMPRAS") || (area === "SEG" && appAdmin === "POPS") || area === "CONFIG" || !!sistemaEmbutido;
  const abrirSistemaExterno = (sistema) => {
    if (!sistema.url) { avisar(`"${sistema.titulo}" ainda não foi publicado. Fale com o administrador do sistema.`); return; }
    if (sistema.modoAbertura === "embutido") { setSistemaEmbutido(sistema); return; }
    window.open(sistema.url, "_blank", "noopener");
  };
  // Abre um Subsistema do catálogo: nativo (tela própria dentro do AURA 360°) ou externo (infra legada,
  // sem uso hoje). Compartilhado pelos Grupos Administrativo e Segurança.
  const abrirSubsistema = (s) => {
    if (s.externo) { abrirSistemaExterno(s); return; }
    setAppAdmin(s.id); setTela("MENU");
  };

  // Trilha de navegação (breadcrumb) — reflete onde o usuário está dentro do portal
  const ROTULOS_TELA_ADMIN = { MENU: "Painel", PAINEL: "Painel", COMPRAS: "Solicitação de Compras", CADASTROS: "Solicitação de Cadastros", RELATORIOS: "Relatórios", CONFIGURACOES: "Configurações" };
  const ROTULOS_TELA_POPS = { MENU: "Painel", PAINEL: "Painel", PROCEDIMENTOS: "Procedimentos", SSMA: "SSMA", LISTA_MESTRA: "Lista Mestra", CONFIGURACOES: "Configurações" };
  const ROTULOS_ABA_CONFIG = { usuarios: "Usuários", registros: "Registros (Auditoria)", sobre: "Sobre" };
  const irParaHome = () => { setArea(null); setTela("MENU"); setAppAdmin(null); setSistemaEmbutido(null); };
  const trilha = (() => {
    if (area === null) return [];
    const home = { rotulo: "Home", aoClicar: irParaHome };
    if (area === "ADMIN") {
      const admin = { rotulo: "Administração", aoClicar: () => setAppAdmin(null) };
      if (appAdmin === null) return [home, admin];
      const base = [home, admin, { rotulo: "Compras e Cadastros", aoClicar: () => setTela("MENU") }];
      return [...base, { rotulo: ROTULOS_TELA_ADMIN[tela] || "Solicitação de Compras" }];
    }
    if (area === "SEG") {
      if (sistemaEmbutido) return [home, { rotulo: "Segurança", aoClicar: () => setSistemaEmbutido(null) }, { rotulo: sistemaEmbutido.titulo }];
      const seg = { rotulo: "Segurança", aoClicar: () => setAppAdmin(null) };
      if (appAdmin === null) return [home, { rotulo: "Segurança" }];
      const base = [home, seg, { rotulo: "Gestão de Procedimentos", aoClicar: () => setTela("MENU") }];
      return [...base, { rotulo: ROTULOS_TELA_POPS[tela] || "Painel" }];
    }
    if (area === "OPER") return [home, { rotulo: "Operação" }];
    if (area === "CONFIG") return [home, { rotulo: "Configurações", aoClicar: () => setConfigAba("usuarios") }, { rotulo: ROTULOS_ABA_CONFIG[configAba] || "Usuários" }];
    return [home];
  })();

  return (
    <div style={{ minHeight: "100vh", background: CORES.cinzaClaro, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      <FaixaAmbiente />
      <style>{`
        @media print {
          @page { size: A4 landscape; margin: 8mm; }
          body * { visibility: hidden; }
          #area-relatorio, #area-relatorio * { visibility: visible; }
          #area-relatorio { position: absolute; top: 0; left: 0; width: 100%; overflow: visible !important; }
          #area-relatorio table { min-width: 0 !important; width: 100% !important; table-layout: auto; page-break-inside: auto; }
          #area-relatorio tr { page-break-inside: avoid; }
          #area-relatorio th { font-size: 8px !important; padding: 3px 4px !important; white-space: normal !important;
            -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          #area-relatorio td { font-size: 8.5px !important; padding: 3px 4px !important; white-space: normal !important;
            word-break: break-word; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          #area-relatorio h3 { font-size: 12px !important; }
          #area-relatorio input[type="checkbox"] { width: 10px !important; height: 10px !important; }
          .so-tela { display: none !important; }
          .so-impressao { display: block !important; visibility: visible; }
        }
        .so-impressao { display: none; }
        input:focus, select:focus, textarea:focus { border-color: ${CORES.laranja} !important; }
      `}</style>

      {/* Cabeçalho */}
      <header style={{ background: CORES.azul, color: "#fff", padding: "0 22px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 62, position: "sticky", top: 0, zIndex: 30, boxShadow: "0 2px 10px rgba(45,61,112,.25)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, cursor: "pointer" }} onClick={irParaHome}>
          <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: ".03em" }}>AURA <span style={{ color: CORES.laranja }}>360°</span> <span style={{ opacity: .85, fontWeight: 700 }}>Planta</span></div>
          <div style={{ fontSize: 12, opacity: 0.75, borderLeft: "1px solid rgba(255,255,255,.3)", paddingLeft: 14, display: window.innerWidth < 560 ? "none" : "block" }}>Portal Integrado Da Planta</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 13, opacity: 0.9 }}>{usuarioAtual.nome} · <em style={{ opacity: 0.8 }}>{usuarioAtual.perfil}</em></span>
          {(ehGM || souAdminDeAlgumSubsistema) && <Botao tipo="laranja" style={{ padding: "6px 14px", fontSize: 13 }} onClick={() => setArea("CONFIG")}>⚙ Configurações</Botao>}
          <Botao tipo="contorno" style={{ padding: "6px 14px", fontSize: 13, background: "transparent", color: "#fff", borderColor: "rgba(255,255,255,.4)" }} onClick={sair}>Sair</Botao>
        </div>
      </header>

      <TrilhaNavegacao segmentos={trilha} />

      <main style={telaCheia ? { width: "100%", padding: "max(10px, 1vw)", boxSizing: "border-box" } : { maxWidth: (typeof window !== "undefined" && window.innerWidth < 900) ? "100%" : "80vw", width: "100%", margin: "0 auto", padding: "26px 18px 60px", boxSizing: "border-box" }}>
        {/* Home do portal — 3 áreas macro */}
        {area === null && (
          <PortalHome nome={usuarioAtual.nome} aoAbrir={(a) => { setArea(a); setTela("MENU"); setAppAdmin(null); }} permissoesUsuario={permissoesUsuario} ehGM={ehGM} />
        )}

        {/* Área 1 — Administrativo: segundo menu (escolha do sistema) → sistema de Compras (sidebar própria) */}
        {area === "ADMIN" && appAdmin === null && (
          <SegundoMenuGrupo grupoId="ADMIN" aoEscolher={abrirSubsistema} permissoesUsuario={permissoesUsuario} ehGM={ehGM} />
        )}
        {area === "ADMIN" && appAdmin === "COMPRAS" && (
          <div style={{ display: "grid", gridTemplateColumns: (typeof window !== "undefined" && window.innerWidth < 800) ? "1fr" : "232px 1fr", gap: 20, alignItems: "start" }}>
            <SidebarAdministrativo itens={itensAdmin} telaAtual={tela === "MENU" ? "PAINEL" : tela} aoNavegar={(id) => setTela(id)} aoVoltarPortal={() => setAppAdmin(null)} />

            <div style={{ minWidth: 0 }}>
              {(tela === "MENU" || tela === "PAINEL") && <TelaPainelCompras dados={dados} usuario={usuarioAtual} souAdmin={souAdminDeCompras} />}
              {tela === "COMPRAS" && <TelaCompras dados={dados} setDados={setDados} usuario={usuarioAtual} notificarSolicitacao={notificarSolicitacao} />}
              {tela === "CADASTROS" && <TelaCadastros dados={dados} setDados={setDados} usuario={usuarioAtual} notificarSolicitacao={notificarSolicitacao} />}
              {tela === "RELATORIOS" && souAdminDeCompras && <TelaRelatorios dados={dados} setDados={setDados} usuario={usuarioAtual} notificarEtapa={notificarEtapa} />}
              {tela === "CONFIGURACOES" && souAdminDeCompras && <TelaConfigCompras dados={dados} setDados={setDados} usuario={usuarioAtual} />}
            </div>
          </div>
        )}

        {/* Área 2 — Segurança: segundo menu → Gestão de Procedimentos (sidebar própria, nativo).
            `sistemaEmbutido` é infraestrutura para um futuro Subsistema externo — nenhum usa hoje. */}
        {area === "SEG" && sistemaEmbutido && (
          <iframe src={sistemaEmbutido.url} title={sistemaEmbutido.titulo}
            style={{ width: "100%", height: "calc(100vh - 100px)", border: "none", display: "block" }} />
        )}
        {area === "SEG" && !sistemaEmbutido && appAdmin === null && (
          <SegundoMenuGrupo grupoId="SEG" aoEscolher={abrirSubsistema} permissoesUsuario={permissoesUsuario} ehGM={ehGM} />
        )}
        {area === "SEG" && appAdmin === "POPS" && (
          <div style={{ display: "grid", gridTemplateColumns: (typeof window !== "undefined" && window.innerWidth < 800) ? "1fr" : "232px 1fr", gap: 20, alignItems: "start" }}>
            <SidebarAdministrativo itens={itensPops} telaAtual={tela === "MENU" ? "PAINEL" : tela} aoNavegar={(id) => setTela(id)} aoVoltarPortal={() => setAppAdmin(null)}
              titulo="📄 Gestão de Procedimentos" rotuloVoltar="← Segurança" />
            <div style={{ minWidth: 0 }}>
              {(tela === "MENU" || tela === "PAINEL") && <TelaPainelPops dados={dados} />}
              {tela === "PROCEDIMENTOS" && <TelaProcedimentosPops dados={dados} setDados={setDados} usuario={usuarioAtual} />}
              {tela === "SSMA" && <TelaSSMAPops dados={dados} setDados={setDados} usuario={usuarioAtual} />}
              {tela === "LISTA_MESTRA" && <TelaListaMestraPops dados={dados} />}
              {tela === "CONFIGURACOES" && souAdminDePops && <TelaConfigPops dados={dados} setDados={setDados} usuario={usuarioAtual} />}
            </div>
          </div>
        )}

        {/* Área 3 — Operação (em desenvolvimento) */}
        {area === "OPER" && <EmDesenvolvimento titulo="Operação" icone="⚙️" itens={["Resumo Reagentes"]} aoVoltar={() => { setArea(null); setTela("MENU"); }} />}

        {/* Configurações — administração do AURA 360° Planta como um todo (usuários, permissões,
            auditoria e versão); nível global, fora de qualquer Grupo/Subsistema. Só GM acessa. */}
        {area === "CONFIG" && (
          <TelaConfig dados={dados} setDados={setDados} usuario={usuarioAtual} aba={configAba} setAba={setConfigAba} />
        )}
      </main>

      <RodapeVersao />
      <ModalEmails info={emails} aoFechar={() => setEmails(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
