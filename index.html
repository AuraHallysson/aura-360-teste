function TelaLogin({ aoEntrar, tentarLoginDemo, criarSenhaELogar, resetPrimeiroAdmin }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [senha2, setSenha2] = useState("");
  const [fase, setFase] = useState("login"); // "login" | "criarSenha"
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  // ---- Modo real: login via popup da Microsoft (valida credenciais de verdade) ----
  const entrarMicrosoft = async () => {
    setErro(""); setCarregando(true);
    try {
      const resp = await obterMsal().loginPopup({ scopes: ["User.Read", "Mail.Send"] });
      const conta = resp.account;
      const e = (conta.username || "").toLowerCase();
      if (!e.endsWith(DOMINIO)) {
        setErro(`Esta conta não pertence ao domínio ${DOMINIO}.`);
      } else {
        const r = await aoEntrar(e, conta.name); // valida se o usuário está cadastrado no sistema
        if (r && r.erro) setErro(r.erro);
      }
    } catch (ex) {
      if (!String(ex).includes("user_cancelled")) setErro("Falha na autenticação Microsoft. Tente novamente ou contate a TI.");
    } finally { setCarregando(false); }
  };

  // ---- Modo demonstração: e-mail cadastrado + senha ----
  const entrarDemo = async () => {
    setErro("");
    const e = email.trim().toLowerCase();
    if (!e.endsWith(DOMINIO)) { setErro(`Acesso permitido apenas para contas do domínio ${DOMINIO}.`); return; }
    setCarregando(true);
    const r = await tentarLoginDemo(e, senha);
    setCarregando(false);
    if (r.erro) setErro(r.erro);
    else if (r.criarSenha) { setFase("criarSenha"); setSenha(""); }
  };

  const confirmarNovaSenha = async () => {
    setErro("");
    if (senha.length < 6) { setErro("A senha deve ter ao menos 6 caracteres."); return; }
    if (senha !== senha2) { setErro("As senhas não conferem."); return; }
    setCarregando(true);
    const r = await criarSenhaELogar(email.trim().toLowerCase(), senha);
    setCarregando(false);
    if (r && r.erro) setErro(r.erro);
  };

  return (
    <div style={{ minHeight: "100vh", background: CORES.cinzaClaro, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      <div style={{ background: "#fff", borderRadius: 14, padding: 40, width: "min(420px, 92%)", borderTop: `5px solid ${CORES.laranja}`, boxShadow: "0 12px 40px rgba(45,61,112,.12)" }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <div style={{ fontSize: 26, fontWeight: 800, color: CORES.azul, letterSpacing: ".02em" }}>AURA <span style={{ color: CORES.laranja }}>360°</span> Planta</div>
          <div style={{ fontSize: 13, color: CORES.cinza, marginTop: 4, textTransform: "uppercase", letterSpacing: ".12em" }}>Portal integrado · Aura Minerals</div>
          {AMBIENTE === "teste" && <div style={{ marginTop: 10, display: "inline-block", background: CORES.laranja, color: "#fff", borderRadius: 8, padding: "3px 12px", fontSize: 11.5, fontWeight: 700, letterSpacing: ".03em" }}>🧪 AMBIENTE DE TESTES</div>}
        </div>
        {AUTENTICACAO_REAL ? (
          <div>
            <Botao onClick={entrarMicrosoft} disabled={carregando} style={{ width: "100%", padding: "12px" }}>
              {carregando ? "Autenticando…" : "Entrar com conta Microsoft"}
            </Botao>
            {erro && <p style={{ color: CORES.laranja, fontSize: 13, margin: "10px 0 0" }}>{erro}</p>}
            <p style={{ fontSize: 11.5, color: CORES.cinza, marginTop: 16, textAlign: "center", lineHeight: 1.5 }}>
              Autenticação via Microsoft Entra ID, restrita ao diretório da Aura Minerals.
            </p>
          </div>
        ) : (
          <div>
            <div style={{ background: "rgba(244,97,77,.08)", border: `1px solid ${CORES.laranja}`, borderRadius: 8, padding: "10px 12px", fontSize: 12, color: CORES.azul, marginBottom: 14, lineHeight: 1.5 }}>
              <strong style={{ color: CORES.laranja }}>⚠ MODO DEMONSTRAÇÃO</strong> — acesso restrito a usuários cadastrados pelo administrador.
              A validação de credenciais reais na Microsoft é ativada quando a TI registrar o app no Entra ID.
            </div>
            {fase === "login" ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Campo label={`E-mail corporativo (${DOMINIO})`}>
                  <input style={inputStyle} value={email} placeholder={`nome.sobrenome${DOMINIO}`}
                    onChange={(e) => { setEmail(e.target.value); setErro(""); }} />
                </Campo>
                <Campo label="Senha">
                  <input style={inputStyle} type="password" value={senha} placeholder="Sua senha"
                    onChange={(e) => { setSenha(e.target.value); setErro(""); }}
                    onKeyDown={(e) => e.key === "Enter" && entrarDemo()} />
                </Campo>
                {erro && <p style={{ color: CORES.laranja, fontSize: 13, margin: 0 }}>{erro}</p>}
                <Botao onClick={entrarDemo} disabled={carregando} style={{ width: "100%", padding: "12px" }}>
                  {carregando ? "Verificando…" : "Entrar"}
                </Botao>
                <p style={{ fontSize: 11.5, color: CORES.cinza, margin: 0, textAlign: "center" }}>
                  Sem acesso? Solicite seu cadastro a um administrador do sistema.
                </p>
                {resetPrimeiroAdmin && (
                  <button type="button" onClick={async () => {
                    await resetPrimeiroAdmin();
                    setEmail(PRIMEIRO_ADMIN); setSenha(""); setErro("");
                    avisar("Senha do primeiro administrador redefinida. Clique em Entrar para criar uma nova senha.");
                  }} style={{ border: "none", background: "none", color: CORES.cinza, fontSize: 11.5, cursor: "pointer", fontFamily: "inherit", textDecoration: "underline", padding: 0 }}>
                    Primeiro administrador sem acesso? Redefinir minha senha
                  </button>
                )}
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ fontSize: 13.5, color: CORES.azul, lineHeight: 1.5 }}>
                  <strong>Primeiro acesso de {email.trim().toLowerCase()}.</strong><br />
                  Crie sua senha pessoal. Ela será armazenada apenas de forma criptografada (hash irreversível).
                </div>
                <Campo label="Nova senha (mín. 6 caracteres)">
                  <input style={inputStyle} type="password" autoFocus value={senha} onChange={(e) => { setSenha(e.target.value); setErro(""); }} />
                </Campo>
                <Campo label="Confirmar senha">
                  <input style={inputStyle} type="password" value={senha2} onChange={(e) => { setSenha2(e.target.value); setErro(""); }}
                    onKeyDown={(e) => e.key === "Enter" && confirmarNovaSenha()} />
                </Campo>
                {erro && <p style={{ color: CORES.laranja, fontSize: 13, margin: 0 }}>{erro}</p>}
                <Botao onClick={confirmarNovaSenha} disabled={carregando} style={{ width: "100%", padding: "12px" }}>
                  {carregando ? "Salvando…" : "Criar senha e entrar"}
                </Botao>
                <button onClick={() => { setFase("login"); setSenha(""); setSenha2(""); setErro(""); }}
                  style={{ border: "none", background: "none", color: CORES.cinza, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit" }}>← Voltar</button>
              </div>
            )}
          </div>
        )}
      </div>
      <RodapeVersao style={{ marginTop: 4 }} />
    </div>
  );
}

function App() {
  const [dados, setDados] = useState(null);
  const [usuario, setUsuario] = useState(null);
  const [area, setArea] = useState(null); // null = Home do portal | "ADMIN" | "SEG" | "OPER"
  const [tela, setTela] = useState("MENU"); // navegação dentro da área Administrativo
  const [appAdmin, setAppAdmin] = useState(null); // segundo menu do Administrativo: null | "COMPRAS" (futuros sistemas entram aqui)
  const [emails, setEmails] = useState(null);
  const [configAba, setConfigAba] = useState("usuarios"); // aba ativa em Configurações (usado no atalho/breadcrumb)

  useEffect(() => {
    (async () => {
      const d = await carregarDados();
      setDados(d);
      try {
        const s = await window.storage.get(SESSION_KEY, false);
        if (s && s.value) {
          const email = JSON.parse(s.value);
          if (d.usuarios[email]) setUsuario({ email, ...d.usuarios[email] });
        }
      } catch (e) { /* sem sessão */ }
    })();
  }, []);

  // Acesso restrito: apenas usuários cadastrados entram no sistema
  const concluirLogin = async (email, nomeOficial, d0) => {
    let d = d0 || dados || dadosVazios();
    if (nomeOficial && d.usuarios[email] && d.usuarios[email].nome !== nomeOficial) {
      d = { ...d, usuarios: { ...d.usuarios, [email]: { ...d.usuarios[email], nome: nomeOficial } } };
      setDados(d); await salvarDados(d);
    }
    const perfilU = d.usuarios[email] || {};
    d = comLog(d, { email, nome: perfilU.nome, perfil: perfilU.perfil }, "Acesso", "Entrou no sistema", AUTENTICACAO_REAL ? "Login Microsoft (Entra ID)" : "Login (modo demonstração)", email);
    setDados(d); await salvarDados(d);
    setUsuario({ email, ...d.usuarios[email] });
    try { await window.storage.set(SESSION_KEY, JSON.stringify(email), false); } catch (e) {}
    setArea(null); setTela("MENU");
  };

  // Modo real (Entra ID): a Microsoft valida a credencial; o SharePoint traz os dados compartilhados
  const entrar = async (email, nomeOficial) => {
    let d = dados || dadosVazios();
    if (AUTENTICACAO_REAL) {
      try {
        const dG = await carregarDoGraph();
        d = { ...d, ...dG };
        _ultimoSync = fotografar(d);
        setDados(d);
        try { await window.storage.set(STORAGE_KEY, JSON.stringify(d), true); } catch (e) {}
      } catch (e) {
        console.error(e);
        return { erro: "Conta autenticada, mas não foi possível acessar as listas do sistema no SharePoint. Peça à TI para verificar as permissões do aplicativo (Sites.ReadWrite.All e Sites.Manage.All)." };
      }
    }
    if (!d.usuarios[email]) return { erro: "Conta autenticada, mas não cadastrada no sistema. Solicite acesso a um administrador." };
    await concluirLogin(email, nomeOficial, d);
    return { ok: true };
  };

  // Modo demonstração: e-mail cadastrado + senha (hash)
  const tentarLoginDemo = async (email, senha) => {
    const d = dados || dadosVazios();
    const u = d.usuarios[email];
    if (!u) return { erro: "E-mail não cadastrado. Solicite acesso a um administrador do sistema." };
    if (!u.senha) return { criarSenha: true }; // primeiro acesso: define a própria senha
    if (!criptoDisponivel()) return { erro: "Este navegador não suporta a verificação segura de senha." };
    try {
      const h = await hashSenha(senha || "", u.senha.salt, u.senha.metodo);
      if (h !== u.senha.hash) return { erro: "Senha incorreta." };
    } catch (e) { return { erro: "Falha na verificação da senha." }; }
    await concluirLogin(email);
    return { ok: true };
  };

  const criarSenhaELogar = async (email, senha) => {
    const d0 = dados || dadosVazios();
    if (!d0.usuarios[email]) return { erro: "E-mail não cadastrado." };
    if (!criptoDisponivel()) return { erro: "Este navegador não suporta o armazenamento seguro de senha." };
    try {
      const salt = gerarSalt();
      const met = metodoHash();
      const hash = await hashSenha(senha, salt, met);
      const d = { ...d0, usuarios: { ...d0.usuarios, [email]: { ...d0.usuarios[email], senha: { salt, hash, metodo: met } } } };
      setDados(d); await salvarDados(d);
      await concluirLogin(email, undefined, d);
      return { ok: true };
    } catch (e) { return { erro: "Falha ao salvar a senha." }; }
  };

  // Recuperação (modo demonstração): limpa a senha do primeiro administrador para que ele
  // crie uma nova no próximo acesso — evita bloqueio caso a senha seja esquecida.
  const resetPrimeiroAdmin = async () => {
    const d0 = dados || dadosVazios();
    const u = d0.usuarios[PRIMEIRO_ADMIN] || { nome: nomeDoEmail(PRIMEIRO_ADMIN), perfil: "GM" };
    const { senha, ...semSenha } = u;
    let nd = { ...d0, usuarios: { ...d0.usuarios, [PRIMEIRO_ADMIN]: { ...semSenha, perfil: "GM" } } };
    nd = comLog(nd, { email: PRIMEIRO_ADMIN, nome: semSenha.nome, perfil: "GM" }, "Acesso", "Redefiniu a própria senha (primeiro administrador) pela tela de login", "", PRIMEIRO_ADMIN);
    setDados(nd); await salvarDados(nd);
    return { ok: true };
  };

  // Multiusuário: recarrega os dados compartilhados a cada 60s (modo Entra ID)
  useEffect(() => {
    if (!usuario || !AUTENTICACAO_REAL) return;
    const t = setInterval(async () => {
      try {
        const dG = await carregarDoGraph();
        _ultimoSync = fotografar(dG);
        setDados((prev) => ({ ...prev, ...dG }));
      } catch (e) { /* offline momentâneo: tenta no próximo ciclo */ }
    }, 60000);
    return () => clearInterval(t);
  }, [usuario]);

  const sair = async () => {
    if (dados && usuario) {
      const d = comLog(dados, usuario, "Acesso", "Saiu do sistema", "", usuario.email);
      setDados(d); await salvarDados(d);
    }
    setUsuario(null); setArea(null); setTela("MENU"); setAppAdmin(null);
    try { await window.storage.delete(SESSION_KEY, false); } catch (e) {}
  };

  const listaAdmins = (d) => Object.entries(d.usuarios).filter(([, u]) => u.perfil === "GM").map(([e]) => e);

  // Tenta envio automático (Graph); sem Entra ID, prepara o e-mail para abrir no Outlook
  const notificar = async (mensagens) => {
    const resultados = [];
    for (const m of mensagens) {
      const r = await enviarEmailGraph(m);
      resultados.push({ ...m, enviado: !!(r && r.enviado) });
    }
    setEmails({ resultados });
  };

  // Novos pedidos: confirmação ao solicitante + alerta aos administradores RESPONSÁVEIS pelo solicitante
  const notificarSolicitacao = (tipo, u, d, resumo, dataHora, tabela) => {
    // Administradores vinculados ao usuário; sem vínculo definido, alerta todos (garantia de que nada se perde)
    const vinculados = ((d.usuarios[u.email] && d.usuarios[u.email].administradores) || [])
      .filter((e) => d.usuarios[e] && d.usuarios[e].perfil === "GM");
    const admins = vinculados.length ? vinculados : listaAdmins(d);
    const rotuloAdmins = vinculados.length
      ? `Alerta aos administradores responsáveis (${tipo})`
      : `Alerta aos administradores (${tipo}) — solicitante sem responsável vinculado`;
    const htmlAdmin = tabela ? emailHtml({
      subtitulo: `Nova Solicitação de ${tipo}`,
      saudacao: "Administrador(a)",
      intro: `Informamos que uma nova solicitação de <strong>${tipo.toUpperCase()}</strong> foi registrada no sistema por <strong>${u.nome}</strong> em ${dataHora} e aguarda sua análise.`,
      cabecalhos: tabela.cabecalhos, linhas: tabela.linhas,
      observacao: "Acesse o sistema (menu <strong>Relatórios</strong>) para analisar, concluir ou cancelar a solicitação.",
    }) : undefined;
    const htmlUsuario = tabela ? emailHtml({
      subtitulo: `Recebemos sua Solicitação de ${tipo}`,
      saudacao: u.nome,
      intro: `Sua solicitação de <strong>${tipo.toUpperCase()}</strong> foi registrada com sucesso em ${dataHora}. Os administradores do sistema já foram notificados.`,
      cabecalhos: tabela.cabecalhos, linhas: tabela.linhas,
      observacao: "Você pode acompanhar o andamento pelo sistema e será avisado(a) por e-mail a cada etapa (solicitado, concluído ou cancelado).",
    }) : undefined;
    notificar([
      { rotulo: "Confirmação ao solicitante", para: [u.email], ...tplConfirmacao(u.nome, tipo, resumo, dataHora), corpoHtml: htmlUsuario },
      { rotulo: rotuloAdmins, para: admins, ...tplAlertaAdmin(u.nome, tipo, resumo, dataHora), corpoHtml: htmlAdmin },
    ]);
  };

  // Mudança de etapa: informa o solicitante original (comunicado HTML padrão Aura)
  const notificarEtapa = (registro, etapa, detalhes, registradoPor) => {
    if (!registro.email) return;
    const html = emailHtml({
      subtitulo: `Atualização de Solicitação — ${etapa}`,
      saudacao: registro.solicitante,
      intro: `Houve uma atualização em uma solicitação sua registrada no sistema.`,
      cabecalhos: ["Item", "Nova etapa", "Detalhes", "Registrado por", "Data/Hora"],
      linhas: [[registro.descricao || "", etapa, detalhes || "—", registradoPor, agoraStr()]],
      observacao: "Consulte os detalhes completos na tela de <strong>Relatórios</strong> do sistema.",
    });
    notificar([
      { rotulo: `Aviso ao solicitante — ${etapa}`, para: [registro.email], ...tplEtapa(registro.solicitante, registro.descricao || "", etapa, detalhes, registradoPor), corpoHtml: html },
    ]);
  };

  if (!dados) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: CORES.cinzaClaro, color: CORES.azul, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      Carregando sistema…
    </div>
  );
  if (!usuario) return <TelaLogin aoEntrar={entrar} tentarLoginDemo={tentarLoginDemo} criarSenhaELogar={criarSenhaELogar} resetPrimeiroAdmin={resetPrimeiroAdmin} />;

  // perfil sempre atualizado (caso um admin altere)
  const usuarioAtual = { ...usuario, ...(dados.usuarios[usuario.email] || {}) };

  const MENU = [
    { id: "COMPRAS", rotulo: "Solicitação de Compras", icone: "🛒", desc: "Requisite itens da base de materiais", feature: "TELA_COMPRAS" },
    { id: "CADASTROS", rotulo: "Solicitação de Cadastros", icone: "📋", desc: "Solicite cadastro de novos materiais", feature: "TELA_CADASTROS" },
    { id: "RELATORIOS", rotulo: "Relatórios de Compras / Cadastros", icone: "📊", desc: "Consulte, filtre, conclua e exporte", feature: "TELA_RELATORIOS" },
  ];
  // Funcionalidades sem permissão ficam OCULTAS (o usuário já está dentro de um Subsistema ao qual tem acesso)
  const ehGM = EH_GM(usuarioAtual);
  const permissoesUsuario = usuarioAtual.permissoes || permissoesDefault();
  const MENU_VISIVEL = ehGM ? MENU : MENU.filter((m) => permissoesUsuario.features[m.feature] !== false);
  // Navegação do sistema de Compras e Cadastros (sidebar). Configurações é administração do
  // AURA 360° Planta como um todo (usuários, permissões, auditoria) — fica num nível global,
  // não dentro de um Subsistema específico.
  const itensAdmin = MENU_VISIVEL;
  // Subsistemas externos (apps próprios) abrem em nova aba — atalho temporário até existir SSO real
  const abrirSistemaExterno = (sistema) => {
    if (!sistema.url) { avisar(`"${sistema.titulo}" ainda não foi publicado. Fale com o administrador do sistema.`); return; }
    window.open(sistema.url, "_blank", "noopener");
  };

  // Trilha de navegação (breadcrumb) — reflete onde o usuário está dentro do portal
  const ROTULOS_TELA_ADMIN = { MENU: "Solicitação de Compras", COMPRAS: "Solicitação de Compras", CADASTROS: "Solicitação de Cadastros", RELATORIOS: "Relatórios" };
  const ROTULOS_ABA_CONFIG = { usuarios: "Usuários", registros: "Registros (Auditoria)", materiais: "Materiais", sobre: "Sobre" };
  const irParaHome = () => { setArea(null); setTela("MENU"); setAppAdmin(null); };
  const trilha = (() => {
    if (area === null) return [];
    const home = { rotulo: "Home", aoClicar: irParaHome };
    if (area === "ADMIN") {
      const admin = { rotulo: "Administração", aoClicar: () => setAppAdmin(null) };
      if (appAdmin === null) return [home, admin];
      const base = [home, admin, { rotulo: "Compras e Cadastros", aoClicar: () => setTela("MENU") }];
      return [...base, { rotulo: ROTULOS_TELA_ADMIN[tela] || "Solicitação de Compras" }];
    }
    if (area === "SEG") return [home, { rotulo: "Segurança" }];
    if (area === "OPER") return [home, { rotulo: "Operação" }];
    if (area === "CONFIG") return [home, { rotulo: "Configurações", aoClicar: () => setConfigAba("usuarios") }, { rotulo: ROTULOS_ABA_CONFIG[configAba] || "Usuários" }];
    return [home];
  })();

  return (
    <div style={{ minHeight: "100vh", background: CORES.cinzaClaro, fontFamily: "'Segoe UI', system-ui, sans-serif" }}>
      <FaixaAmbiente />
      <style>{`
        @media print {
          @page { size: A4 landscape; margin: 8mm; }
          body * { visibility: hidden; }
          #area-relatorio, #area-relatorio * { visibility: visible; }
          #area-relatorio { position: absolute; top: 0; left: 0; width: 100%; overflow: visible !important; }
          #area-relatorio table { min-width: 0 !important; width: 100% !important; table-layout: auto; page-break-inside: auto; }
          #area-relatorio tr { page-break-inside: avoid; }
          #area-relatorio th { font-size: 8px !important; padding: 3px 4px !important; white-space: normal !important;
            -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          #area-relatorio td { font-size: 8.5px !important; padding: 3px 4px !important; white-space: normal !important;
            word-break: break-word; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          #area-relatorio h3 { font-size: 12px !important; }
          #area-relatorio input[type="checkbox"] { width: 10px !important; height: 10px !important; }
          .so-tela { display: none !important; }
          .so-impressao { display: block !important; visibility: visible; }
        }
        .so-impressao { display: none; }
        input:focus, select:focus, textarea:focus { border-color: ${CORES.laranja} !important; }
      `}</style>

      {/* Cabeçalho */}
      <header style={{ background: CORES.azul, color: "#fff", padding: "0 22px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 62, position: "sticky", top: 0, zIndex: 30, boxShadow: "0 2px 10px rgba(45,61,112,.25)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, cursor: "pointer" }} onClick={irParaHome}>
          <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: ".03em" }}>AURA <span style={{ color: CORES.laranja }}>360°</span> <span style={{ opacity: .85, fontWeight: 700 }}>Planta</span></div>
          <div style={{ fontSize: 12, opacity: 0.75, borderLeft: "1px solid rgba(255,255,255,.3)", paddingLeft: 14, display: window.innerWidth < 560 ? "none" : "block" }}>Portal Integrado Da Planta</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 13, opacity: 0.9 }}>{usuarioAtual.nome} · <em style={{ opacity: 0.8 }}>{usuarioAtual.perfil}</em></span>
          {ehGM && <Botao tipo="laranja" style={{ padding: "6px 14px", fontSize: 13 }} onClick={() => setArea("CONFIG")}>⚙ Configurações</Botao>}
          <Botao tipo="contorno" style={{ padding: "6px 14px", fontSize: 13, background: "transparent", color: "#fff", borderColor: "rgba(255,255,255,.4)" }} onClick={sair}>Sair</Botao>
        </div>
      </header>

      <TrilhaNavegacao segmentos={trilha} />

      <main style={{ maxWidth: (typeof window !== "undefined" && window.innerWidth < 900) ? "100%" : "80vw", width: "100%", margin: "0 auto", padding: "26px 18px 60px", boxSizing: "border-box" }}>
        {/* Home do portal — 3 áreas macro */}
        {area === null && (
          <PortalHome nome={usuarioAtual.nome} aoAbrir={(a) => { setArea(a); setTela("MENU"); setAppAdmin(null); }} permissoesUsuario={permissoesUsuario} ehGM={ehGM} />
        )}

        {/* Área 1 — Administrativo: segundo menu (escolha do sistema) → sistema de Compras (sidebar, padrão do app de POPs) */}
        {area === "ADMIN" && appAdmin === null && (
          <SegundoMenuGrupo grupoId="ADMIN" aoEscolher={(s) => (s.externo ? abrirSistemaExterno(s) : setAppAdmin(s.id))} aoVoltarPortal={irParaHome} permissoesUsuario={permissoesUsuario} ehGM={ehGM} />
        )}
        {area === "ADMIN" && appAdmin === "COMPRAS" && (
          <div style={{ display: "grid", gridTemplateColumns: (typeof window !== "undefined" && window.innerWidth < 800) ? "1fr" : "232px 1fr", gap: 20, alignItems: "start" }}>
            <SidebarAdministrativo itens={itensAdmin} telaAtual={tela === "MENU" ? "COMPRAS" : tela} aoNavegar={(id) => setTela(id)} aoVoltarPortal={() => setAppAdmin(null)} />

            <div style={{ minWidth: 0 }}>
              {tela === "MENU" && <TelaCompras dados={dados} setDados={setDados} usuario={usuarioAtual} notificarSolicitacao={notificarSolicitacao} />}
              {tela === "COMPRAS" && <TelaCompras dados={dados} setDados={setDados} usuario={usuarioAtual} notificarSolicitacao={notificarSolicitacao} />}
              {tela === "CADASTROS" && <TelaCadastros dados={dados} setDados={setDados} usuario={usuarioAtual} notificarSolicitacao={notificarSolicitacao} />}
              {tela === "RELATORIOS" && <TelaRelatorios dados={dados} setDados={setDados} usuario={usuarioAtual} notificarEtapa={notificarEtapa} />}
            </div>
          </div>
        )}

        {/* Área 2 — Segurança: segundo menu com o atalho temporário para o Gestão de Procedimentos */}
        {area === "SEG" && (
          <SegundoMenuGrupo grupoId="SEG" aoEscolher={abrirSistemaExterno} aoVoltarPortal={irParaHome} permissoesUsuario={permissoesUsuario} ehGM={ehGM} />
        )}

        {/* Área 3 — Operação (em desenvolvimento) */}
        {area === "OPER" && <EmDesenvolvimento titulo="Operação" icone="⚙️" itens={["Resumo Reagentes"]} aoVoltar={() => { setArea(null); setTela("MENU"); }} />}

        {/* Configurações — administração do AURA 360° Planta como um todo (usuários, permissões,
            auditoria e versão); nível global, fora de qualquer Grupo/Subsistema. Só GM acessa. */}
        {area === "CONFIG" && (
          <div>
            <button type="button" onClick={irParaHome} style={{ border: "none", background: "none", color: CORES.laranja, fontWeight: 700, fontSize: 13.5, cursor: "pointer", marginBottom: 14, padding: 0, fontFamily: "inherit" }}>
              ← Portal AURA 360°
            </button>
            <TelaConfig dados={dados} setDados={setDados} usuario={usuarioAtual} aba={configAba} setAba={setConfigAba} />
          </div>
        )}
      </main>

      <RodapeVersao />
      <ModalEmails info={emails} aoFechar={() => setEmails(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
