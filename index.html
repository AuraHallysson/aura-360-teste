                        <span style={{ color: CORES.laranja, fontWeight: 700 }}>Cancelado 🔒<div style={{ fontSize: 11.5, fontWeight: 400, color: CORES.cinza, fontStyle: "italic", maxWidth: 220 }}>Motivo: {c.justificativa || "não informado"}</div></span>
                      ) : (
                        <span style={{ color: c.recebido ? "seagreen" : c.entregue ? CORES.laranja : c.concluido ? CORES.azul : CORES.laranja, fontWeight: 700 }}>
                          {rotuloStatusCompra(c)}{c.concluido ? " 🔒" : ""}
                          {c.comentarioAdmin && <div style={{ fontSize: 11.5, fontWeight: 400, color: CORES.azul, fontStyle: "italic", maxWidth: 220 }}>💬 {c.comentarioAdmin}</div>}
                          {c.entregue && <div style={{ fontSize: 11, fontWeight: 400, color: CORES.cinza }}>Entregue em {c.entregueEm}</div>}
                          {c.recebido && <div style={{ fontSize: 11, fontWeight: 400, color: CORES.cinza }}>Recebido em {c.recebidoEm}</div>}
                        </span>
                      )}
                    </td>
                    <td style={{ ...td, textAlign: "center" }}>
                      <input type="checkbox" checked={!!c.recebido} disabled={!c.entregue || c.recebido}
                        onChange={() => confirmarRecebimento(c)}
                        title={c.recebido ? `Recebido em ${c.recebidoEm}` : c.entregue ? "Confirmar recebimento do item" : "Aguardando o item ser entregue pelo administrador"}
                        style={{ width: 17, height: 17, accentColor: CORES.laranja, cursor: (!c.entregue || c.recebido) ? "not-allowed" : "pointer" }} />
                    </td>
                    <td style={{ ...td, whiteSpace: "nowrap" }}>
                      <Botao tipo="contorno" disabled={c.concluido || c.cancelado} style={{ padding: "4px 10px", fontSize: 12, marginRight: 6 }} onClick={() => setEditando({ ...c })} title={c.concluido ? "Item concluído: bloqueado" : c.cancelado ? "Item cancelado: bloqueado" : "Editar"}>Editar</Botao>
                      <Botao tipo="perigo" disabled={c.concluido || c.cancelado} style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => removerItem(c.id)} title={c.concluido ? "Item concluído: bloqueado" : c.cancelado ? "Item cancelado: bloqueado" : "Remover"}>Remover</Botao>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Cartao>

      {editando && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(45,61,112,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: "#fff", borderRadius: 12, padding: 24, width: "min(560px, 94%)", maxHeight: "88vh", overflowY: "auto" }}>
            <h3 style={{ marginTop: 0, color: CORES.azul }}>Editar item</h3>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Campo label="Cód. Item" obrigatorio><CampoBuscaMaterial campo="codigo" valor={editando.codigo} materiais={dados.materiais} aoMudar={(v) => setEditando({ ...editando, codigo: v })} aoEscolher={(m) => setEditando({ ...editando, codigo: m.codigo, descricao: m.descricao, unidade: editando.unidade || m.unidade })} /></Campo>
              <Campo label="Descrição" obrigatorio><CampoBuscaMaterial campo="descricao" valor={editando.descricao} materiais={dados.materiais} aoMudar={(v) => setEditando({ ...editando, descricao: v })} aoEscolher={(m) => setEditando({ ...editando, codigo: m.codigo, descricao: m.descricao, unidade: editando.unidade || m.unidade })} /></Campo>
              <Campo label="Quantidade"><input style={inputStyle} type="number" value={editando.quantidade} onChange={(e) => setEditando({ ...editando, quantidade: e.target.value })} /></Campo>
              <Campo label="Unidade de Medida"><input style={inputStyle} value={editando.unidade} onChange={(e) => setEditando({ ...editando, unidade: e.target.value })} /></Campo>
              <Campo label="Centro de Custo"><input style={inputStyle} value={editando.centroCusto} onChange={(e) => setEditando({ ...editando, centroCusto: e.target.value })} /></Campo>
              <Campo label="Conta Contábil"><input style={inputStyle} value={editando.contaContabil} onChange={(e) => setEditando({ ...editando, contaContabil: e.target.value })} /></Campo>
              <Campo label="Capex">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input type="checkbox" checked={!!editando.capex} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                    onChange={(e) => setEditando({ ...editando, capex: e.target.checked, nomeCapex: e.target.checked ? editando.nomeCapex : "" })} />
                  <input style={{ ...inputStyle, background: editando.capex ? "#fff" : CORES.cinzaClaro }} disabled={!editando.capex}
                    placeholder={editando.capex ? "Código Capex" : "—"} value={editando.nomeCapex || ""}
                    onChange={(e) => setEditando({ ...editando, nomeCapex: e.target.value })} />
                </div>
              </Campo>
              <Campo label="Fornecedor Específico">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input type="checkbox" checked={!!editando.fornecedorEspecifico || editando.__fe === true}
                    style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                    onChange={(e) => setEditando({ ...editando, __fe: e.target.checked, fornecedorEspecifico: e.target.checked ? editando.fornecedorEspecifico : "" })} />
                  <input style={{ ...inputStyle, background: (editando.fornecedorEspecifico || editando.__fe) ? "#fff" : CORES.cinzaClaro }}
                    disabled={!(editando.fornecedorEspecifico || editando.__fe)}
                    placeholder="Nome do fornecedor" value={editando.fornecedorEspecifico || ""}
                    onChange={(e) => setEditando({ ...editando, fornecedorEspecifico: e.target.value })} />
                </div>
              </Campo>
              <div style={{ gridColumn: "1 / -1" }}>
                <Campo label="Observações">
                  <textarea style={{ ...inputStyle, minHeight: 56, resize: "vertical", fontFamily: "inherit" }}
                    value={editando.observacoes || ""} onChange={(e) => setEditando({ ...editando, observacoes: e.target.value })} />
                </Campo>
              </div>
            </div>
            <div style={{ marginTop: 18, display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <Botao tipo="contorno" onClick={() => setEditando(null)}>Cancelar</Botao>
              <Botao onClick={salvarEdicao}>Salvar alterações</Botao>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   TELA: Solicitação de Cadastros
   ============================================================ */
const cadastroVazio = () => ({
  descricao: "", unidade: "", link: "", tipo: "", fornecedor: "", partNumber: "", capex: false, nomeCapex: "", anexo: null,
  observacoes: "", fornEsp: false, fornecedorEspecifico: "", urgente: false,
  estoqueMin: "", estoqueMax: "", consumoMensal: "", estoqueDesejado: "", quantidade: "", centroCusto: "", contaContabil: "",
});

function TelaCadastros({ dados, setDados, usuario, notificarSolicitacao }) {
  const [f, setF] = useState(cadastroVazio());
  const [editId, setEditId] = useState(null);
  const [fDesc, setFDesc] = useState("");
  const [fTipo, setFTipo] = useState("Todos");
  const [fStatus, setFStatus] = useState("Todos");

  const parte1Ok = f.descricao.trim() && f.unidade.trim() && f.tipo;
  const set = (campo, v) => setF((x) => ({ ...x, [campo]: v }));

  // Anexo: apenas PDF ou DOC/DOCX
  const anexoRef = useRef(null);
  const [arquivoAnexo, setArquivoAnexo] = useState(null); // File aguardando upload (modo Microsoft)
  const selecionarAnexo = (e) => {
    const arq = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!arq) return;
    const ext = arq.name.toLowerCase().split(".").pop();
    if (!["pdf", "doc", "docx"].includes(ext)) { avisar("Apenas arquivos PDF ou DOC/DOCX são aceitos como anexo."); return; }
    const limiteMB = AUTENTICACAO_REAL ? 4 : 2;
    if (arq.size > limiteMB * 1024 * 1024) { avisar(`O anexo deve ter no máximo ${limiteMB} MB${AUTENTICACAO_REAL ? "" : " no modo demonstração"}.`); return; }
    if (AUTENTICACAO_REAL) {
      setArquivoAnexo(arq);
      set("anexo", { nome: arq.name, pendente: true });
    } else {
      const leitor = new FileReader();
      leitor.onload = () => set("anexo", { nome: arq.name, dataUrl: leitor.result });
      leitor.onerror = () => avisar("Não foi possível ler o arquivo do anexo.");
      leitor.readAsDataURL(arq);
    }
  };
  const removerAnexo = () => { setArquivoAnexo(null); set("anexo", null); };

  const enviar = async () => {
    if (!parte1Ok) { avisar("Preencha a Parte 1 (Descrição, Unidade e Tipo de Cadastro)."); return; }
    if (f.tipo === "Estoque" && (!f.estoqueMin || !f.estoqueMax || !f.consumoMensal)) { avisar("Preencha Estoque Mínimo, Máximo e Consumo mensal."); return; }
    if (f.tipo === "Estoque Sazonal" && (!f.estoqueDesejado || !f.consumoMensal)) { avisar("Preencha Estoque Desejado e Consumo mensal."); return; }
    if (f.tipo === "Débito Direto" && (!f.quantidade || !f.centroCusto || !f.contaContabil)) { avisar("Preencha Quantidade, Centro de Custo e Conta Contábil."); return; }
    if (f.capex && !f.nomeCapex.trim()) { avisar("Cadastro marcado como Capex precisa do Código Capex preenchido."); return; }
    if ((f.tipo === "Débito Direto" || f.tipo === "Estoque Sazonal") && f.fornEsp && !f.fornecedorEspecifico.trim()) { avisar("Você marcou Fornecedor Específico: informe o nome do fornecedor."); return; }

    // Anexo pendente (modo Microsoft): envia ao SharePoint antes de gravar
    let anexoFinal = f.anexo || null;
    if (AUTENTICACAO_REAL && arquivoAnexo) {
      try { anexoFinal = await enviarAnexoSharePoint(arquivoAnexo); }
      catch (e) { avisar("Falha ao enviar o anexo ao SharePoint. Verifique a conexão e tente novamente."); return; }
    }
    const fEfetivo = f.tipo === "Estoque" ? { ...f, fornEsp: false, fornecedorEspecifico: "" } : f;
    let nd, resumo = "", dataHora = agoraStr();
    if (editId) {
      nd = { ...dados, cadastros: dados.cadastros.map((c) => (c.id === editId ? { ...c, ...fEfetivo, anexo: anexoFinal } : c)) };
    } else {
      const novo = { id: uid(), solicitante: usuario.nome, email: usuario.email, dataHora, ...fEfetivo, anexo: anexoFinal, concluido: false };
      resumo = `• ${novo.descricao} — ${novo.unidade} | Tipo: ${novo.tipo}${novo.fornecedor ? ` | Fornecedor: ${novo.fornecedor}` : ""}${novo.fornecedorEspecifico ? ` | Fornecedor específico: ${novo.fornecedorEspecifico}` : ""}${novo.capex ? ` | Capex ${novo.nomeCapex}` : ""}${novo.observacoes ? ` | Obs: ${novo.observacoes}` : ""}`;
      nd = { ...dados, cadastros: [...dados.cadastros, novo] };
    }
    nd = comLog(nd, usuario, "Cadastro", editId ? "Editou solicitação de cadastro" : "Criou solicitação de cadastro", `${fEfetivo.descricao || ""} — ${fEfetivo.unidade || ""} | Tipo: ${fEfetivo.tipo || ""}`, editId || (nd.cadastros[nd.cadastros.length - 1] || {}).id);
    setDados(nd); await salvarDados(nd);
    setF(cadastroVazio()); setArquivoAnexo(null); const eraEdicao = !!editId; setEditId(null);
    if (!eraEdicao) {
      const c = nd.cadastros[nd.cadastros.length - 1];
      const tabela = {
        cabecalhos: ["Solicitante", "Descrição do Item", "UM", "Tipo de Cadastro", "Fornecedor", "Part Number", "Capex", "Forn. Específico", "Anexo", "Obs."],
        linhas: [[c.solicitante, c.descricao, c.unidade, c.tipo, c.fornecedor, c.partNumber, c.capex ? (c.nomeCapex || "Sim") : "—", c.fornecedorEspecifico || "—", c.anexo ? c.anexo.nome : "—", c.observacoes || "—"]],
      };
      notificarSolicitacao("Cadastro", usuario, nd, resumo, dataHora, tabela);
    }
  };

  const editar = (c) => { setEditId(c.id); setF({ ...cadastroVazio(), ...c }); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const remover = async (id) => {
    const alvo = dados.cadastros.find((c) => c.id === id);
    if (alvo && (alvo.concluido || alvo.cancelado)) { avisar("Item concluído ou cancelado não pode ser modificado."); return; }
    avisar("Solicitação de cadastro removida.");
    let nd = { ...dados, cadastros: dados.cadastros.filter((c) => c.id !== id) };
    nd = comLog(nd, usuario, "Cadastro", "Removeu solicitação de cadastro", alvo ? `${alvo.descricao || ""} (${alvo.tipo || ""})` : "", id);
    setDados(nd); await salvarDados(nd);
  };

  const exportarExcel = () => {
    const wb = XLSX.utils.book_new();
    const tipos = ["Estoque", "Estoque Sazonal", "Débito Direto"];
    tipos.forEach((t) => {
      const regs = dados.cadastros.filter((c) => c.tipo === t);
      let linhas;
      if (t === "Estoque") linhas = regs.map((c) => ({ "Solicitante": c.solicitante, "Data/Hora": c.dataHora, "Descrição": c.descricao, "Unidade": c.unidade, "Link Ref.": c.link, "Fornecedor": c.fornecedor, "Part Number": c.partNumber, "Capex": c.capex ? (c.nomeCapex || "Sim") : "Não", "Anexo": c.anexo ? c.anexo.nome : "", "Observações": c.observacoes || "", "Estoque Mínimo": c.estoqueMin, "Estoque Máximo": c.estoqueMax, "Consumo Mensal": c.consumoMensal, "Concluído": c.concluido ? "Sim" : "Não" }));
      else if (t === "Estoque Sazonal") linhas = regs.map((c) => ({ "Solicitante": c.solicitante, "Data/Hora": c.dataHora, "Descrição": c.descricao, "Unidade": c.unidade, "Link Ref.": c.link, "Fornecedor": c.fornecedor, "Part Number": c.partNumber, "Capex": c.capex ? (c.nomeCapex || "Sim") : "Não", "Anexo": c.anexo ? c.anexo.nome : "", "Fornecedor Específico": c.fornecedorEspecifico || "", "Observações": c.observacoes || "", "Estoque Desejado": c.estoqueDesejado, "Consumo Mensal": c.consumoMensal, "Concluído": c.concluido ? "Sim" : "Não" }));
      else linhas = regs.map((c) => ({ "Solicitante": c.solicitante, "Data/Hora": c.dataHora, "Descrição": c.descricao, "Unidade": c.unidade, "Link Ref.": c.link, "Fornecedor": c.fornecedor, "Part Number": c.partNumber, "Capex": c.capex ? (c.nomeCapex || "Sim") : "Não", "Anexo": c.anexo ? c.anexo.nome : "", "Fornecedor Específico": c.fornecedorEspecifico || "", "Observações": c.observacoes || "", "Quantidade": c.quantidade, "Centro de Custo": c.centroCusto, "Conta Contábil": c.contaContabil, "Concluído": c.concluido ? "Sim" : "Não" }));
      const ws = XLSX.utils.json_to_sheet(linhas.length ? linhas : [{}]);
      XLSX.utils.book_append_sheet(wb, ws, t.replace("é", "e"));
    });
    XLSX.writeFile(wb, "Solicitacoes_de_Cadastro.xlsx");
  };

  const minhas = dados.cadastros.filter((c) =>
    c.email === usuario.email &&
    semAcento(c.descricao).includes(semAcento(fDesc)) &&
    (fTipo === "Todos" || c.tipo === fTipo) &&
    (fStatus === "Todos" || statusDe(c) === fStatus)
  );
  const th = { padding: "8px", fontSize: 11.5, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left", whiteSpace: "nowrap" };
  const td = { padding: 6, borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 13.5, color: CORES.azul };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <Cartao style={{ position: "relative" }}>
        <h2 style={{ margin: "0 0 2px", color: CORES.azul }}>{editId ? "Editar Cadastro" : "Solicitação de Cadastros"}</h2>
        <p style={{ margin: "0 0 16px", fontSize: 13, color: CORES.cinza }}>Campos marcados com <span style={{ color: CORES.laranja }}>•</span> são obrigatórios. A Parte 2 é liberada conforme o Tipo de Cadastro.</p>

        <div style={{ borderLeft: `3px solid ${CORES.laranja}`, paddingLeft: 14, marginBottom: 8 }}>
          <strong style={{ color: CORES.azul, fontSize: 13, textTransform: "uppercase", letterSpacing: ".05em" }}>Parte 1 — Dados do item</strong>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14 }}>
          <Campo label="Solicitante"><input style={{ ...inputStyle, background: CORES.cinzaClaro, color: CORES.cinza }} value={usuario.nome} disabled /></Campo>
          <Campo label="Descrição do Item" obrigatorio><input style={inputStyle} value={f.descricao} onChange={(e) => set("descricao", e.target.value)} /></Campo>
          <Campo label="Unidade de Medida" obrigatorio><input style={inputStyle} value={f.unidade} onChange={(e) => set("unidade", e.target.value)} /></Campo>
          <Campo label="Link de Referência"><input style={inputStyle} value={f.link} onChange={(e) => set("link", e.target.value)} placeholder="https://…" /></Campo>
          <Campo label="Tipo de Cadastro" obrigatorio>
            <select style={inputStyle} value={f.tipo} onChange={(e) => set("tipo", e.target.value)}>
              <option value="">Selecione…</option>
              <option>Estoque</option>
              <option>Débito Direto</option>
              <option>Estoque Sazonal</option>
            </select>
          </Campo>
          <Campo label="Fornecedor"><input style={inputStyle} value={f.fornecedor} onChange={(e) => set("fornecedor", e.target.value)} /></Campo>
          <Campo label="Part Number / Cód. Fornecedor"><input style={inputStyle} value={f.partNumber} onChange={(e) => set("partNumber", e.target.value)} /></Campo>
          <Campo label="Capex">
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input type="checkbox" checked={!!f.capex} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                onChange={(e) => setF((x) => ({ ...x, capex: e.target.checked, nomeCapex: e.target.checked ? x.nomeCapex : "" }))} />
              <input style={{ ...inputStyle, background: f.capex ? "#fff" : CORES.cinzaClaro }} disabled={!f.capex}
                placeholder={f.capex ? "Código Capex" : "—"} value={f.nomeCapex} onChange={(e) => set("nomeCapex", e.target.value)} />
            </div>
          </Campo>
          <Campo label="Urgente">
            <label style={{ display: "flex", alignItems: "center", gap: 8, height: 37, cursor: "pointer" }}>
              <input type="checkbox" checked={!!f.urgente} onChange={(e) => set("urgente", e.target.checked)}
                style={{ width: 17, height: 17, accentColor: CORES.laranja }} />
              <span style={{ fontSize: 13, color: CORES.azul }}>Marcar este cadastro como urgente</span>
            </label>
          </Campo>
          <Campo label="Anexo (PDF ou DOC)">
            <div style={{ display: "flex", alignItems: "center", gap: 8, minHeight: 37 }}>
              <input ref={anexoRef} type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }} onChange={selecionarAnexo} />
              <Botao tipo="contorno" style={{ padding: "7px 12px", fontSize: 13 }} onClick={() => anexoRef.current && anexoRef.current.click()}>
                📎 {f.anexo ? "Trocar" : "Anexar"}
              </Botao>
              {f.anexo && (
                <span style={{ fontSize: 12.5, color: CORES.azul, maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={f.anexo.nome}>
                  {f.anexo.nome}
                </span>
              )}
              {f.anexo && (
                <button onClick={removerAnexo} title="Remover anexo"
                  style={{ border: "none", background: "none", color: CORES.laranja, cursor: "pointer", fontSize: 15, fontWeight: 700 }}>✕</button>
              )}
            </div>
          </Campo>
        </div>

        <div style={{ marginTop: 24, borderLeft: `3px solid ${parte1Ok ? CORES.laranja : CORES.cinza}`, paddingLeft: 14, marginBottom: 8, opacity: parte1Ok ? 1 : 0.5 }}>
          <strong style={{ color: CORES.azul, fontSize: 13, textTransform: "uppercase", letterSpacing: ".05em" }}>
            Parte 2 — Parâmetros do tipo {f.tipo ? `“${f.tipo}”` : ""}
          </strong>
          {!parte1Ok && <div style={{ fontSize: 12, color: CORES.cinza }}>Preencha a Parte 1 para liberar esta seção.</div>}
        </div>

        {parte1Ok && f.tipo === "Estoque" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
            <Campo label="Estoque Mínimo" obrigatorio legenda="Considerar 30 dias de Lead Time"><input style={inputStyle} type="number" value={f.estoqueMin} onChange={(e) => set("estoqueMin", e.target.value)} /></Campo>
            <Campo label="Estoque Máximo" obrigatorio><input style={inputStyle} type="number" value={f.estoqueMax} onChange={(e) => set("estoqueMax", e.target.value)} /></Campo>
            <Campo label="Consumo Mensal" obrigatorio><input style={inputStyle} type="number" value={f.consumoMensal} onChange={(e) => set("consumoMensal", e.target.value)} /></Campo>
          </div>
        )}
        {parte1Ok && f.tipo === "Estoque Sazonal" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
            <Campo label="Estoque Desejado" obrigatorio><input style={inputStyle} type="number" value={f.estoqueDesejado} onChange={(e) => set("estoqueDesejado", e.target.value)} /></Campo>
            <Campo label="Consumo Mensal" obrigatorio><input style={inputStyle} type="number" value={f.consumoMensal} onChange={(e) => set("consumoMensal", e.target.value)} /></Campo>
            <Campo label="Fornecedor Específico">
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="checkbox" checked={!!f.fornEsp} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                  onChange={(e) => setF((x) => ({ ...x, fornEsp: e.target.checked, fornecedorEspecifico: e.target.checked ? x.fornecedorEspecifico : "" }))} />
                <input style={{ ...inputStyle, background: f.fornEsp ? "#fff" : CORES.cinzaClaro }} disabled={!f.fornEsp}
                  placeholder={f.fornEsp ? "Nome do fornecedor exigido" : "Marque para informar"}
                  value={f.fornecedorEspecifico} onChange={(e) => set("fornecedorEspecifico", e.target.value)} />
              </div>
            </Campo>
          </div>
        )}
        {parte1Ok && f.tipo === "Débito Direto" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
            <Campo label="Quantidade" obrigatorio><input style={inputStyle} type="number" value={f.quantidade} onChange={(e) => set("quantidade", e.target.value)} /></Campo>
            <Campo label="Centro de Custo" obrigatorio><input style={inputStyle} value={f.centroCusto} onChange={(e) => set("centroCusto", e.target.value)} /></Campo>
            <Campo label="Conta Contábil" obrigatorio><input style={inputStyle} value={f.contaContabil} onChange={(e) => set("contaContabil", e.target.value)} /></Campo>
            <Campo label="Fornecedor Específico">
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="checkbox" checked={!!f.fornEsp} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                  onChange={(e) => setF((x) => ({ ...x, fornEsp: e.target.checked, fornecedorEspecifico: e.target.checked ? x.fornecedorEspecifico : "" }))} />
                <input style={{ ...inputStyle, background: f.fornEsp ? "#fff" : CORES.cinzaClaro }} disabled={!f.fornEsp}
                  placeholder={f.fornEsp ? "Nome do fornecedor exigido" : "Marque para informar"}
                  value={f.fornecedorEspecifico} onChange={(e) => set("fornecedorEspecifico", e.target.value)} />
              </div>
            </Campo>
          </div>
        )}

        <div style={{ marginTop: 16, maxWidth: 720 }}>
          <Campo label="Observações">
            <textarea style={{ ...inputStyle, minHeight: 64, resize: "vertical", fontFamily: "inherit" }}
              value={f.observacoes} onChange={(e) => set("observacoes", e.target.value)}
              placeholder="Informações adicionais sobre este item (aplicação, urgência, referência…)" />
          </Campo>
        </div>
        <div style={{ marginTop: 20, display: "flex", gap: 10, flexWrap: "wrap" }}>
          <Botao tipo="laranja" onClick={enviar}>{editId ? "Salvar alterações" : "Enviar solicitação e notificar por e-mail"}</Botao>
          {editId && <Botao tipo="contorno" onClick={() => { setEditId(null); setF(cadastroVazio()); }}>Cancelar edição</Botao>}
          <Botao tipo="contorno" onClick={exportarExcel}>Exportar Excel (abas por tipo)</Botao>
        </div>
      </Cartao>

      <Cartao>
        <h3 style={{ margin: "0 0 12px", color: CORES.azul }}>Minhas solicitações de cadastro</h3>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          <div style={{ flex: "2 1 220px" }}><Campo label="Filtro: Item"><input style={inputStyle} value={fDesc} onChange={(e) => setFDesc(e.target.value)} placeholder="Descrição do item…" /></Campo></div>
          <div style={{ flex: "1 1 160px" }}><Campo label="Filtro: Tipo">
            <select style={inputStyle} value={fTipo} onChange={(e) => setFTipo(e.target.value)}>
              <option>Todos</option><option>Estoque</option><option>Estoque Sazonal</option><option>Débito Direto</option>
            </select>
          </Campo></div>
          <div style={{ flex: "1 1 150px" }}><Campo label="Filtro: Status">
            <select style={inputStyle} value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
              <option>Todos</option><option>Pendente</option><option>Concluído</option><option>Cancelado</option>
            </select>
          </Campo></div>
        </div>
        {minhas.length === 0 ? <p style={{ color: CORES.cinza, fontSize: 14 }}>Nenhum cadastro encontrado. Ajuste os filtros ou envie um novo acima.</p> : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "100%" }}>
              <thead><tr>{["Data/Hora", "Descrição", "Un.", "Tipo", "Fornecedor", "Anexo", "Obs.", "Status", "Ações"].map((h) => <th key={h} style={th}>{h}</th>)}</tr></thead>
              <tbody>
                {minhas.map((c) => (
                  <tr key={c.id} style={{ opacity: c.concluido || c.cancelado ? 0.6 : 1 }}>
                    <td style={td}>{c.dataHora}</td><td style={td}>{c.descricao}</td><td style={td}>{c.unidade}</td>
                    <td style={td}><span style={{ background: CORES.cinzaClaro, padding: "2px 8px", borderRadius: 10, fontSize: 12 }}>{c.tipo}</span></td>
                    <td style={td}>{c.fornecedor}{c.fornecedorEspecifico && <div style={{ fontSize: 11, color: CORES.laranja, fontStyle: "italic" }} title={c.fornecedorEspecifico}>Específico: {c.fornecedorEspecifico}</div>}</td>
                    <td style={td}><AnexoLink anexo={c.anexo} /></td>
                    <td style={{ ...td, maxWidth: 150 }} title={c.observacoes || ""}>{c.observacoes ? (c.observacoes.length > 30 ? c.observacoes.slice(0, 28) + "…" : c.observacoes) : "—"}</td>
                    <td style={td}>{c.concluido ? <span style={{ color: "seagreen", fontWeight: 700 }} title={c.rc ? "RC: " + c.rc : ""}>Concluído 🔒{c.rc ? " · RC " + c.rc : ""}</span> : c.cancelado ? <span style={{ color: CORES.laranja, fontWeight: 700 }}>Cancelado 🔒<div style={{ fontSize: 11.5, fontWeight: 400, color: CORES.cinza, fontStyle: "italic", maxWidth: 220 }}>Motivo: {c.justificativa || "não informado"}</div></span> : <span style={{ color: CORES.laranja }}>Pendente</span>}</td>
                    <td style={{ ...td, whiteSpace: "nowrap" }}>
                      <Botao tipo="contorno" disabled={c.concluido || c.cancelado} style={{ padding: "4px 10px", fontSize: 12, marginRight: 6 }} onClick={() => editar(c)}>Editar</Botao>
                      <Botao tipo="perigo" disabled={c.concluido || c.cancelado} style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => remover(c.id)}>Remover</Botao>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Cartao>
    </div>
  );
}

/* ============================================================
   TELA: Atualização de Materiais
   ============================================================ */
function TelaMateriais({ dados, setDados, usuario }) {
  const fileRef = useRef(null);
  const [status, setStatus] = useState({ fase: "ocioso", msg: "" });

  /* -- Memoriza o arquivo escolhido (File System Access API + IndexedDB):
        o usuário seleciona o MateriaisDeCompra.csv UMA vez; depois, o botão relê
        o mesmo arquivo direto do disco, sem abrir janela. -- */
  const idbAbrir = () => new Promise((res, rej) => {
    const rq = indexedDB.open("aura-arquivos", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("handles");
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
  const idbGet = async (k) => { try { const db = await idbAbrir(); return await new Promise((res) => { const t = db.transaction("handles").objectStore("handles").get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); }); } catch (e) { return null; } };
  const idbSet = async (k, v) => { try { const db = await idbAbrir(); await new Promise((res) => { const t = db.transaction("handles", "readwrite").objectStore("handles").put(v, k); t.onsuccess = res; t.onerror = res; }); } catch (e) {} };

  // Formato oficial do MateriaisDeCompra.csv:
  //   delimitador ";" | Coluna A = "Cód Mat" | Coluna B = "Descrição Mat em Uso" | Coluna H = "UM Compra Padrão"
  // quoteChar/escapeChar acima usam um caractere de controle (\x01) em vez de `"` \u2014 o parser n\u00e3o
  // trata `"` como delimitador de campo, ent\u00e3o um CSV com campos entre aspas ("padr\u00e3o" quando o
  // texto tem `;`) chega aqui com as aspas literais coladas no valor. S\u00f3 remove quando o campo
  // inteiro est\u00e1 entre aspas (come\u00e7a E termina com aspas) \u2014 preserva um `"` de polegada isolado
  // no fim de uma descri\u00e7\u00e3o (ex.: MANGUEIRA 2").
  const tirarAspas = (s) => (s.length > 1 && /^["\u201c]/.test(s) && /["\u201d]$/.test(s)) ? s.slice(1, -1) : s;
  const interpretar = (res) => {
    const norm = (s) => (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
    return res.data.map((r) => {
      const chaves = Object.keys(r);
      const achar = (alvos, indice) => {
        const k = chaves.find((c) => alvos.includes(norm(c)));
        const bruto = k !== undefined ? String(r[k] ?? "") : (chaves[indice] !== undefined ? String(r[chaves[indice]] ?? "") : "");
        return tirarAspas(bruto.trim());
      };
      return {
        codigo: achar(["codmat", "codigo", "codigomaterial", "codmaterial", "coditem"], 0),
        descricao: achar(["descricaomatemuso", "descricao", "descricaodoitem", "descricaomaterial"], 1),
        unidade: achar(["umcomprapadrao", "umcompra", "unidade", "unidademedida", "um", "un"], 7),
      };
    }).filter((m) => (m.codigo || m.descricao) && norm(m.codigo) !== "codmat");
  };

  const concluir = async (res, dataMod) => {
    const materiais = interpretar(res);
    if (materiais.length === 0) {
      setStatus({ fase: "erro", msg: "Nenhum material reconhecido. Esperado: CSV separado por \";\" com as colunas Cód Mat, Descrição Mat em Uso e UM Compra Padrão." });
      return;
    }
    let nd = { ...dados, materiais, materiaisAtualizadoEm: dataMod };
    nd = comLog(nd, usuario, "Materiais", "Atualizou a base de materiais", `${materiais.length} materiais carregados (arquivo de ${dataMod})`, "");
    setDados(nd); await salvarDados(nd);
    setStatus({ fase: "concluido", msg: `Concluído ✓ — ${materiais.length} materiais carregados.` });
  };

  const processarCSV = (file, encoding) => {
    const dataMod = new Date(file.lastModified).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    Papa.parse(file, {
      header: true, skipEmptyLines: true, delimiter: ";", encoding: encoding || "UTF-8",
      quoteChar: "\x01", escapeChar: "\x01",
      complete: async (res) => {
        const texto = JSON.stringify(res.meta.fields || []) + JSON.stringify(res.data[0] || {});
        if (!encoding && texto.includes("\uFFFD")) { processarCSV(file, "ISO-8859-1"); return; }
        if ((res.meta.fields || []).length <= 1 && !file.__tentouAuto) {
          file.__tentouAuto = true;
          Papa.parse(file, {
            header: true, skipEmptyLines: true, encoding: encoding || "UTF-8",
            quoteChar: "\x01", escapeChar: "\x01",
            complete: (r2) => concluir(r2, dataMod), error: () => setStatus({ fase: "erro", msg: "Não foi possível ler o arquivo. Verifique se é um CSV válido." }),
          });
          return;
        }
        concluir(res, dataMod);
      },
      error: () => setStatus({ fase: "erro", msg: "Não foi possível ler o arquivo. Verifique se é um CSV válido." }),
    });
  };

  // Modo real (Entra ID): baixa o arquivo direto do SharePoint, sem nenhuma interação
  const URL_PASTA_SHAREPOINT = "https://tenant-teste.sharepoint.com/:f:/r/sites/Site_Teste/Shared%20Documents/Materiais";
  const baixarDoSharePoint = async () => {
    const app = obterMsal();
    const conta = app.getAllAccounts()[0];
    if (!conta) throw new Error("sem sessão");
    let token;
    try { token = (await app.acquireTokenSilent({ scopes: ["Files.Read.All"], account: conta })).accessToken; }
    catch (e) { token = (await app.acquireTokenPopup({ scopes: ["Files.Read.All"] })).accessToken; }
    const shareId = "u!" + btoa(URL_PASTA_SHAREPOINT).replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-");
    const base = `https://graph.microsoft.com/v1.0/shares/${shareId}/driveItem:/MateriaisDeCompra.csv`;
    const meta = await (await fetch(base, { headers: { Authorization: `Bearer ${token}` } })).json();
    const resp = await fetch(base + ":/content", { headers: { Authorization: `Bearer ${token}` } });
    if (!resp.ok) throw new Error("download falhou");
    const buf = await resp.arrayBuffer();
    let texto = new TextDecoder("utf-8").decode(buf);
    if (texto.includes("\uFFFD")) texto = new TextDecoder("iso-8859-1").decode(buf);
    const dataMod = meta.lastModifiedDateTime
      ? new Date(meta.lastModifiedDateTime).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })
      : agoraStr();
    Papa.parse(texto, {
      header: true, skipEmptyLines: true, delimiter: ";", quoteChar: "\x01", escapeChar: "\x01",
      complete: (res) => concluir(res, dataMod),
      error: () => setStatus({ fase: "erro", msg: "Falha ao interpretar o CSV do SharePoint." }),
    });
  };

  const atualizar = async () => {
    setStatus({ fase: "andamento", msg: "Atualização em andamento…" });

    // 1) SharePoint automático (quando o Entra ID estiver configurado pela TI)
    if (AUTENTICACAO_REAL) {
      try { await baixarDoSharePoint(); return; }
      catch (e) { /* segue para a leitura local */ }
    }

    // 2) Releitura silenciosa do arquivo já memorizado (sem abrir janela)
    if (window.showOpenFilePicker) {
      try {
        let handle = await idbGet("materiais");
        if (handle && handle.queryPermission) {
          let perm = await handle.queryPermission({ mode: "read" });
          if (perm !== "granted") perm = await handle.requestPermission({ mode: "read" });
          if (perm !== "granted") handle = null;
        }
        if (!handle) {
          // Primeira vez apenas: aponte onde está o MateriaisDeCompra.csv
          const [h] = await window.showOpenFilePicker({ types: [{ description: "CSV de materiais", accept: { "text/csv": [".csv"] } }] });
          handle = h; await idbSet("materiais", handle);
        }
        const file = await handle.getFile();
        processarCSV(file);
        return;
      } catch (e) {
        if (e && e.name === "AbortError") { setStatus({ fase: "ocioso", msg: "" }); return; }
      }
    }

    // 3) Último recurso (navegadores sem suporte): seletor tradicional
    fileRef.current?.click();
  };

  const corStatus = { andamento: CORES.azul, concluido: "seagreen", erro: CORES.laranja }[status.fase] || CORES.cinza;

  return (
    <Cartao style={{ maxWidth: 640, margin: "0 auto", textAlign: "center", padding: 40, position: "relative" }}>
      <h2 style={{ margin: "0 0 6px", color: CORES.azul }}>Atualização dos Materiais</h2>
      <p style={{ fontSize: 13.5, color: CORES.cinza, margin: "0 0 24px" }}>
        Atualiza a base de itens a partir do arquivo <strong>MateriaisDeCompra.csv</strong> (sempre o mesmo arquivo, no mesmo local).<br />
        Na primeira utilização, aponte onde ele está; nas próximas, a leitura é direta, sem abrir janela.
      </p>
      <input ref={fileRef} type="file" accept=".csv" style={{ display: "none" }}
        onChange={(e) => { const f = e.target.files?.[0]; if (f) processarCSV(f); e.target.value = ""; }} />
      <Botao tipo="laranja" style={{ fontSize: 16, padding: "14px 30px" }} disabled={status.fase === "andamento"} onClick={atualizar}>
        {status.fase === "andamento" ? "⏳ Atualização em andamento…" : "⟳ Atualização dos Materiais"}
      </Botao>
      {status.msg && (
        <div style={{ marginTop: 12, fontSize: 13.5, fontWeight: 700, color: corStatus }}>
          {status.msg}
        </div>
      )}
      <div style={{ marginTop: 10, fontSize: 12.5, color: CORES.cinza, fontStyle: "italic" }}>
        Modificação do arquivo “MateriaisDeCompra.csv”: {dados.materiaisAtualizadoEm || "— ainda não atualizado —"}
      </div>
      <div style={{ marginTop: 26, background: CORES.cinzaClaro, borderRadius: 8, padding: 14, textAlign: "left", fontSize: 13, color: CORES.azul }}>
        <strong>Base atual:</strong> {dados.materiais.length} materiais disponíveis para busca nas solicitações.
      </div>
    </Cartao>
  );
}


function TelaRelatorios({ dados, setDados, usuario, notificarEtapa }) {
  const [modo, setModo] = useState("Compra");
  const [fUsuario, setFUsuario] = useState("");
  const [fDescricao, setFDescricao] = useState("");
  const [fStatus, setFStatus] = useState("Todos");
  const [modal, setModal] = useState(null); // { registro, acao: "concluir" | "cancelar", texto }
  const admin = usuario.perfil === "GM";
  const lista = modo === "Compra" ? "compras" : "cadastros";

  const registros = (modo === "Compra" ? dados.compras : dados.cadastros).filter(
    (r) => r.solicitante.toLowerCase().includes(fUsuario.toLowerCase()) &&
      (r.descricao || "").toLowerCase().includes(fDescricao.toLowerCase()) &&
      (fStatus === "Todos" || statusDe(r) === fStatus)
  );

  const atualizarRegistro = async (id, mudancas, logInfo) => {
    let nd = { ...dados, [lista]: dados[lista].map((x) => (x.id === id ? { ...x, ...mudancas } : x)) };
    if (logInfo) nd = comLog(nd, usuario, logInfo.categoria || "Movimentação", logInfo.acao, logInfo.detalhe, id);
    setDados(nd); await salvarDados(nd);
  };

  /* ---------- Cadastros: Solicitado / Concluído / Cancelar ---------- */
  const alternarSolicitado = async (r) => {
    if (!admin || r.cancelado || r.concluido) return;
    const marcando = !r.solicitado;
    await atualizarRegistro(r.id, { solicitado: marcando, solicitadoPor: marcando ? usuario.nome : "", solicitadoEm: marcando ? agoraStr() : "" },
      { categoria: "Movimentação", acao: marcando ? "Marcou cadastro como Solicitado" : "Desmarcou 'Solicitado' do cadastro", detalhe: `${r.descricao || ""} (${r.tipo || ""})` });
    if (marcando) notificarEtapa(r, "Solicitado (em andamento)", "Seu cadastro foi encaminhado para processamento.", usuario.nome);
  };

  const alternarConcluidoCadastro = async (r) => {
    if (!admin || r.cancelado) return;
    if (!r.concluido && !r.solicitado) { avisar("Marque primeiro como “Solicitado” antes de concluir."); return; }
    if (!r.concluido) {
      // 1.1.2 — Débito Direto concluído gera automaticamente uma Solicitação de Compra
      if (r.tipo === "Débito Direto") {
        const compra = {
          id: uid(), solicitante: r.solicitante, email: r.email, dataHora: agoraStr(),
          codigo: "", descricao: r.descricao, quantidade: r.quantidade, unidade: r.unidade,
          centroCusto: r.centroCusto, contaContabil: r.contaContabil,
          capex: !!r.capex, nomeCapex: r.nomeCapex || "",
          observacoes: r.observacoes || "", fornecedorEspecifico: r.fornecedorEspecifico || "",
          concluido: false, origem: "Cadastro Débito Direto",
        };
        let nd = {
          ...dados,
          compras: [...dados.compras, compra],
          cadastros: dados.cadastros.map((x) => (x.id === r.id ? { ...x, concluido: true, concluidoPor: usuario.nome, concluidoEm: agoraStr(), compraGeradaId: compra.id } : x)),
        };
        nd = comLog(nd, usuario, "Movimentação", "Concluiu cadastro (Débito Direto) e gerou Solicitação de Compra", `${r.descricao || ""} → compra ${compra.id}`, r.id);
        setDados(nd); await salvarDados(nd);
        notificarEtapa(r, "Concluída", "Uma Solicitação de Compra foi gerada automaticamente a partir deste cadastro (Débito Direto).", usuario.nome);
        avisar("Cadastro concluído. Solicitação de Compra gerada automaticamente no relatório de Compras.");
      } else {
        // 2 — Estoque e Estoque Sazonal: apenas conclui, sem gerar compra
        await atualizarRegistro(r.id, { concluido: true, concluidoPor: usuario.nome, concluidoEm: agoraStr() },
          { categoria: "Movimentação", acao: "Concluiu cadastro", detalhe: `${r.descricao || ""} (${r.tipo || ""})` });
        notificarEtapa(r, "Concluída", "", usuario.nome);
      }
    } else {
      // Desfazer conclusão: remove a compra gerada, se ainda estiver pendente
      let compras = dados.compras;
      if (r.compraGeradaId) {
        const gerada = compras.find((c) => c.id === r.compraGeradaId);
        if (gerada && !gerada.concluido && !gerada.cancelado) {
          compras = compras.filter((c) => c.id !== r.compraGeradaId);
          avisar("Conclusão desfeita. A Solicitação de Compra gerada (ainda pendente) foi removida.");
        } else if (gerada) {
          avisar("Conclusão desfeita. A Solicitação de Compra gerada foi mantida por já estar concluída/cancelada.");
        }
      }
      let nd = {
        ...dados, compras,
        cadastros: dados.cadastros.map((x) => (x.id === r.id ? { ...x, concluido: false, concluidoPor: "", concluidoEm: "", compraGeradaId: "" } : x)),
      };
      nd = comLog(nd, usuario, "Movimentação", "Desfez conclusão de cadastro", `${r.descricao || ""} (${r.tipo || ""})`, r.id);
      setDados(nd); await salvarDados(nd);
    }
  };

  // Concluído: marcar exige nº da RC; desmarcar limpa o registro de conclusão
  const alternarConcluido = (r) => {
    if (!admin || r.cancelado) return;
    if (!r.concluido) setModal({ registro: r, acao: "concluir", texto: r.rc || "" });
    else atualizarRegistro(r.id, { concluido: false, concluidoPor: "", concluidoEm: "" },
      { categoria: "Movimentação", acao: "Reabriu solicitação (desfez conclusão)", detalhe: `${r.codigo || ""} — ${r.descricao || ""}` });
  };

  // Cancelar: marcar exige justificativa; desmarcar limpa o registro de cancelamento
  const alternarCancelado = (r) => {
    if (!admin || r.concluido) return;
    if (!r.cancelado) setModal({ registro: r, acao: "cancelar", texto: r.justificativa || "" });
    else atualizarRegistro(r.id, { cancelado: false, canceladoPor: "", justificativa: "", canceladoEm: "" },
      { categoria: "Movimentação", acao: "Reativou solicitação (desfez cancelamento)", detalhe: `${r.codigo || r.descricao || ""}` });
  };

  const confirmarModal = async () => {
    const t = (modal.texto || "").trim();
    if (!t) { avisar(modal.acao === "concluir" ? "Informe o número da RC para concluir." : "Informe a justificativa do cancelamento."); return; }
    if (modal.acao === "concluir") {
      const com = (modal.comentario || "").trim();
      await atualizarRegistro(modal.registro.id, { concluido: true, rc: t, comentarioAdmin: com, concluidoPor: usuario.nome, concluidoEm: agoraStr() },
        { categoria: "Movimentação", acao: `Concluiu solicitação de ${modo === "Compra" ? "compra" : "cadastro"}`, detalhe: `${modal.registro.codigo || modal.registro.descricao || ""} | RC: ${t}${com ? ` | Comentário: ${com}` : ""}` });
      notificarEtapa(modal.registro, "Concluída", `RC: ${t}${com ? ` | Comentário: ${com}` : ""}`, usuario.nome);
    } else {
      await atualizarRegistro(modal.registro.id, { cancelado: true, justificativa: t, canceladoPor: usuario.nome, canceladoEm: agoraStr() },
        { categoria: "Movimentação", acao: `Cancelou solicitação de ${modo === "Compra" ? "compra" : "cadastro"}`, detalhe: `${modal.registro.codigo || modal.registro.descricao || ""} | Motivo: ${t}` });
      notificarEtapa(modal.registro, "Cancelada", `Motivo: ${t}`, usuario.nome);
    }
    setModal(null);
  };

  const salvarOC = (r, valor) => {
    if ((r.oc || "") !== valor.trim()) atualizarRegistro(r.id, { oc: valor.trim() },
      { categoria: "Movimentação", acao: "Atualizou nº da OC", detalhe: `${r.codigo || r.descricao || ""} | OC: ${valor.trim() || "(vazio)"}` });
  };

  // Entregue: o Administrador marca quando o item chega à unidade (exige nº da OC já preenchido).
  // Desmarcar também desfaz a confirmação de recebimento (dependência lógica) e o solicitante
  // precisará confirmar novamente quando o item for reentregue.
  const alternarEntregue = (r) => {
    if (!admin || r.cancelado || !r.concluido) return;
    if (!r.entregue) {
      if (!(r.oc || "").trim()) { avisar("Informe o nº da OC antes de marcar como Entregue."); return; }
      atualizarRegistro(r.id, { entregue: true, entregueEm: agoraStr(), entreguePor: usuario.nome },
        { categoria: "Movimentação", acao: "Marcou item como Entregue", detalhe: `${r.codigo || r.descricao || ""} | OC: ${r.oc}` });
      notificarEtapa(r, "Item aguardando retirada", `OC: ${r.oc}`, usuario.nome);
    } else {
      atualizarRegistro(r.id, { entregue: false, entregueEm: "", entreguePor: "", recebido: false, recebidoEm: "", recebidoPor: "" },
        { categoria: "Movimentação", acao: "Desmarcou item como Entregue", detalhe: `${r.codigo || r.descricao || ""}` });
    }
  };

  // Item Recebido: confirmado pelo solicitante em "Solicitação de Compras".
  // Aqui o Administrador só pode DESMARCAR (nunca marcar em nome do solicitante).
  const desmarcarRecebido = (r) => {
    if (!admin || !r.recebido) return;
    atualizarRegistro(r.id, { recebido: false, recebidoEm: "", recebidoPor: "" },
      { categoria: "Movimentação", acao: "Desmarcou 'Item Recebido' (administrador)", detalhe: `${r.codigo || r.descricao || ""}` });
  };

  const colunas = modo === "Compra"
    ? [["dataHora", "Data/Hora"], ["solicitante", "Solicitante"], ["codigo", "Cód."], ["descricao", "Descrição"], ["quantidade", "Qtd."], ["unidade", "Un."], ["centroCusto", "C. Custo"], ["contaContabil", "Conta"], ["nomeCapex", "Capex"], ["urgente", "Urgente"], ["fornecedorEspecifico", "Forn. Específico"], ["observacoes", "Observações"]]
    : [["dataHora", "Data/Hora"], ["solicitante", "Solicitante"], ["descricao", "Descrição"], ["unidade", "Un."], ["tipo", "Tipo"], ["fornecedor", "Fornecedor"], ["partNumber", "Part Number"]];

  // Colunas específicas de cada tipo de cadastro (4.x — relatório dividido por tipo)
  const colunasPorTipo = {
    "Estoque": [["dataHora", "Data/Hora"], ["solicitante", "Solicitante"], ["descricao", "Descrição"], ["unidade", "Un."], ["fornecedor", "Fornecedor"], ["estoqueMin", "Est. Mín."], ["estoqueMax", "Est. Máx."], ["consumoMensal", "Consumo/Mês"], ["nomeCapex", "Capex"], ["urgente", "Urgente"], ["anexo", "Anexo"], ["observacoes", "Observações"]],
    "Estoque Sazonal": [["dataHora", "Data/Hora"], ["solicitante", "Solicitante"], ["descricao", "Descrição"], ["unidade", "Un."], ["fornecedor", "Fornecedor"], ["estoqueDesejado", "Est. Desejado"], ["consumoMensal", "Consumo/Mês"], ["nomeCapex", "Capex"], ["urgente", "Urgente"], ["fornecedorEspecifico", "Forn. Específico"], ["anexo", "Anexo"], ["observacoes", "Observações"]],
    "Débito Direto": [["dataHora", "Data/Hora"], ["solicitante", "Solicitante"], ["descricao", "Descrição"], ["unidade", "Un."], ["quantidade", "Qtd."], ["centroCusto", "C. Custo"], ["contaContabil", "Conta"], ["nomeCapex", "Capex"], ["urgente", "Urgente"], ["fornecedorEspecifico", "Forn. Específico"], ["anexo", "Anexo"], ["observacoes", "Observações"]],
  };
  const badgeUrgente = (r) => r.urgente
    ? <span style={{ display: "inline-block", padding: "2px 8px", borderRadius: 10, fontSize: 11, fontWeight: 700, color: "#fff", background: "#b91c1c", whiteSpace: "nowrap" }}>🔴 Urgente</span>
    : <span style={{ color: CORES.cinza }}>—</span>;
  const TIPOS_CADASTRO = ["Estoque", "Estoque Sazonal", "Débito Direto"];

  const exportarExcel = () => {
    const wb = XLSX.utils.book_new();
    if (modo === "Compra") {
      const linhas = registros.map((r) => {
        const o = {};
        colunas.forEach(([k, rotulo]) => (o[rotulo] = r[k] || ""));
        o["Concluído"] = r.concluido ? "Sim" : "Não";
        o["RC"] = r.rc || "";
        o["OC"] = r.oc || "";
        o["Concluído em"] = r.concluidoEm || "";
        o["Concluído por"] = r.concluidoPor || "";
        o["Comentário Admin"] = r.comentarioAdmin || "";
        o["Entregue"] = r.entregue ? "Sim" : "Não";
        o["Entregue em"] = r.entregueEm || "";
        o["Entregue por"] = r.entreguePor || "";
        o["Item Recebido"] = r.recebido ? "Sim" : "Não";
        o["Recebido em"] = r.recebidoEm || "";
        o["Recebido por"] = r.recebidoPor || "";
        o["Status"] = r.cancelado ? "Cancelado" : rotuloStatusCompra(r);
        o["Cancelado"] = r.cancelado ? "Sim" : "Não";
        o["Justificativa"] = r.justificativa || "";
        o["Cancelado em"] = r.canceladoEm || "";
        o["Cancelado por"] = r.canceladoPor || "";
        o["Capex"] = r.capex ? "Sim" : "Não";
        o["Urgente"] = r.urgente ? "Sim" : "Não";
        o["Origem"] = r.origem || "";
        return o;
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas.length ? linhas : [{}]), "Compras");
      XLSX.writeFile(wb, "Relatorio_Compras.xlsx");
    } else {
      TIPOS_CADASTRO.forEach((t) => {
        const linhas = registros.filter((r) => r.tipo === t).map((r) => {
          const o = {};
          colunasPorTipo[t].forEach(([k, rotulo]) => {
            o[rotulo] = k === "anexo" ? (r.anexo ? r.anexo.nome + (r.anexo.url ? " | " + r.anexo.url : "") : "") : (r[k] || "");
          });
          o["Capex"] = r.capex ? "Sim" : "Não";
          o["Urgente"] = r.urgente ? "Sim" : "Não";
          o["Solicitado"] = r.solicitado ? "Sim" : "Não";
          o["Solicitado em"] = r.solicitadoEm || "";
          o["Concluído"] = r.concluido ? "Sim" : "Não";
          o["Concluído em"] = r.concluidoEm || "";
          o["Cancelado"] = r.cancelado ? "Sim" : "Não";
          o["Cancelado em"] = r.canceladoEm || "";
          o["Justificativa"] = r.justificativa || "";
          o["Registrado por"] = r.concluidoPor || r.canceladoPor || r.solicitadoPor || "";
          return o;
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas.length ? linhas : [{}]), t.replace("é", "e"));
      });
      XLSX.writeFile(wb, "Relatorio_Cadastros.xlsx");
    }
  };

  const th = { padding: 8, fontSize: 11.5, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left", whiteSpace: "nowrap" };
  const td = { padding: "7px 8px", borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 13.5, color: CORES.azul };
  const check = (marcado, desabilitado, aoMudar, titulo) => (
    <input type="checkbox" checked={!!marcado} disabled={desabilitado} onChange={aoMudar} title={titulo}
      style={{ width: 17, height: 17, accentColor: CORES.laranja, cursor: desabilitado ? "not-allowed" : "pointer" }} />
  );

  return (
    <Cartao>
      <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "space-between", alignItems: "center", gap: 12, marginBottom: 16 }}>
        <h2 style={{ margin: 0, color: CORES.azul }}>Relatórios</h2>
        {/* Switch Compra / Cadastros */}
        <div style={{ display: "flex", border: `1px solid ${CORES.cinza}`, borderRadius: 20, overflow: "hidden" }}>
          {["Compra", "Cadastros"].map((m) => (
            <button key={m} onClick={() => setModo(m)} style={{
              padding: "7px 20px", border: "none", cursor: "pointer", fontSize: 13.5, fontWeight: 700, fontFamily: "inherit",
              background: modo === m ? CORES.laranja : "#fff", color: modo === m ? "#fff" : CORES.azul, transition: "all .15s",
            }}>{m}</button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
        <div style={{ flex: "1 1 220px" }}><Campo label="Filtro: Usuário Solicitante"><input style={inputStyle} value={fUsuario} onChange={(e) => setFUsuario(e.target.value)} placeholder="Digite um nome…" /></Campo></div>
        <div style={{ flex: "1 1 220px" }}><Campo label="Filtro: Descrição do Item"><input style={inputStyle} value={fDescricao} onChange={(e) => setFDescricao(e.target.value)} placeholder="Digite uma descrição…" /></Campo></div>
        <div style={{ flex: "1 1 150px" }}><Campo label="Filtro: Status">
          <select style={inputStyle} value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
            <option>Todos</option><option>Pendente</option><option>Concluído</option><option>Cancelado</option>
          </select>
        </Campo></div>
        <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
          <Botao tipo="contorno" onClick={exportarExcel}>Exportar Excel</Botao>
          <Botao tipo="contorno" onClick={() => window.print()}>Exportar PDF</Botao>
        </div>
      </div>

      <div id="area-relatorio" style={{ overflowX: "auto" }}>
        {/* Cabeçalho que aparece somente no PDF impresso */}
        <div className="so-impressao" style={{ marginBottom: 8, borderBottom: `2px solid ${CORES.azul}`, paddingBottom: 6 }}>
          <div style={{ fontSize: 14, fontWeight: 800, color: CORES.azul }}>
            AURA MINERALS — Relatório de {modo === "Compra" ? "Solicitações de Compra" : "Solicitações de Cadastro"}
          </div>
          <div style={{ fontSize: 9, color: CORES.cinza }}>
            Emitido em {agoraStr()} por {usuario.nome}
            {fUsuario ? ` · Filtro solicitante: "${fUsuario}"` : ""}{fDescricao ? ` · Filtro descrição: "${fDescricao}"` : ""}{fStatus !== "Todos" ? ` · Status: ${fStatus}` : ""}
            {" · Documento gerado pelo sistema (protótipo com apoio de IA)"}
          </div>
        </div>
        {modo === "Compra" ? (
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 1100 }}>
          <thead><tr>
            {colunas.map(([, rotulo]) => <th key={rotulo} style={th}>{rotulo}</th>)}
            <th style={{ ...th, background: CORES.laranja }}>Concluído</th>
            <th style={{ ...th, background: CORES.laranja }}>RC</th>
            <th style={{ ...th, background: CORES.laranja }}>OC</th>
            <th style={{ ...th, background: CORES.laranja }}>Entregue</th>
            <th style={{ ...th, background: CORES.laranja }}>Item Recebido</th>
            <th style={{ ...th, background: CORES.laranja }}>Cancelar</th>
            <th style={th}>Concluído em</th>
            <th style={th}>Entregue em</th>
            <th style={th}>Recebido em</th>
            <th style={th}>Cancelado em</th>
            <th style={th}>Registro (Admin)</th>
          </tr></thead>
          <tbody>
            {registros.length === 0 ? (
              <tr><td style={{ ...td, textAlign: "center", padding: 24, color: CORES.cinza }} colSpan={colunas.length + 11}>Nenhum registro encontrado com os filtros atuais.</td></tr>
            ) : registros.map((r) => (
              <tr key={r.id} style={{ background: r.concluido ? "rgba(46,139,87,.06)" : r.cancelado ? "rgba(244,97,77,.07)" : "transparent" }}>
                {colunas.map(([k]) => (
                  <td key={k} style={{ ...td, textDecoration: r.cancelado ? "line-through" : "none", opacity: r.cancelado ? 0.65 : 1 }}>
                    {k === "urgente" ? badgeUrgente(r) : k === "observacoes" ? (
                      r.observacoes ? (
                        <div style={{ background: "rgba(244,97,77,.08)", borderLeft: `3px solid ${CORES.laranja}`, borderRadius: 4, padding: "4px 8px", fontSize: 12.5, fontStyle: "italic", color: CORES.azul, minWidth: 160, maxWidth: 260, whiteSpace: "normal" }} title={r.observacoes}>
                          💬 {r.observacoes}
                        </div>
                      ) : <span style={{ color: CORES.cinza }}>—</span>
                    ) : (
                      <span>{r[k]}{k === "descricao" && r.origem ? <div style={{ fontSize: 11, color: CORES.laranja, fontStyle: "italic" }}>origem: {r.origem}</div> : null}</span>
                    )}
                  </td>
                ))}
                {/* Concluído: exige RC ao marcar */}
                <td style={{ ...td, textAlign: "center" }}>
                  {check(r.concluido, !admin || r.cancelado, () => alternarConcluido(r),
                    !admin ? "Somente administradores" : r.cancelado ? "Item cancelado" : "Marcar como concluído (exige nº da RC)")}
                </td>
                {/* RC: preenchida no ato da conclusão */}
                <td style={{ ...td, whiteSpace: "nowrap", fontWeight: 600 }}>{r.rc || "—"}</td>
                {/* OC: informada depois, quando existir; editável só por admin em itens concluídos */}
                <td style={{ ...td, width: 130, minWidth: 130 }}>
                  {admin && r.concluido ? (
                    <div style={{ minWidth: 110 }}>
                      <input className="so-tela" style={{ ...inputStyle, width: "100%", boxSizing: "border-box", padding: "4px 8px", fontSize: 13 }} defaultValue={r.oc || ""} placeholder="nº OC"
                        key={r.id + (r.oc || "")} onBlur={(e) => salvarOC(r, e.target.value)}
                        onKeyDown={(e) => e.key === "Enter" && e.currentTarget.blur()} title="Informe o nº da OC quando disponível" />
                      <span className="so-impressao" style={{ fontWeight: 600 }}>{r.oc || "—"}</span>
                    </div>
                  ) : (r.oc || "—")}
                </td>
                {/* Entregue: exige nº da OC preenchido; desmarcar também desfaz o Recebido */}
                <td style={{ ...td, textAlign: "center" }}>
                  {check(r.entregue, !admin || r.cancelado || !r.concluido, () => alternarEntregue(r),
                    !admin ? "Somente administradores" : r.cancelado ? "Item cancelado" : !r.concluido ? "Conclua a solicitação (RC) primeiro" : r.entregue ? "Desmarcar Entregue (também desfaz o Item Recebido)" : "Marcar como Entregue (exige nº da OC)")}
                </td>
                {/* Item Recebido: confirmado pelo solicitante em Solicitação de Compras; aqui o admin só pode desmarcar */}
                <td style={{ ...td, textAlign: "center" }}>
                  {check(r.recebido, !admin || !r.recebido, () => desmarcarRecebido(r),
                    !admin ? "Somente administradores" : !r.recebido ? "Aguardando confirmação do solicitante" : "Desmarcar Item Recebido (somente administrador)")}
                </td>
                {/* Cancelar: exige justificativa */}
                <td style={{ ...td, textAlign: "center" }}>
                  {check(r.cancelado, !admin || r.concluido, () => alternarCancelado(r),
                    !admin ? "Somente administradores" : r.concluido ? "Item concluído" : "Cancelar (exige justificativa)")}
                </td>
                <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12.5 }}>{r.concluidoEm || "—"}</td>
                <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12.5 }}>{r.entregueEm || "—"}</td>
                <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12.5 }}>{r.recebidoEm || "—"}</td>
                <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12.5 }}>{r.canceladoEm || "—"}</td>
                {/* Trilha: qual admin concluiu / entregou / cancelou, e quem confirmou o recebimento */}
                <td style={{ ...td, fontSize: 12.5 }}>
                  {r.concluido && r.concluidoPor && (
                    <div style={{ color: "seagreen" }}>✓ Concluído por {r.concluidoPor}
                      {r.comentarioAdmin && <div style={{ color: CORES.azul, fontStyle: "italic", fontWeight: 400 }} title={r.comentarioAdmin}>💬 “{r.comentarioAdmin.length > 70 ? r.comentarioAdmin.slice(0, 68) + "…" : r.comentarioAdmin}”</div>}
                    </div>
                  )}
                  {r.entregue && r.entreguePor && <div style={{ color: CORES.azul }}>📦 Entregue por {r.entreguePor}</div>}
                  {r.recebido && <div style={{ color: "seagreen" }}>✓ Recebido{r.recebidoPor ? " por " + r.recebidoPor : ""}</div>}
                  {r.cancelado && r.canceladoPor && (
                    <div style={{ color: CORES.laranja }} title={r.justificativa}>✕ Cancelado por {r.canceladoPor}<br />
                      <span style={{ color: CORES.cinza, fontStyle: "italic" }}>“{(r.justificativa || "").slice(0, 60)}{(r.justificativa || "").length > 60 ? "…" : ""}”</span>
                    </div>
                  )}
                  {!r.concluido && !r.cancelado && <span style={{ color: CORES.cinza }}>—</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        ) : (
        /* ---------- Relatório de Cadastros dividido por tipo ---------- */
        <div style={{ display: "flex", flexDirection: "column", gap: 26 }}>
          {TIPOS_CADASTRO.map((tipo) => {
            const doTipo = registros.filter((r) => r.tipo === tipo);
            return (
              <div key={tipo}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8, borderLeft: `4px solid ${CORES.laranja}`, paddingLeft: 10 }}>
                  <h3 style={{ margin: 0, color: CORES.azul, fontSize: 16 }}>{tipo}</h3>
                  <span style={{ fontSize: 12, color: "#fff", background: CORES.cinza, borderRadius: 12, padding: "2px 10px" }}>{doTipo.length}</span>
                  {tipo === "Débito Direto" && <span style={{ fontSize: 11.5, color: CORES.laranja, fontStyle: "italic" }}>concluir gera Solicitação de Compra automaticamente</span>}
                </div>
                <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 1100 }}>
                  <thead><tr>
                    {colunasPorTipo[tipo].map(([, rotulo]) => <th key={rotulo} style={th}>{rotulo}</th>)}
                    <th style={{ ...th, background: CORES.laranja }}>Solicitado</th>
                    <th style={{ ...th, background: CORES.laranja }}>Concluído</th>
                    <th style={{ ...th, background: CORES.laranja }}>Cancelar</th>
                    <th style={th}>Solicitado em</th>
                    <th style={th}>Concluído em</th>
                    <th style={th}>Cancelado em</th>
                    <th style={th}>Registro (Admin)</th>
                  </tr></thead>
                  <tbody>
                    {doTipo.length === 0 ? (
                      <tr><td style={{ ...td, textAlign: "center", padding: 16, color: CORES.cinza }} colSpan={colunasPorTipo[tipo].length + 7}>Nenhum cadastro deste tipo.</td></tr>
                    ) : doTipo.map((r) => (
                      <tr key={r.id} style={{ background: r.concluido ? "rgba(46,139,87,.06)" : r.cancelado ? "rgba(244,97,77,.07)" : "transparent" }}>
                        {colunasPorTipo[tipo].map(([k]) => (
                          <td key={k} style={{ ...td, textDecoration: r.cancelado ? "line-through" : "none", opacity: r.cancelado ? 0.65 : 1 }}>
                            {k === "urgente" ? badgeUrgente(r)
                              : k === "anexo" ? <AnexoLink anexo={r.anexo} />
                              : k === "observacoes" ? (r.observacoes
                                ? <div style={{ background: "rgba(244,97,77,.08)", borderLeft: `3px solid ${CORES.laranja}`, borderRadius: 4, padding: "4px 8px", fontSize: 12.5, fontStyle: "italic", color: CORES.azul, minWidth: 140, maxWidth: 240, whiteSpace: "normal" }} title={r.observacoes}>💬 {r.observacoes}</div>
                                : <span style={{ color: CORES.cinza }}>—</span>)
                              : r[k]}
                          </td>
                        ))}
                        {/* Solicitado */}
                        <td style={{ ...td, textAlign: "center" }}>
                          {check(r.solicitado, !admin || r.cancelado || r.concluido, () => alternarSolicitado(r),
                            !admin ? "Somente administradores" : r.concluido ? "Já concluído" : r.cancelado ? "Item cancelado" : "Marcar como solicitado")}
                        </td>
                        {/* Concluído */}
                        <td style={{ ...td, textAlign: "center" }}>
                          {check(r.concluido, !admin || r.cancelado, () => alternarConcluidoCadastro(r),
                            !admin ? "Somente administradores" : r.cancelado ? "Item cancelado" : !r.solicitado && !r.concluido ? "Marque Solicitado primeiro" : tipo === "Débito Direto" ? "Concluir e gerar Solicitação de Compra" : "Marcar como concluído")}
                        </td>
                        {/* Cancelar */}
                        <td style={{ ...td, textAlign: "center" }}>
                          {check(r.cancelado, !admin || r.concluido, () => alternarCancelado(r),
                            !admin ? "Somente administradores" : r.concluido ? "Item concluído" : "Cancelar (exige justificativa)")}
                        </td>
                        <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12 }}>{r.solicitadoEm || "—"}</td>
                        <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12 }}>{r.concluidoEm || "—"}</td>
                        <td style={{ ...td, whiteSpace: "nowrap", fontSize: 12 }}>{r.canceladoEm || "—"}</td>
                        {/* Trilha */}
                        <td style={{ ...td, fontSize: 12.5 }}>
                          {r.solicitado && !r.concluido && !r.cancelado && <div style={{ color: CORES.azul }}>◔ Solicitado por {r.solicitadoPor || "—"}</div>}
                          {r.concluido && <div style={{ color: "seagreen" }}>✓ Concluído por {r.concluidoPor}{r.compraGeradaId ? " · compra gerada" : ""}</div>}
                          {r.cancelado && r.canceladoPor && (
                            <div style={{ color: CORES.laranja }} title={r.justificativa}>✕ Cancelado por {r.canceladoPor}<br />
                              <span style={{ color: CORES.cinza, fontStyle: "italic" }}>“{(r.justificativa || "").slice(0, 60)}{(r.justificativa || "").length > 60 ? "…" : ""}”</span>
                            </div>
                          )}
                          {!r.solicitado && !r.concluido && !r.cancelado && <span style={{ color: CORES.cinza }}>—</span>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })}
        </div>
        )}
      </div>
      {!admin && <p style={{ fontSize: 12, color: CORES.cinza, marginTop: 10 }}>As colunas Concluído, RC, OC, Entregue, Item Recebido e Cancelar só podem ser alteradas por administradores. Itens concluídos ou cancelados ficam bloqueados para edição e remoção. O solicitante confirma o recebimento na tela de Solicitação de Compras.</p>}

      {/* Modal de RC (conclusão) ou Justificativa (cancelamento) */}
      {modal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(45,61,112,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60 }}>
          <div style={{ background: "#fff", borderRadius: 12, padding: 24, width: "min(460px, 92%)", borderTop: `4px solid ${CORES.laranja}` }}>
            <h3 style={{ margin: "0 0 4px", color: CORES.azul }}>
              {modal.acao === "concluir" ? "Concluir solicitação" : "Cancelar solicitação"}
            </h3>
            <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 14px" }}>
              {modal.registro.descricao}
            </p>
            <Campo label={modal.acao === "concluir" ? "Número da RC" : "Justificativa do cancelamento"} obrigatorio>
              {modal.acao === "concluir" ? (
                <input style={inputStyle} autoFocus value={modal.texto} placeholder="Ex: RC-000123"
                  onChange={(e) => setModal({ ...modal, texto: e.target.value })} />
              ) : (
                <textarea style={{ ...inputStyle, minHeight: 80, resize: "vertical" }} autoFocus value={modal.texto}
                  placeholder="Descreva o motivo do cancelamento…"
                  onChange={(e) => setModal({ ...modal, texto: e.target.value })} />
              )}
            </Campo>
            {modal.acao === "concluir" && (
              <div style={{ marginTop: 12 }}>
                <Campo label="Comentário ao solicitante (opcional)">
                  <textarea style={{ ...inputStyle, minHeight: 64, resize: "vertical", fontFamily: "inherit" }}
                    value={modal.comentario || ""} placeholder="Ex: prazo estimado de entrega, fornecedor escolhido, orientações…"
                    onChange={(e) => setModal({ ...modal, comentario: e.target.value })} />
                </Campo>
              </div>
            )}
            <div style={{ marginTop: 16, display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <Botao tipo="contorno" onClick={() => setModal(null)}>Voltar</Botao>
              <Botao tipo={modal.acao === "concluir" ? "primario" : "perigo"} onClick={confirmarModal}>
                {modal.acao === "concluir" ? "Confirmar conclusão" : "Confirmar cancelamento"}
              </Botao>
            </div>
          </div>
        </div>
      )}
    </Cartao>
  );
}
