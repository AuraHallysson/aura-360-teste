<script>
// Persistencia fora do Claude: armazenamento do navegador quando disponivel, memoria como fallback.
if (!window.storage) {
  const mem = {};
  const lsOk = (function(){ try { const t="__t__"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); return true; } catch(e){ return false; } })();
  const ler = (k) => { try { if (lsOk) { const v = window.localStorage.getItem("aura__"+k); return v === null ? undefined : v; } } catch(e){} return mem[k]; };
  const gravar = (k,v) => { try { if (lsOk) { window.localStorage.setItem("aura__"+k, v); return; } } catch(e){} mem[k]=v; };
  const apagar = (k) => { try { if (lsOk) { window.localStorage.removeItem("aura__"+k); } } catch(e){} delete mem[k]; };
  window.storage = {
    async get(k){ const v = ler(k); if (v === undefined) throw new Error("chave inexistente"); return {key:k, value:v}; },
    async set(k,v){ gravar(k,v); return {key:k}; },
    async delete(k){ apagar(k); return {key:k, deleted:true}; },
    async list(){ return {keys:[]}; }
  };
}
// Toast interno (substitui alert, bloqueado em iframes de pre-visualizacao)

  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 5500);
}

/* ---------------- Senhas: armazenamento apenas como hash (PBKDF2-SHA256 + salt) ----------------
   A senha digitada nunca é gravada: guarda-se somente um hash irreversível com salt individual.  */
const _webCryptoOk = () => (typeof crypto !== "undefined" && crypto.subtle && crypto.getRandomValues);

const gerarSalt = () => {
  try {
    if (_webCryptoOk()) return Array.from(crypto.getRandomValues(new Uint8Array(16))).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { /* segue para o fallback */ }
  // Fallback (contexto não seguro / file://): salt pseudoaleatório — MODO DEMONSTRAÇÃO apenas
  let s = "";
  for (let i = 0; i < 16; i++) s += Math.floor(Math.random() * 256).toString(16).padStart(2, "0");
  return s;
};

// Hash determinístico de fallback (sem Web Crypto). Não é forte — usado só no modo demonstração
// quando o navegador não expõe crypto.subtle (ex.: app aberto como arquivo local file://).
function _hashFallback(senha, salt) {
  const s = String(salt) + "::" + String(senha);
  let h1 = 0x811c9dc5, h2 = 0xc2b2ae35;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
  }
  let out = "";
  for (let k = 0; k < 8; k++) {
    h1 = Math.imul(h1 ^ (h1 >>> 15), 0x2c1b3c6d) >>> 0;
    h2 = Math.imul(h2 ^ (h2 >>> 13), 0x297a2d39) >>> 0;
    out += ((h1 ^ h2) >>> 0).toString(16).padStart(8, "0");
  }
  return out;
}

// Método de hash disponível neste contexto ("pbkdf2" com Web Crypto; senão "fb")
const metodoHash = () => (_webCryptoOk() ? "pbkdf2" : "fb");

// Calcula o hash conforme o método (permite verificar senha gravada em qualquer contexto)
async function hashSenha(senha, salt, metodo) {
  const m = metodo || metodoHash();
  if (m === "pbkdf2" && _webCryptoOk()) {
    const enc = new TextEncoder();
    const chave = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: enc.encode(salt), iterations: 100000 }, chave, 256
    );
    return Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  return _hashFallback(senha, salt);
}
// Sempre há um método de hash (Web Crypto ou fallback do modo demonstração)
const criptoDisponivel = () => true;

// Migração idempotente: perfil antigo "Administrador" → "GM"; garante permissoes em usuários sem o campo
function migrarUsuarios(usuarios) {
  const out = {};
  for (const [email, u] of Object.entries(usuarios || {})) {
    const perfil = u.perfil === "Administrador" ? "GM" : u.perfil;
    out[email] = { ...u, perfil, permissoes: u.permissoes || permissoesDefault() };

  return out;
}

  auditoria: [], // trilha de auditoria (SOX): registros imutáveis, append-only
});

/* ---------------- Trilha de auditoria (SOX) ----------------
   Registro imutável de TODAS as movimentações (quem, o quê, quando).
   Os registros são apenas ANEXADOS (nunca editados/removidos pela aplicação).
   Categorias: Compra | Cadastro | Movimentação | Materiais | Usuários | Acesso  */
const LOG_CATEGORIAS = ["Compra", "Cadastro", "Movimentação", "Materiais", "Usuários", "Acesso"];
function novoLog(usuario, categoria, acao, detalhe, refId) {
  const agora = new Date();
  return {
    id: uid(),
    ts: agora.toISOString(),                       // carimbo imutável e ordenável (UTC)
    quando: agora.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }),
    usuarioEmail: usuario && usuario.email ? usuario.email : "(sistema)",
    usuarioNome: usuario && usuario.nome ? usuario.nome : "Sistema",
    perfil: usuario && usuario.perfil ? usuario.perfil : "—",
    categoria: categoria || "Movimentação",
    acao: acao || "",
    detalhe: detalhe || "",
    refId: refId ? String(refId) : "",             // id da entidade relacionada (solicitação/usuário)
  };
}
// Retorna uma nova cópia de `d` com um registro de auditoria anexado (append-only).
function comLog(d, usuario, categoria, acao, detalhe, refId) {
  return { ...d, auditoria: [...(d.auditoria || []), novoLog(usuario, categoria, acao, detalhe, refId)] };
}

/* ---------------- Persistência (window.storage) ---------------- */
async function carregarDados() {
  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    if (r && r.value) {
      const d = JSON.parse(r.value);
      d.usuarios = migrarUsuarios(d.usuarios);
      if (!d.usuarios[PRIMEIRO_ADMIN]) d.usuarios[PRIMEIRO_ADMIN] = { nome: nomeDoEmail(PRIMEIRO_ADMIN), perfil: "GM" };
      else d.usuarios[PRIMEIRO_ADMIN].perfil = "GM";
      if (!Array.isArray(d.auditoria)) d.auditoria = []; // migração: bases antigas sem trilha
      return d;
    }
  } catch (e) { /* chave inexistente */ }
  return dadosVazios();
}
async function salvarDados(d) {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(d), true); } catch (e) { console.error("Falha ao salvar", e); }
  // Multiusuário: replica no SharePoint apenas as diferenças
  if (AUTENTICACAO_REAL && _ultimoSync) {
    const anterior = _ultimoSync;
    _ultimoSync = fotografar(d);
    try { await sincronizarGraph(anterior, _ultimoSync); }
    catch (e) {
      console.error("Sincronização com o SharePoint falhou", e);
      avisar("Atenção: a alteração foi salva localmente, mas a sincronização com o SharePoint falhou. Verifique sua conexão — o sistema tentará novamente na próxima alteração.");
      _ultimoSync = anterior; // volta a base do diff para reenviar depois
    }
  }
}

/* ---------------- Autocomplete de materiais ---------------- */
const semAcento = (s) => (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function CampoBuscaMaterial({ valor, aoMudar, aoEscolher, materiais, campo, placeholder, desabilitado }) {
  const [aberto, setAberto] = useState(false);
  const [mostrarTodos, setMostrarTodos] = useState(false); // seta ▼ = lista completa, mesmo com texto no campo
  const [pos, setPos] = useState(null); // posição fixa do dropdown (evita corte pela rolagem da tabela)
  const ref = useRef(null);
  const inputRef = useRef(null);

  const sugestoes = useMemo(() => {
    const v = semAcento(valor).trim();
    const ordenados = [...materiais].sort((a, b) =>
      campo === "codigo" ? String(a.codigo).localeCompare(String(b.codigo)) : String(a.descricao).localeCompare(String(b.descricao))
    );
    if (!v || mostrarTodos) return ordenados; // lista completa (escolha em lista)
    const palavras = v.split(/\s+/); // busca por todas as palavras digitadas, em qualquer ordem
    const filtrados = ordenados.filter((m) => {
      const alvo = semAcento(m.codigo) + " " + semAcento(m.descricao);
      return palavras.every((p) => alvo.includes(p));
    });
    // Prioridade: 1º) descrição/código COMEÇA com o texto digitado; 2º) apenas contém
    const comeca = (m) => semAcento(campo === "codigo" ? m.codigo : m.descricao).startsWith(v);
    return [...filtrados.filter(comeca), ...filtrados.filter((m) => !comeca(m))];
  }, [valor, materiais, campo, mostrarTodos]);

  const calcularPos = () => {
    if (!inputRef.current) return;
    const r = inputRef.current.getBoundingClientRect();
    const abaixo = window.innerHeight - r.bottom;
    setPos({
      left: Math.max(8, Math.min(r.left, window.innerWidth - 340)),
      largura: Math.max(r.width, 320),
      ...(abaixo < 240 && r.top > 260 ? { bottom: window.innerHeight - r.top + 2 } : { top: r.bottom + 2 }),
    });
  };

  const abrir = (todos) => {
    if (desabilitado) return;
    if (todos !== undefined) setMostrarTodos(todos);
    calcularPos();
    setAberto(true);
  };

  useEffect(() => {
    if (!aberto) return;
    const fora = (e) => { if (ref.current && !ref.current.contains(e.target)) setAberto(false); };
    const reposicionar = () => calcularPos();
    document.addEventListener("mousedown", fora);
    window.addEventListener("scroll", reposicionar, true);
    window.addEventListener("resize", reposicionar);
    return () => {
      document.removeEventListener("mousedown", fora);
      window.removeEventListener("scroll", reposicionar, true);
      window.removeEventListener("resize", reposicionar);
    };
  }, [aberto]);

  const estiloDropdown = pos ? {
    position: "fixed", left: pos.left, width: pos.largura, top: pos.top, bottom: pos.bottom,
    background: "#fff", border: `1px solid ${CORES.cinza}`, borderRadius: 6, zIndex: 60,
    boxShadow: "0 6px 16px rgba(45,61,112,.2)", maxHeight: 300, overflowY: "auto",
  } : { display: "none" };

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <input ref={inputRef} style={{ ...inputStyle, paddingRight: 26 }} value={valor || ""} placeholder={placeholder} disabled={desabilitado}
        onChange={(e) => { aoMudar(e.target.value); setMostrarTodos(false); calcularPos(); setAberto(true); }}
        onFocus={() => abrir()} />
      <span onClick={() => (aberto ? setAberto(false) : abrir(true))}
        style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: CORES.cinza, fontSize: 11, cursor: desabilitado ? "default" : "pointer", userSelect: "none" }}
        title="Abrir lista de materiais">▼</span>
      {aberto && sugestoes.length > 0 && (
        <div style={estiloDropdown}>
          {sugestoes.slice(0, 150).map((m) => (
            <div key={m.codigo + m.descricao} onMouseDown={(e) => { e.preventDefault(); aoEscolher(m); setAberto(false); setMostrarTodos(false); }}
              style={{ padding: "8px 10px", fontSize: 13, color: CORES.azul, cursor: "pointer", borderBottom: `1px solid ${CORES.cinzaClaro}` }}
              onMouseEnter={(e) => (e.currentTarget.style.background = CORES.cinzaClaro)}
              onMouseLeave={(e) => (e.currentTarget.style.background = "#fff")}>
              <strong>{m.codigo}</strong> — {m.descricao} <span style={{ color: CORES.cinza }}>({m.unidade})</span>
            </div>
          ))}
          <div style={{ padding: "6px 10px", fontSize: 11.5, color: CORES.cinza, background: CORES.cinzaClaro, position: "sticky", bottom: 0 }}>
            {sugestoes.length > 150 ? `Mostrando 150 de ${sugestoes.length} itens — continue digitando para refinar` : `${sugestoes.length} ${sugestoes.length === 1 ? "item encontrado" : "itens encontrados"}`}
          </div>
        </div>
      )}
      {aberto && sugestoes.length === 0 && (
        <div style={{ ...estiloDropdown, padding: "8px 10px", fontSize: 12.5, color: CORES.cinza }}>
          Item não encontrado na base. Para comprar um item novo, solicite antes a inclusão dele em <strong>Solicitação de Cadastros</strong>.
        </div>
      )}
    </div>
  );
}

/* ============================================================
   TELA: Solicitação de Compras
   ============================================================ */
const statusDe = (c) => (c.concluido ? "Concluído" : c.cancelado ? "Cancelado" : "Pendente");

// Status detalhado da Solicitação de Compras, exibido ao solicitante. RC e OC vêm
// automaticamente do que o Administrador preencheu no Relatório.
// Sequência: "Aguardando criação da RC" → "RC x" → "OC x" → "Item aguardando retirada" → "Item Recebido"
const rotuloStatusCompra = (c) => {
  if (c.recebido) return "Item Recebido";
  if (c.entregue) return "Item aguardando retirada";
  if (c.oc) return `OC ${c.oc}`;
  if (c.concluido && c.rc) return `RC ${c.rc}`;
  return "Aguardando criação da RC";
};

const linhaVazia = () => ({ codigo: "", descricao: "", quantidade: "", unidade: "", centroCusto: "", contaContabil: "", capex: false, nomeCapex: "", observacoes: "" });

function TelaCompras({ dados, setDados, usuario, notificarSolicitacao }) {
  const [linhas, setLinhas] = useState([linhaVazia()]);
  const [editando, setEditando] = useState(null); // item em edição (registro salvo)
  const [fornEsp, setFornEsp] = useState(false);
  const [fornEspNome, setFornEspNome] = useState("");
  const [fCod, setFCod] = useState("");
  const [fDesc, setFDesc] = useState("");
  const [fStatus, setFStatus] = useState("Todos");

  // 1.2 — sempre que uma linha for preenchida, gerar a próxima
  useEffect(() => {
    const u = linhas[linhas.length - 1];
    if (u && (u.codigo || u.descricao)) setLinhas((ls) => [...ls, linhaVazia()]);
  }, [linhas]);

  const mudar = (i, campo, valor) =>
    setLinhas((ls) => ls.map((l, j) => (j === i ? { ...l, [campo]: valor } : l)));

  const escolherMaterial = (i, m) =>
    setLinhas((ls) => ls.map((l, j) => (j === i ? { ...l, codigo: m.codigo, descricao: m.descricao, unidade: l.unidade || m.unidade } : l)));

  const removerLinha = (i) => setLinhas((ls) => (ls.length > 1 ? ls.filter((_, j) => j !== i) : ls));

  const buscarNaBase = (l) => {
    const cod = semAcento(l.codigo).trim();
    const desc = semAcento(l.descricao).trim();
    return dados.materiais.find((m) => (cod && semAcento(m.codigo) === cod) || (desc && semAcento(m.descricao) === desc)) || null;
  };

  const enviar = async () => {
    const preenchidas = linhas.filter((l) => l.codigo || l.descricao || l.quantidade || l.centroCusto || l.contaContabil);
    if (preenchidas.length === 0) { avisar("Preencha ao menos uma linha."); return; }
    const semItem = preenchidas.find((l) => !l.codigo && !l.descricao);
    if (semItem) { avisar("Cada linha precisa de Cód. Item OU Descrição do Item (campo obrigatório)."); return; }
    // 1.4 — o item precisa existir na base de materiais cadastrados
    const foraDaBase = preenchidas.filter((l) => !buscarNaBase(l));
    if (foraDaBase.length > 0) {
      avisar(
        "Os itens abaixo não existem na base de materiais:\n\n" +
        foraDaBase.map((l) => `• ${l.codigo || l.descricao}`).join("\n") +
        "\n\nPara comprar um item novo, primeiro solicite a inclusão dele na tela de Solicitação de Cadastros."
      );
      return;
    }
    const capexSemCodigo = preenchidas.find((l) => l.capex && !l.nomeCapex.trim());
    if (capexSemCodigo) { avisar("Linhas marcadas como Capex precisam do Código Capex preenchido."); return; }
    if (fornEsp && !fornEspNome.trim()) { avisar("Você marcou Fornecedor Específico: informe o nome do fornecedor."); return; }
    const dataHora = agoraStr();
    const novos = preenchidas.map((l) => {
      const m = buscarNaBase(l); // complementa código ↔ descrição pela base oficial
      return { id: uid(), solicitante: usuario.nome, email: usuario.email, dataHora, ...l, codigo: m.codigo, descricao: m.descricao, unidade: l.unidade || m.unidade, observacoes: (l.observacoes || "").trim(), fornecedorEspecifico: fornEsp ? fornEspNome.trim() : "", concluido: false };
    });
    let nd = { ...dados, compras: [...dados.compras, ...novos] };
    const logDetalhe = novos.map((n) => `${n.codigo} — ${n.descricao} (qtd ${n.quantidade || "?"} ${n.unidade || ""}; CC ${n.centroCusto || "-"}; Conta ${n.contaContabil || "-"})`).join(" | ");
    nd = comLog(nd, usuario, "Compra", `Criou solicitação de compra (${novos.length} ${novos.length > 1 ? "itens" : "item"})`, logDetalhe, novos.map((n) => n.id).join(","));
    setDados(nd); await salvarDados(nd);
    setLinhas([linhaVazia()]); setFornEsp(false); setFornEspNome("");
    const resumo = novos.map((n) => `• ${n.codigo} — ${n.descricao} | ${n.quantidade || "?"} ${n.unidade || ""} | CC ${n.centroCusto || "-"} | Conta ${n.contaContabil || "-"}${n.capex ? ` | Capex ${n.nomeCapex}` : ""}${n.fornecedorEspecifico ? ` | Fornecedor específico: ${n.fornecedorEspecifico}` : ""}${n.observacoes ? ` | Obs: ${n.observacoes}` : ""}`).join("\n");
    // Colunas do comunicado (admin): Solicitante, Item, Qtd, Centro de Custo, Conta Contábil e Código Capex
    const tabela = {
      cabecalhos: ["Solicitante", "Cód Mat", "Descr Material", "Quantidade", "UM", "Centro de Custo", "Conta Contábil", "Capex", "Forn. Específico", "Obs."],
      linhas: novos.map((n) => [n.solicitante, n.codigo, n.descricao, n.quantidade, n.unidade, n.centroCusto, n.contaContabil, n.capex ? (n.nomeCapex || "Sim") : "—", n.fornecedorEspecifico || "—", n.observacoes || "—"]),
    };
    notificarSolicitacao("Compra", usuario, nd, resumo, dataHora, tabela);
  };

  const salvarEdicao = async () => {
    if (!editando.codigo && !editando.descricao) { avisar("Cód. Item OU Descrição é obrigatório."); return; }
    const m = buscarNaBase(editando);
    if (!m) { avisar("Este item não existe na base de materiais. Solicite a inclusão dele na tela de Solicitação de Cadastros."); return; }
    if (editando.capex && !(editando.nomeCapex || "").trim()) { avisar("Item marcado como Capex precisa do Código Capex preenchido."); return; }
    const corrigido = { ...editando, codigo: m.codigo, descricao: m.descricao, unidade: editando.unidade || m.unidade };
    let nd = { ...dados, compras: dados.compras.map((c) => (c.id === editando.id ? corrigido : c)) };
    nd = comLog(nd, usuario, "Compra", "Editou solicitação de compra", `${corrigido.codigo} — ${corrigido.descricao}`, editando.id);
    setDados(nd); await salvarDados(nd); setEditando(null);
  };

  const removerItem = async (id) => {
    const alvo = dados.compras.find((c) => c.id === id);
    if (alvo && (alvo.concluido || alvo.cancelado)) { avisar("Item concluído ou cancelado não pode ser modificado."); return; }
    avisar("Solicitação removida.");
    let nd = { ...dados, compras: dados.compras.filter((c) => c.id !== id) };
    nd = comLog(nd, usuario, "Compra", "Removeu solicitação de compra", alvo ? `${alvo.codigo || ""} — ${alvo.descricao || ""}` : "", id);
    setDados(nd); await salvarDados(nd);
  };

  // O solicitante confirma o recebimento após o Administrador marcar "Entregue" no Relatório.
  // Uma vez confirmado, só um Administrador pode desmarcar (feito na tela de Relatórios).
  const confirmarRecebimento = async (c) => {
    if (!c.entregue || c.recebido) return;
    let nd = { ...dados, compras: dados.compras.map((x) => (x.id === c.id ? { ...x, recebido: true, recebidoEm: agoraStr(), recebidoPor: usuario.nome } : x)) };
    nd = comLog(nd, usuario, "Movimentação", "Confirmou recebimento do item", `${c.codigo || ""} — ${c.descricao || ""}`, c.id);
    setDados(nd); await salvarDados(nd);
  };

  const minhas = dados.compras.filter((c) =>
    c.email === usuario.email &&
    String(c.codigo || "").toLowerCase().includes(fCod.toLowerCase()) &&
    semAcento(c.descricao).includes(semAcento(fDesc)) &&
    (fStatus === "Todos" || statusDe(c) === fStatus)
  );
  const th = { padding: "8px 8px", fontSize: 11.5, textTransform: "uppercase", letterSpacing: ".04em", color: "#fff", background: CORES.azul, textAlign: "left", whiteSpace: "nowrap" };
  const td = { padding: 6, borderBottom: `1px solid ${CORES.cinzaClaro}`, verticalAlign: "top" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <Cartao style={{ position: "relative" }}>
        <h2 style={{ margin: "0 0 2px", color: CORES.azul }}>Solicitação de Compras</h2>
        <p style={{ margin: "0 0 6px", fontSize: 13, color: CORES.cinza }}>
          Solicitante: <strong style={{ color: CORES.azul }}>{usuario.nome}</strong> · Cód. Item ou Descrição preenchem um ao outro automaticamente.
        </p>
        <p style={{ margin: "0 0 16px", fontSize: 12.5, color: dados.materiaisAtualizadoEm ? CORES.cinza : CORES.laranja }}>
          Base de materiais: <strong>{dados.materiais.length}</strong> itens
          {dados.materiaisAtualizadoEm
            ? ` (arquivo de ${dados.materiaisAtualizadoEm})`
            : " — apenas exemplos! Carregue o MateriaisDeCompra.csv em “Atualização de Materiais” para buscar nos itens reais."}
        </p>
        <div style={{ overflowX: "auto" }}>
          <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 900 }}>
            <thead><tr>
              <th style={th}>Solicitante</th><th style={th}>Cód. Item •</th><th style={th}>Descrição do Item •</th>
              <th style={th}>Qtd.</th><th style={th}>Un. Medida</th><th style={th}>Centro de Custo</th><th style={th}>Conta Contábil</th>
              <th style={{ ...th, textAlign: "center" }}>Capex</th><th style={th}>Código Capex</th><th style={th}>Observações</th><th style={th}></th>
            </tr></thead>
            <tbody>
              {linhas.map((l, i) => (
                <tr key={i}>
                  <td style={td}><input style={{ ...inputStyle, background: CORES.cinzaClaro, color: CORES.cinza }} value={usuario.nome} disabled /></td>
                  <td style={{ ...td, minWidth: 120 }}>
                    <CampoBuscaMaterial campo="codigo" valor={l.codigo} materiais={dados.materiais} placeholder="Buscar código…"
                      aoMudar={(v) => mudar(i, "codigo", v)} aoEscolher={(m) => escolherMaterial(i, m)} />
                  </td>
                  <td style={{ ...td, minWidth: 220 }}>
                    <CampoBuscaMaterial campo="descricao" valor={l.descricao} materiais={dados.materiais} placeholder="Buscar descrição…"
                      aoMudar={(v) => mudar(i, "descricao", v)} aoEscolher={(m) => escolherMaterial(i, m)} />
                  </td>
                  <td style={{ ...td, width: 72, minWidth: 64 }}><input style={{ ...inputStyle, padding: "8px 6px", textAlign: "center", minWidth: 52 }} type="number" min="0" value={l.quantidade} onChange={(e) => mudar(i, "quantidade", e.target.value)} /></td>
                  <td style={{ ...td, width: 86, minWidth: 76 }}><input style={{ ...inputStyle, padding: "8px 6px", textAlign: "center", minWidth: 64 }} value={l.unidade} onChange={(e) => mudar(i, "unidade", e.target.value)} title={l.unidade || ""} /></td>
                  <td style={{ ...td, width: 130 }}><input style={inputStyle} value={l.centroCusto} onChange={(e) => mudar(i, "centroCusto", e.target.value)} /></td>
                  <td style={{ ...td, width: 130 }}><input style={inputStyle} value={l.contaContabil} onChange={(e) => mudar(i, "contaContabil", e.target.value)} /></td>
                  <td style={{ ...td, textAlign: "center", width: 54 }}>
                    <input type="checkbox" checked={!!l.capex} title="Marcar se a compra é Capex"
                      onChange={(e) => setLinhas((ls) => ls.map((x, j) => (j === i ? { ...x, capex: e.target.checked, nomeCapex: e.target.checked ? x.nomeCapex : "" } : x)))}
                      style={{ width: 17, height: 17, accentColor: CORES.laranja, cursor: "pointer", marginTop: 8 }} />
                  </td>
                  <td style={{ ...td, width: 130 }}>
                    <input style={{ ...inputStyle, background: l.capex ? "#fff" : CORES.cinzaClaro }} value={l.nomeCapex} disabled={!l.capex}
                      placeholder={l.capex ? "Código Capex" : "—"} onChange={(e) => mudar(i, "nomeCapex", e.target.value)} />
                  </td>
                  <td style={{ ...td, minWidth: 170 }}>
                    <input style={inputStyle} value={l.observacoes} placeholder="Obs. deste item…"
                      onChange={(e) => mudar(i, "observacoes", e.target.value)} title={l.observacoes || ""} />
                  </td>
                  <td style={td}>{linhas.length > 1 && i < linhas.length - 1 ? (
                    <button onClick={() => removerLinha(i)} title="Excluir linha" style={{ border: "none", background: "none", color: CORES.laranja, cursor: "pointer", fontSize: 16 }}>✕</button>) : null}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, fontWeight: 700, color: CORES.azul, cursor: "pointer", whiteSpace: "nowrap" }}>
            <input type="checkbox" checked={fornEsp}
              onChange={(e) => { setFornEsp(e.target.checked); if (!e.target.checked) setFornEspNome(""); }}
              style={{ width: 17, height: 17, accentColor: CORES.laranja }} />
            Fornecedor Específico
          </label>
          <input style={{ ...inputStyle, maxWidth: 420, background: fornEsp ? "#fff" : CORES.cinzaClaro }}
            disabled={!fornEsp} value={fornEspNome} onChange={(e) => setFornEspNome(e.target.value)}
            placeholder={fornEsp ? "Nome do fornecedor exigido para esta compra" : "Marque a opção para informar o fornecedor"} />
        </div>
        <div style={{ marginTop: 16, display: "flex", gap: 10 }}>
          <Botao tipo="laranja" onClick={enviar}>Enviar solicitação e notificar por e-mail</Botao>
        </div>
      </Cartao>

      <Cartao>
        <h3 style={{ margin: "0 0 12px", color: CORES.azul }}>Minhas solicitações de compra</h3>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          <div style={{ flex: "1 1 150px" }}><Campo label="Filtro: Código"><input style={inputStyle} value={fCod} onChange={(e) => setFCod(e.target.value)} placeholder="Cód. do item…" /></Campo></div>
          <div style={{ flex: "2 1 220px" }}><Campo label="Filtro: Item"><input style={inputStyle} value={fDesc} onChange={(e) => setFDesc(e.target.value)} placeholder="Descrição do item…" /></Campo></div>
          <div style={{ flex: "1 1 150px" }}><Campo label="Filtro: Status">
            <select style={inputStyle} value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
              <option>Todos</option><option>Pendente</option><option>Concluído</option><option>Cancelado</option>
            </select>
          </Campo></div>
        </div>
        {minhas.length === 0 ? <p style={{ color: CORES.cinza, fontSize: 14 }}>Nenhuma solicitação encontrada. Ajuste os filtros ou envie uma nova pela tabela acima.</p> : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 13.5, color: CORES.azul }}>
              <thead><tr>{["Data/Hora", "Cód.", "Descrição", "Qtd.", "Un.", "C. Custo", "Conta", "Capex", "Forn. Esp.", "Obs.", "Status", "Item Recebido", "Ações"].map((h) => <th key={h} style={th}>{h}</th>)}</tr></thead>
              <tbody>
                {minhas.map((c) => (
                  <tr key={c.id} style={{ opacity: c.recebido || c.cancelado ? 0.6 : 1 }}>
                    <td style={td}>{c.dataHora}</td><td style={td}>{c.codigo}</td><td style={td}>{c.descricao}</td>
                    <td style={td}>{c.quantidade}</td><td style={td}>{c.unidade}</td><td style={td}>{c.centroCusto}</td><td style={td}>{c.contaContabil}</td><td style={td}>{c.capex ? (c.nomeCapex || "Sim") : "—"}</td><td style={{ ...td, maxWidth: 120 }} title={c.fornecedorEspecifico || ""}>{c.fornecedorEspecifico || "—"}</td><td style={{ ...td, maxWidth: 160 }} title={c.observacoes || ""}>{c.observacoes ? (c.observacoes.length > 34 ? c.observacoes.slice(0, 32) + "…" : c.observacoes) : "—"}</td>
                    <td style={td}>
                      {c.cancelado ? (
                        <span style={{ color: CORES.laranja, fontWeight: 700 }}>Cancelado 🔒<div style={{ fontSize: 11.5, fontWeight: 400, color: CORES.cinza, fontStyle: "italic", maxWidth: 220 }}>Motivo: {c.justificativa || "não informado"}</div></span>
                      ) : (
                        <span style={{ color: c.recebido ? "seagreen" : c.entregue ? CORES.laranja : c.concluido ? CORES.azul : CORES.laranja, fontWeight: 700 }}>
                          {rotuloStatusCompra(c)}{c.concluido ? " 🔒" : ""}
                          {c.comentarioAdmin && <div style={{ fontSize: 11.5, fontWeight: 400, color: CORES.azul, fontStyle: "italic", maxWidth: 220 }}>💬 {c.comentarioAdmin}</div>}
                          {c.entregue && <div style={{ fontSize: 11, fontWeight: 400, color: CORES.cinza }}>Entregue em {c.entregueEm}</div>}
                          {c.recebido && <div style={{ fontSize: 11, fontWeight: 400, color: CORES.cinza }}>Recebido em {c.recebidoEm}</div>}
                        </span>
                      )}
                    </td>
                    <td style={{ ...td, textAlign: "center" }}>
                      <input type="checkbox" checked={!!c.recebido} disabled={!c.entregue || c.recebido}
                        onChange={() => confirmarRecebimento(c)}
                        title={c.recebido ? `Recebido em ${c.recebidoEm}` : c.entregue ? "Confirmar recebimento do item" : "Aguardando o item ser entregue pelo administrador"}
                        style={{ width: 17, height: 17, accentColor: CORES.laranja, cursor: (!c.entregue || c.recebido) ? "not-allowed" : "pointer" }} />
                    </td>
                    <td style={{ ...td, whiteSpace: "nowrap" }}>
                      <Botao tipo="contorno" disabled={c.concluido || c.cancelado} style={{ padding: "4px 10px", fontSize: 12, marginRight: 6 }} onClick={() => setEditando({ ...c })} title={c.concluido ? "Item concluído: bloqueado" : c.cancelado ? "Item cancelado: bloqueado" : "Editar"}>Editar</Botao>
                      <Botao tipo="perigo" disabled={c.concluido || c.cancelado} style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => removerItem(c.id)} title={c.concluido ? "Item concluído: bloqueado" : c.cancelado ? "Item cancelado: bloqueado" : "Remover"}>Remover</Botao>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Cartao>

      {editando && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(45,61,112,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div style={{ background: "#fff", borderRadius: 12, padding: 24, width: "min(560px, 94%)", maxHeight: "88vh", overflowY: "auto" }}>
            <h3 style={{ marginTop: 0, color: CORES.azul }}>Editar item</h3>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Campo label="Cód. Item" obrigatorio><CampoBuscaMaterial campo="codigo" valor={editando.codigo} materiais={dados.materiais} aoMudar={(v) => setEditando({ ...editando, codigo: v })} aoEscolher={(m) => setEditando({ ...editando, codigo: m.codigo, descricao: m.descricao, unidade: editando.unidade || m.unidade })} /></Campo>
              <Campo label="Descrição" obrigatorio><CampoBuscaMaterial campo="descricao" valor={editando.descricao} materiais={dados.materiais} aoMudar={(v) => setEditando({ ...editando, descricao: v })} aoEscolher={(m) => setEditando({ ...editando, codigo: m.codigo, descricao: m.descricao, unidade: editando.unidade || m.unidade })} /></Campo>
              <Campo label="Quantidade"><input style={inputStyle} type="number" value={editando.quantidade} onChange={(e) => setEditando({ ...editando, quantidade: e.target.value })} /></Campo>
              <Campo label="Unidade de Medida"><input style={inputStyle} value={editando.unidade} onChange={(e) => setEditando({ ...editando, unidade: e.target.value })} /></Campo>
              <Campo label="Centro de Custo"><input style={inputStyle} value={editando.centroCusto} onChange={(e) => setEditando({ ...editando, centroCusto: e.target.value })} /></Campo>
              <Campo label="Conta Contábil"><input style={inputStyle} value={editando.contaContabil} onChange={(e) => setEditando({ ...editando, contaContabil: e.target.value })} /></Campo>
              <Campo label="Capex">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input type="checkbox" checked={!!editando.capex} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                    onChange={(e) => setEditando({ ...editando, capex: e.target.checked, nomeCapex: e.target.checked ? editando.nomeCapex : "" })} />
                  <input style={{ ...inputStyle, background: editando.capex ? "#fff" : CORES.cinzaClaro }} disabled={!editando.capex}
                    placeholder={editando.capex ? "Código Capex" : "—"} value={editando.nomeCapex || ""}
                    onChange={(e) => setEditando({ ...editando, nomeCapex: e.target.value })} />
                </div>
              </Campo>
              <Campo label="Fornecedor Específico">
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input type="checkbox" checked={!!editando.fornecedorEspecifico || editando.__fe === true}
                    style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                    onChange={(e) => setEditando({ ...editando, __fe: e.target.checked, fornecedorEspecifico: e.target.checked ? editando.fornecedorEspecifico : "" })} />
                  <input style={{ ...inputStyle, background: (editando.fornecedorEspecifico || editando.__fe) ? "#fff" : CORES.cinzaClaro }}
                    disabled={!(editando.fornecedorEspecifico || editando.__fe)}
                    placeholder="Nome do fornecedor" value={editando.fornecedorEspecifico || ""}
                    onChange={(e) => setEditando({ ...editando, fornecedorEspecifico: e.target.value })} />
                </div>
              </Campo>
              <div style={{ gridColumn: "1 / -1" }}>
                <Campo label="Observações">
                  <textarea style={{ ...inputStyle, minHeight: 56, resize: "vertical", fontFamily: "inherit" }}
                    value={editando.observacoes || ""} onChange={(e) => setEditando({ ...editando, observacoes: e.target.value })} />
                </Campo>
              </div>
            </div>
            <div style={{ marginTop: 18, display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <Botao tipo="contorno" onClick={() => setEditando(null)}>Cancelar</Botao>
              <Botao onClick={salvarEdicao}>Salvar alterações</Botao>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================

const cadastroVazio = () => ({
  descricao: "", unidade: "", link: "", tipo: "", fornecedor: "", partNumber: "", capex: false, nomeCapex: "", anexo: null,
  observacoes: "", fornEsp: false, fornecedorEspecifico: "",
  estoqueMin: "", estoqueMax: "", consumoMensal: "", estoqueDesejado: "", quantidade: "", centroCusto: "", contaContabil: "",
});

function TelaCadastros({ dados, setDados, usuario, notificarSolicitacao }) {
  const [f, setF] = useState(cadastroVazio());
  const [editId, setEditId] = useState(null);
  const [fDesc, setFDesc] = useState("");
  const [fTipo, setFTipo] = useState("Todos");
  const [fStatus, setFStatus] = useState("Todos");

  const parte1Ok = f.descricao.trim() && f.unidade.trim() && f.tipo;
  const set = (campo, v) => setF((x) => ({ ...x, [campo]: v }));

  // Anexo: apenas PDF ou DOC/DOCX
  const anexoRef = useRef(null);
  const [arquivoAnexo, setArquivoAnexo] = useState(null); // File aguardando upload (modo Microsoft)
  const selecionarAnexo = (e) => {
    const arq = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!arq) return;
    const ext = arq.name.toLowerCase().split(".").pop();
    if (!["pdf", "doc", "docx"].includes(ext)) { avisar("Apenas arquivos PDF ou DOC/DOCX são aceitos como anexo."); return; }
    const limiteMB = AUTENTICACAO_REAL ? 4 : 2;
    if (arq.size > limiteMB * 1024 * 1024) { avisar(`O anexo deve ter no máximo ${limiteMB} MB${AUTENTICACAO_REAL ? "" : " no modo demonstração"}.`); return; }
    if (AUTENTICACAO_REAL) {
      setArquivoAnexo(arq);
      set("anexo", { nome: arq.name, pendente: true });
    } else {
      const leitor = new FileReader();
      leitor.onload = () => set("anexo", { nome: arq.name, dataUrl: leitor.result });
      leitor.onerror = () => avisar("Não foi possível ler o arquivo do anexo.");
      leitor.readAsDataURL(arq);
    }
  };
  const removerAnexo = () => { setArquivoAnexo(null); set("anexo", null); };

  const enviar = async () => {
    if (!parte1Ok) { avisar("Preencha a Parte 1 (Descrição, Unidade e Tipo de Cadastro)."); return; }
    if (f.tipo === "Estoque" && (!f.estoqueMin || !f.estoqueMax || !f.consumoMensal)) { avisar("Preencha Estoque Mínimo, Máximo e Consumo mensal."); return; }
    if (f.tipo === "Estoque Sazonal" && (!f.estoqueDesejado || !f.consumoMensal)) { avisar("Preencha Estoque Desejado e Consumo mensal."); return; }
    if (f.tipo === "Débito Direto" && (!f.quantidade || !f.centroCusto || !f.contaContabil)) { avisar("Preencha Quantidade, Centro de Custo e Conta Contábil."); return; }
    if (f.capex && !f.nomeCapex.trim()) { avisar("Cadastro marcado como Capex precisa do Código Capex preenchido."); return; }
    if ((f.tipo === "Débito Direto" || f.tipo === "Estoque Sazonal") && f.fornEsp && !f.fornecedorEspecifico.trim()) { avisar("Você marcou Fornecedor Específico: informe o nome do fornecedor."); return; }

    // Anexo pendente (modo Microsoft): envia ao SharePoint antes de gravar
    let anexoFinal = f.anexo || null;
    if (AUTENTICACAO_REAL && arquivoAnexo) {
      try { anexoFinal = await enviarAnexoSharePoint(arquivoAnexo); }
      catch (e) { avisar("Falha ao enviar o anexo ao SharePoint. Verifique a conexão e tente novamente."); return; }
    }
    const fEfetivo = f.tipo === "Estoque" ? { ...f, fornEsp: false, fornecedorEspecifico: "" } : f;
    let nd, resumo = "", dataHora = agoraStr();
    if (editId) {
      nd = { ...dados, cadastros: dados.cadastros.map((c) => (c.id === editId ? { ...c, ...fEfetivo, anexo: anexoFinal } : c)) };
    } else {
      const novo = { id: uid(), solicitante: usuario.nome, email: usuario.email, dataHora, ...fEfetivo, anexo: anexoFinal, concluido: false };
      resumo = `• ${novo.descricao} — ${novo.unidade} | Tipo: ${novo.tipo}${novo.fornecedor ? ` | Fornecedor: ${novo.fornecedor}` : ""}${novo.fornecedorEspecifico ? ` | Fornecedor específico: ${novo.fornecedorEspecifico}` : ""}${novo.capex ? ` | Capex ${novo.nomeCapex}` : ""}${novo.observacoes ? ` | Obs: ${novo.observacoes}` : ""}`;
      nd = { ...dados, cadastros: [...dados.cadastros, novo] };
    }
    nd = comLog(nd, usuario, "Cadastro", editId ? "Editou solicitação de cadastro" : "Criou solicitação de cadastro", `${fEfetivo.descricao || ""} — ${fEfetivo.unidade || ""} | Tipo: ${fEfetivo.tipo || ""}`, editId || (nd.cadastros[nd.cadastros.length - 1] || {}).id);
    setDados(nd); await salvarDados(nd);
    setF(cadastroVazio()); setArquivoAnexo(null); const eraEdicao = !!editId; setEditId(null);
    if (!eraEdicao) {
      const c = nd.cadastros[nd.cadastros.length - 1];
      const tabela = {
        cabecalhos: ["Solicitante", "Descrição do Item", "UM", "Tipo de Cadastro", "Fornecedor", "Part Number", "Capex", "Forn. Específico", "Anexo", "Obs."],
        linhas: [[c.solicitante, c.descricao, c.unidade, c.tipo, c.fornecedor, c.partNumber, c.capex ? (c.nomeCapex || "Sim") : "—", c.fornecedorEspecifico || "—", c.anexo ? c.anexo.nome : "—", c.observacoes || "—"]],
      };
      notificarSolicitacao("Cadastro", usuario, nd, resumo, dataHora, tabela);
    }
  };

  const editar = (c) => { setEditId(c.id); setF({ ...cadastroVazio(), ...c }); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const remover = async (id) => {
    const alvo = dados.cadastros.find((c) => c.id === id);
    if (alvo && (alvo.concluido || alvo.cancelado)) { avisar("Item concluído ou cancelado não pode ser modificado."); return; }
    avisar("Solicitação de cadastro removida.");
    let nd = { ...dados, cadastros: dados.cadastros.filter((c) => c.id !== id) };
    nd = comLog(nd, usuario, "Cadastro", "Removeu solicitação de cadastro", alvo ? `${alvo.descricao || ""} (${alvo.tipo || ""})` : "", id);
    setDados(nd); await salvarDados(nd);
  };

  const exportarExcel = () => {
    const wb = XLSX.utils.book_new();
    const tipos = ["Estoque", "Estoque Sazonal", "Débito Direto"];
    tipos.forEach((t) => {
      const regs = dados.cadastros.filter((c) => c.tipo === t);
      let linhas;
      if (t === "Estoque") linhas = regs.map((c) => ({ "Solicitante": c.solicitante, "Data/Hora": c.dataHora, "Descrição": c.descricao, "Unidade": c.unidade, "Link Ref.": c.link, "Fornecedor": c.fornecedor, "Part Number": c.partNumber, "Capex": c.capex ? (c.nomeCapex || "Sim") : "Não", "Anexo": c.anexo ? c.anexo.nome : "", "Observações": c.observacoes || "", "Estoque Mínimo": c.estoqueMin, "Estoque Máximo": c.estoqueMax, "Consumo Mensal": c.consumoMensal, "Concluído": c.concluido ? "Sim" : "Não" }));
      else if (t === "Estoque Sazonal") linhas = regs.map((c) => ({ "Solicitante": c.solicitante, "Data/Hora": c.dataHora, "Descrição": c.descricao, "Unidade": c.unidade, "Link Ref.": c.link, "Fornecedor": c.fornecedor, "Part Number": c.partNumber, "Capex": c.capex ? (c.nomeCapex || "Sim") : "Não", "Anexo": c.anexo ? c.anexo.nome : "", "Fornecedor Específico": c.fornecedorEspecifico || "", "Observações": c.observacoes || "", "Estoque Desejado": c.estoqueDesejado, "Consumo Mensal": c.consumoMensal, "Concluído": c.concluido ? "Sim" : "Não" }));
      else linhas = regs.map((c) => ({ "Solicitante": c.solicitante, "Data/Hora": c.dataHora, "Descrição": c.descricao, "Unidade": c.unidade, "Link Ref.": c.link, "Fornecedor": c.fornecedor, "Part Number": c.partNumber, "Capex": c.capex ? (c.nomeCapex || "Sim") : "Não", "Anexo": c.anexo ? c.anexo.nome : "", "Fornecedor Específico": c.fornecedorEspecifico || "", "Observações": c.observacoes || "", "Quantidade": c.quantidade, "Centro de Custo": c.centroCusto, "Conta Contábil": c.contaContabil, "Concluído": c.concluido ? "Sim" : "Não" }));
      const ws = XLSX.utils.json_to_sheet(linhas.length ? linhas : [{}]);
      XLSX.utils.book_append_sheet(wb, ws, t.replace("é", "e"));
    });
    XLSX.writeFile(wb, "Solicitacoes_de_Cadastro.xlsx");
  };

  const minhas = dados.cadastros.filter((c) =>
    c.email === usuario.email &&
    semAcento(c.descricao).includes(semAcento(fDesc)) &&
    (fTipo === "Todos" || c.tipo === fTipo) &&
    (fStatus === "Todos" || statusDe(c) === fStatus)
  );
  const th = { padding: "8px", fontSize: 11.5, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left", whiteSpace: "nowrap" };
  const td = { padding: 6, borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 13.5, color: CORES.azul };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <Cartao style={{ position: "relative" }}>
        <h2 style={{ margin: "0 0 2px", color: CORES.azul }}>{editId ? "Editar Cadastro" : "Solicitação de Cadastros"}</h2>
        <p style={{ margin: "0 0 16px", fontSize: 13, color: CORES.cinza }}>Campos marcados com <span style={{ color: CORES.laranja }}>•</span> são obrigatórios. A Parte 2 é liberada conforme o Tipo de Cadastro.</p>

        <div style={{ borderLeft: `3px solid ${CORES.laranja}`, paddingLeft: 14, marginBottom: 8 }}>
          <strong style={{ color: CORES.azul, fontSize: 13, textTransform: "uppercase", letterSpacing: ".05em" }}>Parte 1 — Dados do item</strong>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 14 }}>
          <Campo label="Solicitante"><input style={{ ...inputStyle, background: CORES.cinzaClaro, color: CORES.cinza }} value={usuario.nome} disabled /></Campo>
          <Campo label="Descrição do Item" obrigatorio><input style={inputStyle} value={f.descricao} onChange={(e) => set("descricao", e.target.value)} /></Campo>
          <Campo label="Unidade de Medida" obrigatorio><input style={inputStyle} value={f.unidade} onChange={(e) => set("unidade", e.target.value)} /></Campo>
          <Campo label="Link de Referência"><input style={inputStyle} value={f.link} onChange={(e) => set("link", e.target.value)} placeholder="https://…" /></Campo>
          <Campo label="Tipo de Cadastro" obrigatorio>
            <select style={inputStyle} value={f.tipo} onChange={(e) => set("tipo", e.target.value)}>
              <option value="">Selecione…</option>
              <option>Estoque</option>
              <option>Débito Direto</option>
              <option>Estoque Sazonal</option>
            </select>
          </Campo>
          <Campo label="Fornecedor"><input style={inputStyle} value={f.fornecedor} onChange={(e) => set("fornecedor", e.target.value)} /></Campo>
          <Campo label="Part Number / Cód. Fornecedor"><input style={inputStyle} value={f.partNumber} onChange={(e) => set("partNumber", e.target.value)} /></Campo>
          <Campo label="Capex">
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input type="checkbox" checked={!!f.capex} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                onChange={(e) => setF((x) => ({ ...x, capex: e.target.checked, nomeCapex: e.target.checked ? x.nomeCapex : "" }))} />
              <input style={{ ...inputStyle, background: f.capex ? "#fff" : CORES.cinzaClaro }} disabled={!f.capex}
                placeholder={f.capex ? "Código Capex" : "—"} value={f.nomeCapex} onChange={(e) => set("nomeCapex", e.target.value)} />
            </div>
          </Campo>
          <Campo label="Anexo (PDF ou DOC)">
            <div style={{ display: "flex", alignItems: "center", gap: 8, minHeight: 37 }}>
              <input ref={anexoRef} type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }} onChange={selecionarAnexo} />
              <Botao tipo="contorno" style={{ padding: "7px 12px", fontSize: 13 }} onClick={() => anexoRef.current && anexoRef.current.click()}>
                📎 {f.anexo ? "Trocar" : "Anexar"}
              </Botao>
              {f.anexo && (
                <span style={{ fontSize: 12.5, color: CORES.azul, maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={f.anexo.nome}>
                  {f.anexo.nome}
                </span>
              )}
              {f.anexo && (
                <button onClick={removerAnexo} title="Remover anexo"
                  style={{ border: "none", background: "none", color: CORES.laranja, cursor: "pointer", fontSize: 15, fontWeight: 700 }}>✕</button>
              )}
            </div>
          </Campo>
        </div>

        <div style={{ marginTop: 24, borderLeft: `3px solid ${parte1Ok ? CORES.laranja : CORES.cinza}`, paddingLeft: 14, marginBottom: 8, opacity: parte1Ok ? 1 : 0.5 }}>
          <strong style={{ color: CORES.azul, fontSize: 13, textTransform: "uppercase", letterSpacing: ".05em" }}>
            Parte 2 — Parâmetros do tipo {f.tipo ? `“${f.tipo}”` : ""}
          </strong>
          {!parte1Ok && <div style={{ fontSize: 12, color: CORES.cinza }}>Preencha a Parte 1 para liberar esta seção.</div>}
        </div>

        {parte1Ok && f.tipo === "Estoque" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
            <Campo label="Estoque Mínimo" obrigatorio legenda="Considerar 30 dias de Lead Time"><input style={inputStyle} type="number" value={f.estoqueMin} onChange={(e) => set("estoqueMin", e.target.value)} /></Campo>
            <Campo label="Estoque Máximo" obrigatorio><input style={inputStyle} type="number" value={f.estoqueMax} onChange={(e) => set("estoqueMax", e.target.value)} /></Campo>
            <Campo label="Consumo Mensal" obrigatorio><input style={inputStyle} type="number" value={f.consumoMensal} onChange={(e) => set("consumoMensal", e.target.value)} /></Campo>
          </div>
        )}
        {parte1Ok && f.tipo === "Estoque Sazonal" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
            <Campo label="Estoque Desejado" obrigatorio><input style={inputStyle} type="number" value={f.estoqueDesejado} onChange={(e) => set("estoqueDesejado", e.target.value)} /></Campo>
            <Campo label="Consumo Mensal" obrigatorio><input style={inputStyle} type="number" value={f.consumoMensal} onChange={(e) => set("consumoMensal", e.target.value)} /></Campo>
            <Campo label="Fornecedor Específico">
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="checkbox" checked={!!f.fornEsp} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                  onChange={(e) => setF((x) => ({ ...x, fornEsp: e.target.checked, fornecedorEspecifico: e.target.checked ? x.fornecedorEspecifico : "" }))} />
                <input style={{ ...inputStyle, background: f.fornEsp ? "#fff" : CORES.cinzaClaro }} disabled={!f.fornEsp}
                  placeholder={f.fornEsp ? "Nome do fornecedor exigido" : "Marque para informar"}
                  value={f.fornecedorEspecifico} onChange={(e) => set("fornecedorEspecifico", e.target.value)} />
              </div>
            </Campo>
          </div>
        )}
        {parte1Ok && f.tipo === "Débito Direto" && (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 14 }}>
            <Campo label="Quantidade" obrigatorio><input style={inputStyle} type="number" value={f.quantidade} onChange={(e) => set("quantidade", e.target.value)} /></Campo>
            <Campo label="Centro de Custo" obrigatorio><input style={inputStyle} value={f.centroCusto} onChange={(e) => set("centroCusto", e.target.value)} /></Campo>
            <Campo label="Conta Contábil" obrigatorio><input style={inputStyle} value={f.contaContabil} onChange={(e) => set("contaContabil", e.target.value)} /></Campo>
            <Campo label="Fornecedor Específico">
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="checkbox" checked={!!f.fornEsp} style={{ width: 17, height: 17, accentColor: CORES.laranja }}
                  onChange={(e) => setF((x) => ({ ...x, fornEsp: e.target.checked, fornecedorEspecifico: e.target.checked ? x.fornecedorEspecifico : "" }))} />
                <input style={{ ...inputStyle, background: f.fornEsp ? "#fff" : CORES.cinzaClaro }} disabled={!f.fornEsp}
                  placeholder={f.fornEsp ? "Nome do fornecedor exigido" : "Marque para informar"}
                  value={f.fornecedorEspecifico} onChange={(e) => set("fornecedorEspecifico", e.target.value)} />
              </div>
            </Campo>
          </div>
