// Persistencia fora do Claude: armazenamento do navegador quando disponivel, memoria como fallback.
if (!window.storage) {
  const mem = {};
  const lsOk = (function(){ try { const t="__t__"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); return true; } catch(e){ return false; } })();
  const ler = (k) => { try { if (lsOk) { const v = window.localStorage.getItem("aura__"+k); return v === null ? undefined : v; } } catch(e){} return mem[k]; };
  const gravar = (k,v) => { try { if (lsOk) { window.localStorage.setItem("aura__"+k, v); return; } } catch(e){} mem[k]=v; };
  const apagar = (k) => { try { if (lsOk) { window.localStorage.removeItem("aura__"+k); } } catch(e){} delete mem[k]; };
  window.storage = {
    async get(k){ const v = ler(k); if (v === undefined) throw new Error("chave inexistente"); return {key:k, value:v}; },
    async set(k,v){ gravar(k,v); return {key:k}; },
    async delete(k){ apagar(k); return {key:k, deleted:true}; },
    async list(){ return {keys:[]}; }
  };
}

/* ---------------- Senhas: armazenamento apenas como hash (PBKDF2-SHA256 + salt) ----------------
   A senha digitada nunca é gravada: guarda-se somente um hash irreversível com salt individual.  */
const _webCryptoOk = () => (typeof crypto !== "undefined" && crypto.subtle && crypto.getRandomValues);

const gerarSalt = () => {
  try {
    if (_webCryptoOk()) return Array.from(crypto.getRandomValues(new Uint8Array(16))).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { /* segue para o fallback */ }
  // Fallback (contexto não seguro / file://): salt pseudoaleatório — MODO DEMONSTRAÇÃO apenas
  let s = "";
  for (let i = 0; i < 16; i++) s += Math.floor(Math.random() * 256).toString(16).padStart(2, "0");
  return s;
};

// Hash determinístico de fallback (sem Web Crypto). Não é forte — usado só no modo demonstração
// quando o navegador não expõe crypto.subtle (ex.: app aberto como arquivo local file://).
function _hashFallback(senha, salt) {
  const s = String(salt) + "::" + String(senha);
  let h1 = 0x811c9dc5, h2 = 0xc2b2ae35;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
  }
  let out = "";
  for (let k = 0; k < 8; k++) {
    h1 = Math.imul(h1 ^ (h1 >>> 15), 0x2c1b3c6d) >>> 0;
    h2 = Math.imul(h2 ^ (h2 >>> 13), 0x297a2d39) >>> 0;
    out += ((h1 ^ h2) >>> 0).toString(16).padStart(8, "0");
  }
  return out;
}

// Método de hash disponível neste contexto ("pbkdf2" com Web Crypto; senão "fb")
const metodoHash = () => (_webCryptoOk() ? "pbkdf2" : "fb");

// Calcula o hash conforme o método (permite verificar senha gravada em qualquer contexto)
async function hashSenha(senha, salt, metodo) {
  const m = metodo || metodoHash();
  if (m === "pbkdf2" && _webCryptoOk()) {
    const enc = new TextEncoder();
    const chave = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: enc.encode(salt), iterations: 100000 }, chave, 256
    );
    return Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  return _hashFallback(senha, salt);
}
// Sempre há um método de hash (Web Crypto ou fallback do modo demonstração)
const criptoDisponivel = () => true;

/* ============================================================
   Catálogo de Grupos e Subsistemas — topologia do AURA 360° Planta
   (estrutura fixa do produto; não é editável pelo usuário final)
   Perfis: "GM" (administrador geral, acesso total) | "Administrador" (futuro,
   administrador de um Subsistema específico) | "Usuário Comum".
   ============================================================ */
const CATALOGO_GRUPOS = [
  {
    id: "ADMIN", nome: "Administrativo",
    subsistemas: [
      {
        id: "COMPRAS", nome: "Compras e Cadastros", externo: false,
        // Relatórios não entra aqui: passou a ser admin-only (só GM/administrador do Subsistema),
        // não é mais uma tela que se libera/bloqueia por usuário comum.
        features: [
          { id: "TELA_COMPRAS", nome: "Solicitação de Compras" },
          { id: "TELA_CADASTROS", nome: "Solicitação de Cadastros" },
        ],
      },
    ],
  },
  {
    id: "SEG", nome: "Segurança",
    subsistemas: [
      // Nativo do AURA 360° (portado do antigo app separado aura-pops em 2026-08-24 — deixou de
      // depender de um servidor externo, que ficava fora do ar entre sessões).
      // Telas internas (Procedimentos/SSMA/Lista Mestra/Configurações) não usam o checklist
      // genérico de features — visibilidade e nível de ação vêm do Papel (ver PAPEL_POPS_*).
      { id: "POPS", nome: "Gestão de Procedimentos", externo: false, features: [] },
    ],
  },
  { id: "OPER", nome: "Operação", subsistemas: [] },
];

// Permissões padrão: preserva o acesso que já existia (Compra sempre liberado);
// subsistemas novos (ainda não integrados de fato) começam desligados por padrão.
// adminDe: de quais Subsistemas (dentre os que o usuário já acessa) ele é administrador delegado
// — só tem efeito quando o perfil é "Administrador Subsistema"; começa tudo desligado por padrão.
const permissoesDefault = () => ({
  grupos: { ADMIN: false, SEG: false, OPER: false },
  subsistemas: { COMPRAS: false, POPS: false },
  features: { TELA_COMPRAS: false, TELA_CADASTROS: false },
  adminDe: { COMPRAS: false },
  // Papéis dentro de Gestão de Procedimentos — multiescolha: um usuário pode acumular vários ao
  // mesmo tempo (ex.: Administrador + Auditor + Avaliador). Nenhum marcado = sem acesso ao
  // Subsistema. Cada tela usa o nível mais alto entre os papéis marcados (ver funções
  // PAPEL_POPS_... e capacidadePops); GM sempre tem acesso total, sem precisar marcar nada.
  papeisPops: { administrador: false, auditor: false, avaliador: false, ssma: false, leitor: false },
});

// Estado agregado (vazio | parcial | completo) de um Subsistema/Grupo no checklist de permissões —
// "completo" só quando ele e tudo abaixo dele estão liberados; "parcial" quando só uma parte está.
// Usado pelo checkbox de 3 estados (vazio/"/" parcial/"✓" completo) em Configurações → Usuários.
const estadoSubsistema = (perm, s) => {
  if (!s || !perm.subsistemas[s.id]) return "vazio";
  if (!s.features || s.features.length === 0) return "completo";
  return s.features.every((f) => perm.features[f.id] === true) ? "completo" : "parcial";
};
const estadoGrupo = (perm, g) => {
  if (!g || !perm.grupos[g.id]) return "vazio";
  if (!g.subsistemas || g.subsistemas.length === 0) return "completo";
  return g.subsistemas.every((s) => estadoSubsistema(perm, s) === "completo") ? "completo" : "parcial";
};

const EH_GM = (u) => !!u && u.perfil === "GM";
const EH_ADMIN_SUBSISTEMA = (u) => !!u && u.perfil === "Administrador Subsistema";

// Papéis dentro de Gestão de Procedimentos (Administrador/Auditor/Avaliador/SSMA/Leitor) — um
// usuário pode ter vários ao mesmo tempo (ex.: Administrador e Auditor e Avaliador juntos). Cada
// papel tem visibilidade/ação fixas por tela (matriz definida pelo negócio); a tela usa o nível
// mais alto entre os papéis que o usuário tem.
// GM tem acesso total (bypass) só enquanto NINGUÉM tiver o papel Administrador no Subsistema —
// é um acesso de "bootstrap" para configurar o Subsistema do zero. No momento em que o primeiro
// Administrador é cadastrado, o GM passa a ser tratado como Leitor aqui dentro (continua GM em
// todo o resto do AURA 360°, e sempre pode entrar em Configurações para ajustar papéis).
const papeisPopsDe = (u) => (u && u.permissoes && u.permissoes.papeisPops) || {};
const existeAdministradorPops = (dados) => Object.values((dados && dados.usuarios) || {}).some((u) => u.permissoes && u.permissoes.papeisPops && u.permissoes.papeisPops.administrador);
const temPapelPops = (u, papel, dados) => (EH_GM(u) ? !existeAdministradorPops(dados) : !!papeisPopsDe(u)[papel]);
const PAPEL_POPS_OPCOES = [
  { id: "administrador", nome: "Administrador" },
  { id: "auditor", nome: "Auditor" },
  { id: "avaliador", nome: "Avaliador" },
  { id: "ssma", nome: "SSMA" },
  { id: "leitor", nome: "Leitor" },
];
// "oculto" = tela não aparece · "ver" = aparece, somente leitura · "editar" = aparece com ações completas
const PAPEL_POPS_PROCEDIMENTOS = { administrador: "editar", auditor: "editar", avaliador: "ver", ssma: "ver", leitor: "ver" };
const PAPEL_POPS_SSMA = { administrador: "oculto", auditor: "oculto", avaliador: "oculto", ssma: "editar", leitor: "oculto" };
const PAPEL_POPS_LISTA_MESTRA = { administrador: "editar", auditor: "ver", avaliador: "ver", ssma: "ver", leitor: "ver" };
const NIVEL_POPS = { oculto: 0, ver: 1, editar: 2 };
const capacidadePops = (u, mapa, dados) => {
  if (EH_GM(u)) return existeAdministradorPops(dados) ? (mapa.leitor || "oculto") : "editar";
  const papeis = papeisPopsDe(u);
  let melhor = "oculto";
  for (const p of Object.keys(mapa)) {
    if (papeis[p] && NIVEL_POPS[mapa[p]] > NIVEL_POPS[melhor]) melhor = mapa[p];
  }
  return melhor;
};

// Checklist com cascata: marcar uma tela (feature) libera automaticamente o Subsistema e o Grupo
// dela (senão a tela liberada fica inacessível, escondida atrás de um Grupo/Subsistema bloqueado).
// Marcar o Subsistema ou o Grupo direto libera o acesso a ele, mas NÃO liga as telas/funcionalidades
// abaixo — ganhar acesso a um Subsistema equivale a um "Leitor" (só vê o Painel dele) até que
// alguma tela específica seja marcada à parte. Desmarcar o Subsistema/Grupo direto (já "completo"
// ou "parcial") bloqueia tudo abaixo, incluindo as telas que estivessem marcadas. "adminDe" não tem
// cascata — é independente da árvore de acesso (os Papéis de Gestão de Procedimentos têm sua
// própria função, alternarPapelPops, também sem cascata).
// Função de módulo (não presa a um componente) para poder ser reusada tanto em Configurações
// quanto na aba "Configurações" de dentro de cada Subsistema (ex.: Gestão de Procedimentos).
async function alternarPermissaoUsuario(dados, setDados, usuarioLogado, email, categoria, id) {
  const u = dados.usuarios[email];
  const atuais = u.permissoes || permissoesDefault();

  if (categoria === "adminDe") {
    const adminDeAtual = atuais.adminDe || permissoesDefault().adminDe;
    const novoValor = !adminDeAtual[id];
    const permissoes = { ...atuais, adminDe: { ...adminDeAtual, [id]: novoValor } };
    let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...u, permissoes } } };
    nd = comLog(nd, usuarioLogado, "Usuários", `Alterou administração do subsistema (${id}) para "${novoValor ? "Concedida" : "Removida"}"`, email, email);
    setDados(nd); await salvarDados(nd);
    return;
  }

  const grupos = { ...atuais.grupos };
  const subsistemas = { ...atuais.subsistemas };
  const features = { ...atuais.features };
  const adminDe = { ...(atuais.adminDe || permissoesDefault().adminDe) };
  let novoValor;

  if (categoria === "features") {
    novoValor = !features[id];
    features[id] = novoValor;
    if (novoValor) {
      const g = CATALOGO_GRUPOS.find((gr) => gr.subsistemas.some((s) => s.features.some((f) => f.id === id)));
      const s = g && g.subsistemas.find((s) => s.features.some((f) => f.id === id));
      if (s) subsistemas[s.id] = true;
      if (g) grupos[g.id] = true;
    }
  } else if (categoria === "subsistemas") {
    const g = CATALOGO_GRUPOS.find((gr) => gr.subsistemas.some((s) => s.id === id));
    const s = g && g.subsistemas.find((sub) => sub.id === id);
    novoValor = !subsistemas[id];
    subsistemas[id] = novoValor;
    // Ganhar acesso ao Subsistema não liga as telas dele (fica "Leitor" — só o Painel); perder o
    // acesso desliga tudo abaixo, para não deixar telas marcadas "penduradas" sem Subsistema — e
    // também não deixa a pessoa como Administrador de um Subsistema que ela não acessa mais.
    if (!novoValor && s) { s.features.forEach((f) => { features[f.id] = false; }); adminDe[id] = false; }
    if (novoValor && g) grupos[g.id] = true;
  } else if (categoria === "grupos") {
    const g = CATALOGO_GRUPOS.find((gr) => gr.id === id);
    novoValor = !grupos[id];
    grupos[id] = novoValor;
    if (g) g.subsistemas.forEach((s) => {
      subsistemas[s.id] = novoValor;
      if (!novoValor) { s.features.forEach((f) => { features[f.id] = false; }); adminDe[s.id] = false; }
    });
  }

  const permissoes = { ...atuais, grupos, subsistemas, features, adminDe };
  let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...u, permissoes } } };
  nd = comLog(nd, usuarioLogado, "Usuários", `Alterou permissão (${categoria}/${id}) para "${novoValor ? "Liberado" : "Bloqueado"}"`, email, email);
  setDados(nd); await salvarDados(nd);
}

// Desativa/reativa o acesso de um usuário sem excluir seu histórico (diferente de "Remover", que
// continua só do GM). Usuário desativado não consegue logar (ver tentarLoginDemo/entrar).
async function alternarAtivoUsuario(dados, setDados, usuarioLogado, email) {
  if (email === usuarioLogado.email) { avisar("Você não pode desativar o próprio usuário logado."); return; }
  const u = dados.usuarios[email];
  const novoValor = u.ativo === false; // estava desativado → reativa; senão, desativa
  if (u.perfil === "GM" && !novoValor) {
    const admins = Object.entries(dados.usuarios).filter(([, x]) => x.perfil === "GM" && x.ativo !== false);
    if (admins.length === 1) { avisar("Não é possível desativar o último administrador do sistema."); return; }
  }
  let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...u, ativo: novoValor } } };
  nd = comLog(nd, usuarioLogado, "Usuários", novoValor ? "Reativou usuário" : "Desativou usuário", email, email);
  setDados(nd); await salvarDados(nd);
}

// Liga/desliga um Papel do usuário em Gestão de Procedimentos — multiescolha, pode acumular
// vários papéis ao mesmo tempo. Mantém permissoes.subsistemas.POPS espelhado (true sempre que
// há pelo menos um papel marcado) só para o mecanismo genérico de Home/segundo menu continuar
// funcionando sem precisar de um caso especial.
async function alternarPapelPops(dados, setDados, usuarioLogado, email, papelId) {
  const u = dados.usuarios[email];
  const atuais = u.permissoes || permissoesDefault();
  const papeisAtual = atuais.papeisPops || permissoesDefault().papeisPops;
  const novoValor = !papeisAtual[papelId];
  const papeisPops = { ...papeisAtual, [papelId]: novoValor };
  const algumPapel = Object.values(papeisPops).some(Boolean);
  const subsistemas = { ...atuais.subsistemas, POPS: algumPapel };
  const grupos = algumPapel ? { ...atuais.grupos, SEG: true } : atuais.grupos;
  const permissoes = { ...atuais, papeisPops, subsistemas, grupos };
  const nomePapel = (PAPEL_POPS_OPCOES.find((p) => p.id === papelId) || {}).nome || papelId;
  let nd = { ...dados, usuarios: { ...dados.usuarios, [email]: { ...u, permissoes } } };
  nd = comLog(nd, usuarioLogado, "Usuários", `Alterou papel em Gestão de Procedimentos (${nomePapel}) para "${novoValor ? "Concedido" : "Removido"}"`, email, email);
  setDados(nd); await salvarDados(nd);
}
// Subsistemas que este usuário administra por delegação do GM (lista de ids); vazio para
// qualquer perfil que não seja "Administrador Subsistema" — GM não precisa disso, já tem acesso total.
const subsistemasAdministradosPor = (u) => {
  if (!EH_ADMIN_SUBSISTEMA(u)) return [];
  const adminDe = (u.permissoes && u.permissoes.adminDe) || {};
  return Object.keys(adminDe).filter((id) => adminDe[id] === true);
};
// Categorias da trilha de auditoria (SOX) pertencentes a cada Subsistema nativo — usado para
// restringir o que um administrador de Subsistema vê em Registros (essa visão fica dentro do
// próprio Subsistema, ex.: Administrativo → Compras e Cadastros → Registros).
const CATEGORIAS_POR_SUBSISTEMA = { COMPRAS: ["Compra", "Cadastro", "Movimentação", "Materiais"], POPS: ["Procedimentos"] };
// Categorias de plataforma (todo o AURA 360° Planta, não de um Subsistema específico): login/acesso
// e gestão de usuários. É só isso que aparece em Configurações → Registros (visão do GM) — a
// auditoria de um Subsistema só aparece se a pessoa abrir aquele Subsistema.
const CATEGORIAS_PLATAFORMA = ["Usuários", "Acesso"];

// Migração idempotente: perfil antigo "Administrador" → "GM"; garante permissoes (com adminDe e
// ativo) em usuários de versões anteriores, sem apagar nada que já exista.
function migrarUsuarios(usuarios) {
  const out = {};
  for (const [email, u] of Object.entries(usuarios || {})) {
    const perfil = u.perfil === "Administrador" ? "GM" : u.perfil;
    const permissoes = { ...permissoesDefault(), ...(u.permissoes || {}) };
    if (!permissoes.adminDe) permissoes.adminDe = permissoesDefault().adminDe;
    // Migra formatos antigos de acesso a Gestão de Procedimentos para o modelo atual de Papéis
    // multiescolha (um usuário pode acumular vários, ex.: Administrador + Auditor + Avaliador) —
    // melhor esforço, preservando tudo que já estava marcado nas versões anteriores:
    //   • duas versões atrás: papeisPops = {auditor, avaliador, ssma} (só 3, sem multiescolha real)
    //   • versão anterior: papelPops = string única (Administrador OU Auditor OU ...)
    const jaNoFormatoAtual = u.permissoes && u.permissoes.papeisPops
      && Object.prototype.hasOwnProperty.call(u.permissoes.papeisPops, "administrador");
    if (!jaNoFormatoAtual) {
      const antigoTrio = u.permissoes && u.permissoes.papeisPops;
      const antigoPapelUnico = u.permissoes && u.permissoes.papelPops;
      const eraAdminPops = !!(u.permissoes && u.permissoes.adminDe && u.permissoes.adminDe.POPS);
      const tinhaAlgumPapelAntigo = !!antigoPapelUnico || eraAdminPops
        || !!(antigoTrio && (antigoTrio.auditor || antigoTrio.avaliador || antigoTrio.ssma));
      const soAcessoSemPapel = !tinhaAlgumPapelAntigo
        && !!(u.permissoes && u.permissoes.subsistemas && u.permissoes.subsistemas.POPS);
      permissoes.papeisPops = {
        administrador: antigoPapelUnico === "administrador" || eraAdminPops,
        auditor: antigoPapelUnico === "auditor" || !!(antigoTrio && antigoTrio.auditor),
        avaliador: antigoPapelUnico === "avaliador" || !!(antigoTrio && antigoTrio.avaliador),
        ssma: antigoPapelUnico === "ssma" || !!(antigoTrio && antigoTrio.ssma),
        leitor: antigoPapelUnico === "leitor" || soAcessoSemPapel,
      };
    }
    delete permissoes.papelPops;
    if (permissoes.adminDe) delete permissoes.adminDe.POPS;
    permissoes.subsistemas = { ...permissoes.subsistemas, POPS: Object.values(permissoes.papeisPops).some(Boolean) };
    // Migração única (v1.9.0): telas deixam de vir marcadas por padrão — ganhar acesso a um
    // Subsistema passa a equivaler a "Leitor" (só o Painel) até alguma tela ser marcada à parte.
    // Usuários comuns que já tinham telas liberadas são zerados aqui uma única vez (o acesso ao(s)
    // Subsistema(s) em si é preservado — só as telas dentro dele voltam a "Leitor"); rodar de novo
    // não teria efeito, então marcamos a migração como aplicada para não repetir a cada carga.
    if (perfil !== "GM" && !permissoes._leitorPorPadraoV1) {
      permissoes.features = Object.keys(permissoes.features).reduce((acc, k) => ({ ...acc, [k]: false }), {});
      permissoes._leitorPorPadraoV1 = true;
    }
    out[email] = { ativo: true, ...u, perfil, permissoes };
  }
  return out;
}

const dadosVazios = () => ({
  usuarios: { [PRIMEIRO_ADMIN]: { nome: nomeDoEmail(PRIMEIRO_ADMIN), perfil: "GM" } },
  compras: [],
  cadastros: [],
  materiais: MATERIAIS_INICIAIS,

  auditoria: [], // trilha de auditoria (SOX): registros imutáveis, append-only
  pops: POPS_INICIAIS,
  popsAreas: AREAS_POPS_INICIAIS,
  popsConfig: POPS_CONFIG_INICIAL,
});

/* ---------------- Trilha de auditoria (SOX) ----------------
   Registro imutável de TODAS as movimentações (quem, o quê, quando).
   Os registros são apenas ANEXADOS (nunca editados/removidos pela aplicação).
   Categorias: Compra | Cadastro | Movimentação | Materiais | Usuários | Acesso  */
const LOG_CATEGORIAS = ["Compra", "Cadastro", "Movimentação", "Materiais", "Procedimentos", "Usuários", "Acesso"];
function novoLog(usuario, categoria, acao, detalhe, refId) {
  const agora = new Date();
  return {
    id: uid(),
    ts: agora.toISOString(),                       // carimbo imutável e ordenável (UTC)
    quando: agora.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }),
    usuarioEmail: usuario && usuario.email ? usuario.email : "(sistema)",
    usuarioNome: usuario && usuario.nome ? usuario.nome : "Sistema",
    perfil: usuario && usuario.perfil ? usuario.perfil : "—",
    categoria: categoria || "Movimentação",
    acao: acao || "",
    detalhe: detalhe || "",
    refId: refId ? String(refId) : "",             // id da entidade relacionada (solicitação/usuário)
  };
}
// Retorna uma nova cópia de `d` com um registro de auditoria anexado (append-only).
function comLog(d, usuario, categoria, acao, detalhe, refId) {
  return { ...d, auditoria: [...(d.auditoria || []), novoLog(usuario, categoria, acao, detalhe, refId)] };
}

/* ---------------- Persistência (window.storage) ---------------- */
async function carregarDados() {
  try {
    const r = await window.storage.get(STORAGE_KEY, true);
    if (r && r.value) {
      const d = JSON.parse(r.value);
      d.usuarios = migrarUsuarios(d.usuarios);
      if (!d.usuarios[PRIMEIRO_ADMIN]) d.usuarios[PRIMEIRO_ADMIN] = { nome: nomeDoEmail(PRIMEIRO_ADMIN), perfil: "GM" };
      else d.usuarios[PRIMEIRO_ADMIN].perfil = "GM";
      if (!Array.isArray(d.auditoria)) d.auditoria = []; // migração: bases antigas sem trilha
      // Migração única do acervo do antigo app aura-pops (2026-08-24) — só entra se ainda não existir.
      if (!Array.isArray(d.pops)) d.pops = POPS_INICIAIS;
      if (!Array.isArray(d.popsAreas)) d.popsAreas = AREAS_POPS_INICIAIS;
      if (!d.popsConfig) d.popsConfig = POPS_CONFIG_INICIAL;
      return d;
    }
  } catch (e) { /* chave inexistente */ }
  return dadosVazios();
}
async function salvarDados(d) {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(d), true); } catch (e) { console.error("Falha ao salvar", e); }
  // Multiusuário: replica no SharePoint apenas as diferenças
  if (AUTENTICACAO_REAL && _ultimoSync) {
    const anterior = _ultimoSync;
    _ultimoSync = fotografar(d);
    try { await sincronizarGraph(anterior, _ultimoSync); }
    catch (e) {
      console.error("Sincronização com o SharePoint falhou", e);
      avisar("Atenção: a alteração foi salva localmente, mas a sincronização com o SharePoint falhou. Verifique sua conexão — o sistema tentará novamente na próxima alteração.");
      _ultimoSync = anterior; // volta a base do diff para reenviar depois
    }
  }
}

// Botão + painel suspenso (não é um pop-up de tela cheia: fica ancorado ao botão, some ao clicar
// fora). Usado para "Permissões" e "Administrador" em Configurações → Usuários, no lugar
// de checkboxes soltos direto na linha da tabela — mantém a tabela compacta e as duas áreas com a
// mesma formatação (botão com resumo + painel de opções).
function DropdownMultiSelect({ rotulo, resumo, children, largura = 280 }) {
  const [aberto, setAberto] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!aberto) return;
    const fora = (e) => { if (ref.current && !ref.current.contains(e.target)) setAberto(false); };
    document.addEventListener("mousedown", fora);
    return () => document.removeEventListener("mousedown", fora);
  }, [aberto]);
  return (
    <div ref={ref} style={{ position: "relative", display: "inline-block" }}>
      <button type="button" onClick={() => setAberto((a) => !a)} style={{
        display: "flex", alignItems: "center", gap: 6, padding: "6px 10px", borderRadius: 6,
        border: `1px solid ${CORES.cinzaClaro}`, background: aberto ? CORES.cinzaClaro : "#fff",
        color: CORES.azul, fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap",
      }}>
        {rotulo}
        <span style={{ color: CORES.cinza, fontWeight: 400 }}>({resumo})</span>
        <span style={{ fontSize: 9 }}>{aberto ? "▲" : "▼"}</span>
      </button>
      {aberto && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 40, minWidth: largura,
          background: "#fff", border: `1px solid ${CORES.cinza}`, borderRadius: 8,
          boxShadow: "0 8px 20px rgba(45,61,112,.18)", padding: 12,
        }}>
          {children}
        </div>
      )}
    </div>
  );
}

/* ---------------- Autocomplete de materiais ---------------- */
const semAcento = (s) => (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function CampoBuscaMaterial({ valor, aoMudar, aoEscolher, materiais, campo, placeholder, desabilitado }) {
  const [aberto, setAberto] = useState(false);
  const [mostrarTodos, setMostrarTodos] = useState(false); // seta ▼ = lista completa, mesmo com texto no campo
  const [pos, setPos] = useState(null); // posição fixa do dropdown (evita corte pela rolagem da tabela)
  const ref = useRef(null);
  const inputRef = useRef(null);

  const sugestoes = useMemo(() => {
    const v = semAcento(valor).trim();
    const ordenados = [...materiais].sort((a, b) =>
      campo === "codigo" ? String(a.codigo).localeCompare(String(b.codigo)) : String(a.descricao).localeCompare(String(b.descricao))
    );
    if (!v || mostrarTodos) return ordenados; // lista completa (escolha em lista)
    const palavras = v.split(/\s+/); // busca por todas as palavras digitadas, em qualquer ordem
    const filtrados = ordenados.filter((m) => {
      const alvo = semAcento(m.codigo) + " " + semAcento(m.descricao);
      return palavras.every((p) => alvo.includes(p));
    });
    // Prioridade: 1º) descrição/código COMEÇA com o texto digitado; 2º) apenas contém
    const comeca = (m) => semAcento(campo === "codigo" ? m.codigo : m.descricao).startsWith(v);
    return [...filtrados.filter(comeca), ...filtrados.filter((m) => !comeca(m))];
  }, [valor, materiais, campo, mostrarTodos]);

  const calcularPos = () => {
    if (!inputRef.current) return;
    const r = inputRef.current.getBoundingClientRect();
    const abaixo = window.innerHeight - r.bottom;
    setPos({
      left: Math.max(8, Math.min(r.left, window.innerWidth - 340)),
      largura: Math.max(r.width, 320),
      ...(abaixo < 240 && r.top > 260 ? { bottom: window.innerHeight - r.top + 2 } : { top: r.bottom + 2 }),
    });
  };

  const abrir = (todos) => {
    if (desabilitado) return;
    if (todos !== undefined) setMostrarTodos(todos);
    calcularPos();
    setAberto(true);
  };

  useEffect(() => {
    if (!aberto) return;
    const fora = (e) => { if (ref.current && !ref.current.contains(e.target)) setAberto(false); };
    const reposicionar = () => calcularPos();
    document.addEventListener("mousedown", fora);
    window.addEventListener("scroll", reposicionar, true);
    window.addEventListener("resize", reposicionar);
    return () => {
      document.removeEventListener("mousedown", fora);
      window.removeEventListener("scroll", reposicionar, true);
      window.removeEventListener("resize", reposicionar);
    };
  }, [aberto]);

  const estiloDropdown = pos ? {
    position: "fixed", left: pos.left, width: pos.largura, top: pos.top, bottom: pos.bottom,
    background: "#fff", border: `1px solid ${CORES.cinza}`, borderRadius: 6, zIndex: 60,
    boxShadow: "0 6px 16px rgba(45,61,112,.2)", maxHeight: 300, overflowY: "auto",
  } : { display: "none" };

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <input ref={inputRef} style={{ ...inputStyle, paddingRight: 26 }} value={valor || ""} placeholder={placeholder} disabled={desabilitado}
        onChange={(e) => { aoMudar(e.target.value); setMostrarTodos(false); calcularPos(); setAberto(true); }}
        onFocus={() => abrir()} />
      <span onClick={() => (aberto ? setAberto(false) : abrir(true))}
        style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: CORES.cinza, fontSize: 11, cursor: desabilitado ? "default" : "pointer", userSelect: "none" }}
        title="Abrir lista de materiais">▼</span>
      {aberto && sugestoes.length > 0 && (
        <div style={estiloDropdown}>
          {sugestoes.slice(0, 150).map((m) => (

/* ============================================================
   Gestão de Procedimentos (POPs) — Subsistema de Segurança
   Portado do antigo app separado "aura-pops" (2026-08-24) para dentro do AURA 360° Planta: mesmo
   login, mesmos dados (localStorage/SharePoint), sem depender de nenhum servidor externo.
   Fluxo: PUBLICADO/CONCLUIDO -[iniciar]-> EM_REVISAO -[enviar avaliação]-> AGUARDANDO_AVALIACAO
   -[aprova]-> APROVADO -[confirma]-> AGUARDANDO_APROVACAO_SSMA -[SSMA conclui]-> CONCLUIDO.
   Reprovações (avaliador ou SSMA) devolvem para EM_REVISAO. Regra SOX: avaliador ≠ auditor da revisão.
   ============================================================ */
const STATUS_POPS = { PUBLICADO: "Publicado", EM_REVISAO: "Em Revisão", AGUARDANDO_AVALIACAO: "Aguardando Avaliação", APROVADO: "Aprovado", AGUARDANDO_APROVACAO_SSMA: "Aguardando Aprovação do SSMA", CONCLUIDO: "Concluído" };
const COR_STATUS_POPS = { PUBLICADO: "#2D3D70", EM_REVISAO: "#F4614D", AGUARDANDO_AVALIACAO: "#b8860b", APROVADO: "#7C93C7", AGUARDANDO_APROVACAO_SSMA: "#E8862E", CONCLUIDO: "#22305c" };
function popsHojeBR() { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`; }
function popsHojeIso() { return new Date().toISOString().slice(0, 10); }
function popsAddDias(iso, dias) { return new Date(new Date(iso).getTime() + dias * 86400000).toISOString().slice(0, 10); }
function popsDiasParaVencer(validade) { return validade ? Math.ceil((new Date(validade) - new Date(popsHojeIso())) / 86400000) : null; }
const tdPops = { padding: "8px 10px", borderBottom: `1px solid ${CORES.cinzaClaro}`, fontSize: 13, color: CORES.azul, verticalAlign: "top" };

// Gráficos simples em SVG (sem biblioteca externa) — donut e barras, usados no Painel
function DonutPops({ dados: itens, size = 150, rotuloCentro = "POPs" }) {
  const totalReal = itens.reduce((s, d) => s + d.v, 0);
  const total = totalReal || 1; // evita divisão por zero no cálculo dos arcos — não usar para exibição
  const R = size / 2, r = R * 0.62; let a0 = -Math.PI / 2; const cx = R, cy = R;
  const paths = [];
  itens.forEach((d, i) => {
    if (!d.v) return;
    const a1 = a0 + (d.v / total) * Math.PI * 2;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1), xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
    paths.push(<path key={i} d={`M${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${r} ${r} 0 ${large} 0 ${xi0} ${yi0} Z`} fill={d.c} />);
    a0 = a1;
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {paths}
      <text x={cx} y={cy - 2} textAnchor="middle" fontSize={26} fontWeight={800} fill="#333">{total}</text>
      <text x={cx} y={cy + 16} textAnchor="middle" fontSize={10} fill="#888">{rotuloCentro}</text>
    </svg>
  );
}
function BarsPops({ dados: itens, w = 360, h = 150 }) {
  const max = Math.max(1, ...itens.map((d) => d.v));
  const bw = (w - 20) / (itens.length || 1);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      {itens.map((d, i) => {
        const bh = (d.v / max) * (h - 40); const x = 10 + i * bw; const y = h - 24 - bh;
        return (
          <g key={i}>
            <rect x={x + 6} y={y} width={bw - 12} height={bh} rx={4} fill={d.c || CORES.azul} />
            <text x={x + bw / 2} y={y - 4} textAnchor="middle" fontSize={11} fontWeight={700} fill="#444">{d.v}</text>
            <text x={x + bw / 2} y={h - 8} textAnchor="middle" fontSize={10} fill="#777">{d.l}</text>
          </g>
        );
      })}
    </svg>
  );
}

function TelaPainelPops({ dados }) {
  const pops = dados.pops || [];
  const cfg = dados.popsConfig || POPS_CONFIG_INICIAL;
  const porStatus = {};
  pops.forEach((p) => { porStatus[p.status] = (porStatus[p.status] || 0) + 1; });
  const hoje = new Date(popsHojeIso());
  const validade = { vencidos: 0, ate15: 0, ate30: 0, ate60: 0, ok: 0, semData: 0 };
  pops.forEach((p) => {
    if (!p.validade) { validade.semData++; return; }
    const d = Math.ceil((new Date(p.validade) - hoje) / 86400000);
    if (d < 0) validade.vencidos++; else if (d <= 15) validade.ate15++; else if (d <= 30) validade.ate30++; else if (d <= 60) validade.ate60++; else validade.ok++;
  });
  const pendSingular = pops.filter((p) => !p.singularUpload).length;
  const porArea = (dados.popsAreas || []).map((a) => ({ l: a.pastaNorm.replace(/^\d+\s*-\s*/, ""), v: pops.filter((p) => p.area === a.pastaNorm).length }));
  const pendenteDias = cfg.pendenteRevisaoDias || 45;
  let ok = 0, pendente = 0, vencido = 0, semDataRev = 0;
  pops.forEach((p) => {
    if (!p.validade) { semDataRev++; return; }
    const dd = Math.ceil((new Date(p.validade) - hoje) / 86400000);
    if (dd < 0) vencido++; else if (dd <= pendenteDias) pendente++; else ok++;

  const total = pops.length;
  const pct = (n) => (total ? Math.round((n / total) * 100) : 0);
  const statusData = Object.keys(STATUS_POPS).map((k) => ({ l: STATUS_POPS[k], v: porStatus[k] || 0, c: COR_STATUS_POPS[k] }));

    { rotulo: "A vencer (≤60d)", valor: validade.ate15 + validade.ate30 + validade.ate60, cor: (validade.ate15 + validade.ate30) ? CORES.laranja : CORES.azul },
    { rotulo: "Pendentes no Singular", valor: pendSingular, cor: pendSingular ? CORES.laranja : "#0f6b3f" },

  return (

          <div key={c.rotulo} style={{ background: "#fff", border: `1px solid ${CORES.cinzaClaro}`, borderRadius: 10, padding: "18px 16px", borderTop: `4px solid ${c.cor}` }}>
            <div style={{ fontSize: 30, fontWeight: 800, color: c.cor }}>{c.valor}</div>
            <div style={{ fontSize: 12, color: CORES.cinza, textTransform: "uppercase", letterSpacing: ".04em", marginTop: 4 }}>{c.rotulo}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: (typeof window !== "undefined" && window.innerWidth < 800) ? "1fr" : "1fr 1fr", gap: 16, marginTop: 16 }}>
        <Cartao>
          <h3 style={{ margin: "0 0 10px", color: CORES.azul, fontSize: 15 }}>POPs por status</h3>

              ))}
            </div>
          </div>
        </Cartao>
        <Cartao>
          <h3 style={{ margin: "0 0 10px", color: CORES.azul, fontSize: 15 }}>Validade dos POPs</h3>
          <BarsPops dados={validadeData} w={380} h={170} />
          <p style={{ fontSize: 11.5, color: CORES.cinza, marginTop: 6 }}>Alertas por e-mail em {(cfg.alertasDias || [60, 45, 30, 15]).join("/")} dias antes do vencimento (protótipo — envio real depende da TI habilitar e-mail corporativo).</p>

          </div>

// Modal de detalhe/workflow de um POP — ações condicionadas ao papel do usuário (Auditor/Avaliador/SSMA)
function ModalProcedimentoPops({ pop, dados, usuario, atualizarPop, aoFechar }) {
  const [modoObs, setModoObs] = useState(null); // null | "reprovar" | "confirmar"
  const [textoObs, setTextoObs] = useState("");
  const [avaliadorEsc, setAvaliadorEsc] = useState("");

  const meAuditor = capacidadePops(usuario, PAPEL_POPS_PROCEDIMENTOS, dados) === "editar";
  const meSSMA = capacidadePops(usuario, PAPEL_POPS_SSMA, dados) === "editar";
  const souAuditorResp = !pop.auditorEmail || pop.auditorEmail === usuario.email;
  const souAvaliadorDesignado = pop.avaliadorEmail === usuario.email;
  const avaliadores = Object.entries(dados.usuarios)
    .filter(([email, u]) => u.ativo !== false && temPapelPops(u, "avaliador", dados))
    .filter(([email]) => email !== (pop.auditorEmail || usuario.email));

  const rodar = async (fn) => { try { await fn(); } catch (e) { avisar(e.message || String(e)); } };

  const iniciar = () => rodar(() => atualizarPop(pop.id, {
    statusAntesRevisao: pop.status, status: "EM_REVISAO", auditorEmail: usuario.email,
    revisaoEmAndamento: (pop.revisaoAtual || 0) + 1, avaliadorEmail: null, avaliacao: null, descricaoPendente: null,
    singularUpload: false, singularEm: null, singularPorNome: null, ssmaEnviadoEm: null,
    trabalhoAnexo: null, trabalhoEnviado: false, trabalhoEnviadoEm: null, bloqueadoEdicao: false, avaliacaoSSMA: null,
  }, "Iniciou revisão", `${pop.codigo} — Rev ${String((pop.revisaoAtual || 0) + 1).padStart(2, "0")}`).then(aoFechar));

  const assumirRevisao = () => rodar(() => atualizarPop(pop.id, { auditorEmail: usuario.email }, "Assumiu a revisão", pop.codigo).then(aoFechar));
  const assumirAvaliacao = () => rodar(() => atualizarPop(pop.id, { avaliadorEmail: usuario.email }, "Assumiu a avaliação", pop.codigo).then(aoFechar));

  const cancelarRevisao = () => rodar(() => atualizarPop(pop.id, {
    status: pop.statusAntesRevisao || "PUBLICADO", statusAntesRevisao: null, auditorEmail: null, avaliadorEmail: null,
    avaliacao: null, descricaoPendente: null, trabalhoAnexo: null, trabalhoEnviado: false, trabalhoEnviadoEm: null, revisaoEmAndamento: null,
  }, "Cancelou a revisão", pop.codigo).then(aoFechar));

  const enviarUpload = (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (!/\.docx$/i.test(f.name)) { avisar("Envie um arquivo .docx."); return; }
    const reader = new FileReader();
    reader.onload = () => rodar(() => atualizarPop(pop.id, {
      trabalhoAnexo: { nome: f.name, dataUrl: reader.result }, trabalhoEnviado: true, trabalhoEnviadoEm: new Date().toISOString(),
    }, "Enviou versão revisada (upload)", f.name).then(aoFechar));
    reader.readAsDataURL(f);
  };

  const enviarAvaliacao = () => rodar(async () => {
    if (!avaliadorEsc) { avisar("Selecione um avaliador."); return; }
    await atualizarPop(pop.id, { status: "AGUARDANDO_AVALIACAO", avaliadorEmail: avaliadorEsc, bloqueadoEdicao: true },
      "Enviou para avaliação", `${pop.codigo} → ${avaliadorEsc}`);
    aoFechar();
  });

  const aprovar = () => rodar(() => atualizarPop(pop.id, { status: "APROVADO", avaliacao: { aprovado: true, obs: "", avaliadorNome: usuario.nome, data: new Date().toISOString() } },
    "Aprovou a avaliação", pop.codigo).then(aoFechar));

  const reprovar = () => rodar(async () => {
    if (!textoObs.trim()) { avisar("Justificativa obrigatória ao reprovar."); return; }
    await atualizarPop(pop.id, {
      status: "EM_REVISAO", bloqueadoEdicao: false, trabalhoEnviado: false,
      avaliacao: { aprovado: false, obs: textoObs, avaliadorNome: usuario.nome, data: new Date().toISOString() },
    }, "Reprovou / solicitou ajustes", textoObs);
    aoFechar();
  });

  const confirmar = () => rodar(async () => {
    if (!textoObs.trim()) { avisar("Descreva as mudanças desta revisão."); return; }
    await atualizarPop(pop.id, {
      descricaoPendente: textoObs, status: "AGUARDANDO_APROVACAO_SSMA", bloqueadoEdicao: true,
      ssmaEnviadoEm: new Date().toISOString(), singularUpload: false, singularEm: null, singularPorNome: null,
    }, "Confirmou a revisão (enviado ao SSMA)", textoObs);
    aoFechar();
  });

  const hist = pop.historico || [];

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(45,61,112,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 16 }}>
      <div style={{ background: "#fff", borderRadius: 12, padding: 24, maxWidth: 680, width: "100%", maxHeight: "88vh", overflowY: "auto", position: "relative" }}>
        <button type="button" onClick={aoFechar} style={{ position: "absolute", top: 14, right: 16, border: "none", background: "none", fontSize: 20, color: CORES.cinza, cursor: "pointer" }}>×</button>
        <h3 style={{ margin: "0 0 2px", color: CORES.azul }}>{pop.codigo}</h3>
        <div style={{ color: CORES.cinza, fontSize: 13 }}>{pop.titulo} · {pop.area}</div>
        <div style={{ margin: "10px 0" }}>
          <span style={{ display: "inline-block", padding: "2px 10px", borderRadius: 10, fontSize: 12, fontWeight: 700, color: "#fff", background: COR_STATUS_POPS[pop.status] || CORES.azul }}>{STATUS_POPS[pop.status] || pop.status}</span>
          <span style={{ fontSize: 13, color: CORES.azul, marginLeft: 10 }}>Rev <b>{String(pop.revisaoAtual ?? 0).padStart(2, "0")}</b> · {pop.dataRevisao || "—"} · Validade: <b>{pop.validade ? formatarDataBR(pop.validade) : "—"}</b></span>
        </div>

        {["PUBLICADO", "CONCLUIDO"].includes(pop.status) && meAuditor && <Botao tipo="laranja" onClick={iniciar}>Iniciar revisão</Botao>}

        {pop.status === "EM_REVISAO" && meAuditor && (
          <div style={{ background: CORES.cinzaClaro, borderRadius: 8, padding: 14, marginTop: 8 }}>
            {!pop.trabalhoAnexo || !pop.trabalhoEnviado ? (
              <label style={{ display: "inline-block" }}>
                <Botao tipo="contorno" style={{ pointerEvents: "none" }}>⬆ Enviar versão revisada (.docx)</Botao>
                <input type="file" accept=".docx" onChange={enviarUpload} style={{ display: "block", marginTop: 6 }} />
              </label>
            ) : (
              <div style={{ fontSize: 13, color: CORES.azul, marginBottom: 8 }}>✓ Versão revisada enviada: <b>{pop.trabalhoAnexo.nome}</b> em {new Date(pop.trabalhoEnviadoEm).toLocaleString("pt-BR")}
                {pop.trabalhoAnexo.dataUrl && <> — <a href={pop.trabalhoAnexo.dataUrl} download={pop.trabalhoAnexo.nome}>baixar</a></>}</div>
            )}
            {pop.trabalhoEnviado && (
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginTop: 10 }}>
                <select style={{ ...inputStyle, width: "auto" }} value={avaliadorEsc} onChange={(e) => setAvaliadorEsc(e.target.value)}>
                  <option value="">Selecione o avaliador…</option>
                  {avaliadores.map(([email, u]) => <option key={email} value={email}>{u.nome}</option>)}
                </select>
                <Botao onClick={enviarAvaliacao}>Enviar p/ avaliação</Botao>
              </div>
            )}
            {!souAuditorResp && <Botao tipo="contorno" style={{ marginTop: 10 }} onClick={assumirRevisao}>Assumir revisão</Botao>}
            {souAuditorResp && <Botao tipo="perigo" style={{ marginTop: 10, marginLeft: souAuditorResp ? 0 : 8 }} onClick={cancelarRevisao} title="Use se iniciou a revisão do POP errado.">✕ Cancelar revisão</Botao>}
          </div>
        )}

        {pop.status === "AGUARDANDO_AVALIACAO" && (
          souAvaliadorDesignado ? (
            modoObs === "reprovar" ? (
              <div style={{ marginTop: 8 }}>
                <textarea style={{ ...inputStyle, minHeight: 70 }} placeholder="Descreva os pontos a corrigir (obrigatório)" value={textoObs} onChange={(e) => setTextoObs(e.target.value)} />
                <div style={{ marginTop: 8, display: "flex", gap: 8 }}><Botao tipo="perigo" onClick={reprovar}>Confirmar reprovação</Botao><Botao tipo="contorno" onClick={() => { setModoObs(null); setTextoObs(""); }}>Cancelar</Botao></div>
              </div>
            ) : (
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <Botao onClick={aprovar}>Aprovar</Botao>
                <Botao tipo="perigo" onClick={() => setModoObs("reprovar")}>Reprovar / ajustes</Botao>
              </div>
            )
          ) : (
            <div style={{ marginTop: 8 }}>
              <span style={{ fontSize: 13, color: CORES.cinza }}>Aguardando avaliação{pop.avaliadorEmail ? ` de ${dados.usuarios[pop.avaliadorEmail]?.nome || pop.avaliadorEmail}` : ""}.</span>
              {temPapelPops(usuario, "avaliador", dados) && !pop.auditorEmail !== usuario.email && (
                <Botao tipo="contorno" style={{ marginLeft: 10 }} onClick={assumirAvaliacao}>Assumir avaliação</Botao>
              )}
            </div>
          )
        )}

        {pop.status === "APROVADO" && meAuditor && souAuditorResp && (
          modoObs === "confirmar" ? (
            <div style={{ marginTop: 8 }}>
              <textarea style={{ ...inputStyle, minHeight: 70 }} placeholder="Descreva as mudanças desta revisão (obrigatório para o histórico)" value={textoObs} onChange={(e) => setTextoObs(e.target.value)} />
              <div style={{ marginTop: 8, display: "flex", gap: 8 }}><Botao onClick={confirmar}>Confirmar</Botao><Botao tipo="contorno" onClick={() => { setModoObs(null); setTextoObs(""); }}>Cancelar</Botao></div>
            </div>
          ) : <Botao style={{ marginTop: 8 }} onClick={() => setModoObs("confirmar")}>Confirmar revisão</Botao>
        )}

        {pop.status === "AGUARDANDO_APROVACAO_SSMA" && (
          <div style={{ marginTop: 8, fontSize: 13, color: CORES.cinza }}>
            {meSSMA ? "Ações disponíveis na tela SSMA." : "Aguardando aprovação do SSMA — ações no menu SSMA."}
          </div>
        )}

        <h4 style={{ margin: "18px 0 6px", fontSize: 14, color: CORES.azul }}>Histórico de Revisões</h4>
        <table style={{ borderCollapse: "collapse", width: "100%" }}>
          <thead><tr><th style={tdPops}>Nº</th><th style={tdPops}>Data</th><th style={tdPops}>Descrição</th></tr></thead>
          <tbody>{hist.length ? hist.map((h, i) => <tr key={i}><td style={tdPops}>{String(h.rev).padStart(2, "0")}</td><td style={tdPops}>{h.data}</td><td style={tdPops}>{h.descricao}</td></tr>) : <tr><td colSpan={3} style={{ ...tdPops, color: CORES.cinza }}>—</td></tr>}</tbody>
        </table>
        {pop.avaliacao && !pop.avaliacao.aprovado && (
          <p style={{ fontSize: 12.5, color: "#990000", marginTop: 10 }}><b>Última reprovação (avaliador):</b> {pop.avaliacao.obs}</p>
        )}
        {pop.avaliacaoSSMA && !pop.avaliacaoSSMA.aprovado && (
          <p style={{ fontSize: 12.5, color: "#990000", marginTop: 6 }}><b>Reprovado pelo SSMA:</b> {pop.avaliacaoSSMA.obs}</p>
        )}
      </div>
    </div>
  );
}

function TelaProcedimentosPops({ dados, setDados, usuario }) {
  const [busca, setBusca] = useState("");
  const [fArea, setFArea] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [popAberto, setPopAberto] = useState(null);

  const pops = dados.pops || [];
  const areas = dados.popsAreas || [];
  const q = busca.toLowerCase().trim();
  const lista = pops.filter((p) =>
    (!q || `${p.codigo} ${p.titulo}`.toLowerCase().includes(q)) &&
    (!fArea || p.area === fArea) &&
    (!fStatus || p.status === fStatus));
  const statusPresentes = [...new Set(pops.map((p) => p.status))];

  const atualizarPop = async (popId, patch, acao, detalhe) => {
    let nd = { ...dados, pops: dados.pops.map((p) => (p.id === popId ? { ...p, ...patch } : p)) };
    nd = comLog(nd, usuario, "Procedimentos", acao, detalhe, popId);
    setDados(nd); await salvarDados(nd);
  };

  const popSelecionado = popAberto ? pops.find((p) => p.id === popAberto) : null;

  return (
    <div>
      <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Procedimentos</h2>
      <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 14px" }}>{lista.length} de {pops.length} procedimento(s){lista.length !== pops.length ? " (filtrado)" : ""}.</p>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        <input style={{ ...inputStyle, minWidth: 240, width: "auto" }} placeholder="🔎 Buscar por código ou título…" value={busca} onChange={(e) => setBusca(e.target.value)} />
        <select style={{ ...inputStyle, width: "auto" }} value={fArea} onChange={(e) => setFArea(e.target.value)}>
          <option value="">Todas as áreas</option>
          {areas.map((a) => <option key={a.id} value={a.pastaNorm}>{a.pastaNorm}</option>)}
        </select>
        <select style={{ ...inputStyle, width: "auto" }} value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
          <option value="">Todos os status</option>
          {statusPresentes.map((s) => <option key={s} value={s}>{STATUS_POPS[s] || s}</option>)}
        </select>
        {(busca || fArea || fStatus) && <Botao tipo="contorno" style={{ padding: "6px 12px", fontSize: 12.5 }} onClick={() => { setBusca(""); setFArea(""); setFStatus(""); }}>Limpar filtros</Botao>}
      </div>
      <Cartao style={{ padding: 0, overflow: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 760 }}>
          <thead><tr>
            {["Código / Área", "Título", "Revisão", "Validade", "Status", ""].map((h) => (
              <th key={h} style={{ padding: "8px 10px", fontSize: 11, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left" }}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {lista.map((p) => {
              const dias = popsDiasParaVencer(p.validade);
              return (
                <tr key={p.id}>
                  <td style={tdPops}><b>{p.codigo}</b><br /><span style={{ color: CORES.cinza, fontSize: 11.5 }}>{p.area}</span></td>
                  <td style={tdPops}>{p.titulo}</td>
                  <td style={tdPops}>Rev {String(p.revisaoAtual ?? 0).padStart(2, "0")}<br /><span style={{ color: CORES.cinza, fontSize: 11.5 }}>{p.dataRevisao || "—"}</span></td>
                  <td style={tdPops}>{p.validade ? <>{formatarDataBR(p.validade)}<br /><span style={{ fontSize: 11, color: dias < 0 || dias <= 30 ? "#990000" : dias <= 60 ? CORES.laranja : "#0f6b3f" }}>{dias < 0 ? "vencido" : dias + "d"}</span></> : "—"}</td>
                  <td style={tdPops}><span style={{ display: "inline-block", padding: "2px 8px", borderRadius: 10, fontSize: 11, fontWeight: 700, color: "#fff", background: COR_STATUS_POPS[p.status] || CORES.azul }}>{STATUS_POPS[p.status] || p.status}</span></td>
                  <td style={tdPops}><Botao tipo="contorno" style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => setPopAberto(p.id)}>Abrir</Botao></td>
                </tr>
              );
            })}
            {lista.length === 0 && <tr><td colSpan={6} style={{ ...tdPops, textAlign: "center", color: CORES.cinza }}>Nenhum POP encontrado com os filtros aplicados.</td></tr>}
          </tbody>
        </table>
      </Cartao>
      {popSelecionado && (
        <ModalProcedimentoPops pop={popSelecionado} dados={dados} usuario={usuario} atualizarPop={atualizarPop} aoFechar={() => setPopAberto(null)} />
      )}
    </div>
  );
}

function TelaSSMAPops({ dados, setDados, usuario }) {
  const pops = (dados.pops || []).filter((p) => p.status === "AGUARDANDO_APROVACAO_SSMA");
  const souSSMA = capacidadePops(usuario, PAPEL_POPS_SSMA, dados) === "editar";

  const atualizarPop = async (popId, patch, acao, detalhe) => {
    let nd = { ...dados, pops: dados.pops.map((p) => (p.id === popId ? { ...p, ...patch } : p)) };
    nd = comLog(nd, usuario, "Procedimentos", acao, detalhe, popId);
    setDados(nd); await salvarDados(nd);
  };

  const marcarSingular = (p, feito) => atualizarPop(p.id, {
    singularUpload: feito, singularPorNome: feito ? usuario.nome : null, singularEm: feito ? new Date().toISOString() : null,
  }, "Upload no Singular registrado", `${p.codigo}: ${feito ? "sim" : "não"}`);

  const concluir = async (p) => {
    if (!p.singularUpload) { avisar("Só é possível concluir após o upload no Singular."); return; }
    const novaRev = p.revisaoEmAndamento || (p.revisaoAtual || 0) + 1;
    const dataBR = popsHojeBR();
    await atualizarPop(p.id, {
      historico: [...(p.historico || []), { rev: novaRev, data: dataBR, descricao: p.descricaoPendente || "" }],
      revisaoAtual: novaRev, dataRevisao: dataBR, dataRevisaoIso: popsHojeIso(), validade: popsAddDias(popsHojeIso(), dados.popsConfig?.validadeDias || 365),
      status: "CONCLUIDO", bloqueadoEdicao: false, revisaoEmAndamento: null, descricaoPendente: null, trabalhoEnviado: false,
    }, "Concluiu (aprovado pelo SSMA)", `${p.codigo} — Rev ${String(novaRev).padStart(2, "0")}`);
  };

  const reprovar = async (p) => {
    const obs = window.prompt("Motivo da reprovação (obrigatório):");
    if (!obs || !obs.trim()) return;
    await atualizarPop(p.id, {
      status: "EM_REVISAO", bloqueadoEdicao: false, trabalhoEnviado: false, singularUpload: false, singularEm: null, singularPorNome: null, ssmaEnviadoEm: null,
      avaliacaoSSMA: { aprovado: false, obs, porNome: usuario.nome, data: new Date().toISOString() },
    }, "Reprovado pelo SSMA", obs);
  };

  return (
    <div>
      <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>SSMA — Aprovação de POPs</h2>
      <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 14px" }}>POPs enviados ao SSMA, aguardando upload no Singular e aprovação. {pops.length} pendente(s).</p>
      <Cartao style={{ padding: 0, overflow: "auto" }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 720 }}>
          <thead><tr>
            {["Data solicitação", "Código / Área", "Título", "Revisão", "Singular", "Ações"].map((h) => (
              <th key={h} style={{ padding: "8px 10px", fontSize: 11, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left" }}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {pops.map((p) => (
              <tr key={p.id}>
                <td style={tdPops}>{p.ssmaEnviadoEm ? new Date(p.ssmaEnviadoEm).toLocaleString("pt-BR") : "—"}</td>
                <td style={tdPops}><b>{p.codigo}</b><br /><span style={{ color: CORES.cinza, fontSize: 11.5 }}>{p.area}</span></td>
                <td style={tdPops}>{p.titulo}</td>
                <td style={tdPops}>Rev {String(p.revisaoEmAndamento ?? p.revisaoAtual ?? 0).padStart(2, "0")}</td>
                <td style={tdPops}>{p.singularUpload ? <span style={{ color: "#0f6b3f", fontWeight: 700 }}>✓ Enviado{p.singularEm ? " " + new Date(p.singularEm).toLocaleDateString("pt-BR") : ""}</span> : <span style={{ color: CORES.laranja }}>pendente</span>}</td>
                <td style={tdPops}>
                  {souSSMA ? (
                    <>
                      <label style={{ display: "block", marginBottom: 6, fontSize: 12.5, color: CORES.azul, cursor: "pointer" }}>
                        <input type="checkbox" checked={!!p.singularUpload} onChange={(e) => marcarSingular(p, e.target.checked)} style={{ marginRight: 6, accentColor: CORES.laranja }} />
                        Enviado ao Singular
                      </label>
                      <Botao style={{ padding: "4px 10px", fontSize: 12, marginRight: 6 }} disabled={!p.singularUpload} onClick={() => concluir(p)}>Aprovar / Concluir</Botao>
                      <Botao tipo="perigo" style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => reprovar(p)}>Reprovar</Botao>
                    </>
                  ) : <span style={{ color: CORES.cinza, fontSize: 12.5 }}>visualização (somente SSMA age)</span>}
                </td>
              </tr>
            ))}
            {pops.length === 0 && <tr><td colSpan={6} style={{ ...tdPops, textAlign: "center", color: CORES.cinza }}>Nenhum POP aguardando o SSMA.</td></tr>}
          </tbody>
        </table>
      </Cartao>
    </div>
  );
}

      <Cartao style={{ padding: 0, overflow: "auto", marginTop: 8 }}>
        <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 820 }}>
          <thead><tr>
            {["Código", "Título", "Área", "Revisão", "Data Rev.", "Validade", "Status", "Singular"].map((h) => (
              <th key={h} style={{ padding: "8px 10px", fontSize: 11, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left" }}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {lista.map((p) => (
              <tr key={p.id}>
                <td style={tdPops}><b>{p.codigo}</b></td>
                <td style={tdPops}>{p.titulo}</td>
                <td style={tdPops}>{p.area}</td>
                <td style={tdPops}>Rev {String(p.revisaoAtual ?? 0).padStart(2, "0")}</td>
                <td style={tdPops}>{p.dataRevisao || "—"}</td>
                <td style={tdPops}>{p.validade ? formatarDataBR(p.validade) : "—"}</td>
                <td style={tdPops}><span style={{ display: "inline-block", padding: "2px 8px", borderRadius: 10, fontSize: 11, fontWeight: 700, color: "#fff", background: COR_STATUS_POPS[p.status] || CORES.azul }}>{STATUS_POPS[p.status] || p.status}</span></td>
                <td style={tdPops}>{p.singularUpload ? <span style={{ color: "#0f6b3f" }}>Sim</span> : <span style={{ color: CORES.cinza }}>Não</span>}</td>

          </tbody>

// Configurações do Subsistema Gestão de Procedimentos — só GM ou administrador delegado.
// Parâmetros (validade/alertas) + tabela de acessos: TODO usuário cadastrado no AURA 360° aparece
// aqui, para o administrador decidir quem tem acesso, quais telas e quais papéis (Auditor/
// Avaliador/SSMA) dentro deste Subsistema — igual ao padrão já usado em Compras e Cadastros.
function TelaConfigPops({ dados, setDados, usuario }) {
  const [aba, setAba] = useState("usuarios"); // "usuarios" | "parametros"
  const cfgAtual = dados.popsConfig || POPS_CONFIG_INICIAL;
  const [validadeDias, setValidadeDias] = useState(cfgAtual.validadeDias);
  const [pendenteDias, setPendenteDias] = useState(cfgAtual.pendenteRevisaoDias);
  const [alertasDias, setAlertasDias] = useState((cfgAtual.alertasDias || []).join(", "));

  const salvarParametros = async () => {
    const popsConfig = {
      validadeDias: Math.max(1, parseInt(validadeDias, 10) || cfgAtual.validadeDias),
      pendenteRevisaoDias: Math.max(1, parseInt(pendenteDias, 10) || cfgAtual.pendenteRevisaoDias),
      alertasDias: alertasDias.split(",").map((x) => parseInt(x.trim(), 10)).filter(Boolean).sort((a, b) => b - a),
    };
    let nd = { ...dados, popsConfig };
    nd = comLog(nd, usuario, "Procedimentos", "Atualizou configuração de Gestão de Procedimentos", JSON.stringify(popsConfig), "");
    setDados(nd); await salvarDados(nd);
    avisar("Configuração salva.");
  };

  const todosUsuarios = Object.entries(dados.usuarios);
  const existeAdmin = existeAdministradorPops(dados);

  return (
    <div>
      <h2 style={{ margin: "0 0 4px", color: CORES.azul }}>Configurações — Gestão de Procedimentos</h2>
      <p style={{ fontSize: 13, color: CORES.cinza, margin: "0 0 16px" }}>Parâmetros do Subsistema e quem tem acesso a ele — visível só para GM e administradores delegados deste Subsistema.</p>
      <div style={{ display: "flex", gap: 8, marginBottom: 18, borderBottom: `1px solid ${CORES.cinzaClaro}`, paddingBottom: 12 }}>
        {[["usuarios", "Usuários e Acessos"], ["parametros", "Parâmetros"]].map(([id, rot]) => (
          <button key={id} onClick={() => setAba(id)} style={{
            padding: "8px 16px", border: "none", borderRadius: 6, cursor: "pointer", fontSize: 13.5, fontWeight: 700, fontFamily: "inherit",
            background: aba === id ? CORES.azul : CORES.cinzaClaro, color: aba === id ? "#fff" : CORES.azul,
          }}>{rot}</button>
        ))}
      </div>

      {aba === "parametros" && (
        <Cartao style={{ maxWidth: 560 }}>
          <Campo label="Validade dos POPs (dias) — padrão 365"><input type="number" style={inputStyle} value={validadeDias} onChange={(e) => setValidadeDias(e.target.value)} /></Campo>
          <div style={{ height: 10 }} />
          <Campo label='Janela "Pendente de Revisão" no Painel (dias antes do vencimento) — padrão 45'><input type="number" style={inputStyle} value={pendenteDias} onChange={(e) => setPendenteDias(e.target.value)} /></Campo>
          <div style={{ height: 10 }} />
          <Campo label="Alertas por e-mail (dias antes, separados por vírgula)"><input style={inputStyle} value={alertasDias} onChange={(e) => setAlertasDias(e.target.value)} /></Campo>
          <Botao style={{ marginTop: 14 }} onClick={salvarParametros}>Salvar</Botao>
        </Cartao>
      )}

      {aba === "usuarios" && (
        <div>
          <p style={{ fontSize: 12.5, color: CORES.cinza, margin: "0 0 12px" }}>
            Todo usuário cadastrado no AURA 360° Planta aparece aqui, inclusive o(s) GM.
            O acesso ao Subsistema é liberado pelos Papéis — sem nenhum marcado, o usuário não vê Gestão de Procedimentos.
            Um usuário pode acumular vários papéis ao mesmo tempo (ex.: Administrador e Auditor e Avaliador).
            {" "}Enquanto nenhum Administrador estiver definido, o GM tem acesso total (modo inicial); ao cadastrar o
            primeiro Administrador, o GM passa a ser tratado como Leitor aqui dentro.
          </p>
          <Cartao style={{ padding: 0, overflow: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 640 }}>
              <thead><tr>
                {["Nome", "E-mail", "Papéis", "Status"].map((h) => (
                  <th key={h} style={{ padding: "8px 10px", fontSize: 11, textTransform: "uppercase", color: "#fff", background: CORES.azul, textAlign: "left" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {todosUsuarios.map(([email, u]) => {
                  const perm = u.permissoes || permissoesDefault();
                  const papeis = perm.papeisPops || permissoesDefault().papeisPops;
                  const ehGMLinha = EH_GM(u);
                  return (
                    <tr key={email}>
                      <td style={tdPops}>{u.nome}{ehGMLinha && <span style={{ marginLeft: 6, fontSize: 10.5, color: "#fff", background: CORES.azul, borderRadius: 8, padding: "1px 7px" }}>GM</span>}</td>
                      <td style={tdPops}>{email}</td>
                      <td style={tdPops}>
                        {ehGMLinha ? (
                          <span style={{ fontSize: 12, color: existeAdmin ? CORES.cinza : CORES.laranja, fontStyle: "italic" }}>
                            {existeAdmin ? "Leitor (já existe um Administrador definido)" : "Acesso total (modo inicial — nenhum Administrador definido ainda)"}
                          </span>
                        ) : (
                          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                            {PAPEL_POPS_OPCOES.map((p) => (
                              <label key={p.id} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: CORES.azul, cursor: "pointer" }}>
                                <input type="checkbox" checked={!!papeis[p.id]} onChange={() => alternarPapelPops(dados, setDados, usuario, email, p.id)}
                                  style={{ width: 13, height: 13, accentColor: CORES.laranja }} />
                                {p.nome}
                              </label>
                            ))}
                          </div>
                        )}
                      </td>
                      <td style={tdPops}>
                        <Botao tipo={u.ativo === false ? "contorno" : "perigo"} style={{ padding: "4px 10px", fontSize: 12 }} disabled={email === usuario.email || ehGMLinha}
                          title={ehGMLinha ? "GM é gerenciado em Configurações (plataforma)" : ""}
                          onClick={() => alternarAtivoUsuario(dados, setDados, usuario, email)}>{u.ativo === false ? "Desativado — Reativar" : "Ativo — Desativar"}</Botao>
                      </td>
                    </tr>
                  );
                })}
                {todosUsuarios.length === 0 && <tr><td colSpan={4} style={{ ...tdPops, textAlign: "center", color: CORES.cinza }}>Nenhum usuário cadastrado ainda.</td></tr>}
              </tbody>
            </table>
          </Cartao>
        </div>
      )}
    </div>
  );
}

function TelaCompras({ dados, setDados, usuario, notificarSolicitacao }) {
  const [linhas, setLinhas] = useState([linhaVazia()]);
  const [editando, setEditando] = useState(null); // item em edição (registro salvo)
  const [fornEsp, setFornEsp] = useState(false);
  const [fornEspNome, setFornEspNome] = useState("");
  const [fCod, setFCod] = useState("");
  const [fDesc, setFDesc] = useState("");
  const [fStatus, setFStatus] = useState("Todos");

  // 1.2 — sempre que uma linha for preenchida, gerar a próxima
  useEffect(() => {
    const u = linhas[linhas.length - 1];
    if (u && (u.codigo || u.descricao)) setLinhas((ls) => [...ls, linhaVazia()]);
  }, [linhas]);

  const mudar = (i, campo, valor) =>
    setLinhas((ls) => ls.map((l, j) => (j === i ? { ...l, [campo]: valor } : l)));

  const escolherMaterial = (i, m) =>
    setLinhas((ls) => ls.map((l, j) => (j === i ? { ...l, codigo: m.codigo, descricao: m.descricao, unidade: l.unidade || m.unidade } : l)));

  const removerLinha = (i) => setLinhas((ls) => (ls.length > 1 ? ls.filter((_, j) => j !== i) : ls));

  const buscarNaBase = (l) => {
    const cod = semAcento(l.codigo).trim();
    const desc = semAcento(l.descricao).trim();
    return dados.materiais.find((m) => (cod && semAcento(m.codigo) === cod) || (desc && semAcento(m.descricao) === desc)) || null;
  };

  const enviar = async () => {
    const preenchidas = linhas.filter((l) => l.codigo || l.descricao || l.quantidade || l.centroCusto || l.contaContabil);
    if (preenchidas.length === 0) { avisar("Preencha ao menos uma linha."); return; }
    const semItem = preenchidas.find((l) => !l.codigo && !l.descricao);
    if (semItem) { avisar("Cada linha precisa de Cód. Item OU Descrição do Item (campo obrigatório)."); return; }
    // 1.4 — o item precisa existir na base de materiais cadastrados
    const foraDaBase = preenchidas.filter((l) => !buscarNaBase(l));
    if (foraDaBase.length > 0) {
      avisar(
        "Os itens abaixo não existem na base de materiais:\n\n" +
        foraDaBase.map((l) => `• ${l.codigo || l.descricao}`).join("\n") +
        "\n\nPara comprar um item novo, primeiro solicite a inclusão dele na tela de Solicitação de Cadastros."
      );
      return;
    }
    const capexSemCodigo = preenchidas.find((l) => l.capex && !l.nomeCapex.trim());
    if (capexSemCodigo) { avisar("Linhas marcadas como Capex precisam do Código Capex preenchido."); return; }
    if (fornEsp && !fornEspNome.trim()) { avisar("Você marcou Fornecedor Específico: informe o nome do fornecedor."); return; }
    const dataHora = agoraStr();
    const novos = preenchidas.map((l) => {
      const m = buscarNaBase(l); // complementa código ↔ descrição pela base oficial
      return { id: uid(), solicitante: usuario.nome, email: usuario.email, dataHora, ...l, codigo: m.codigo, descricao: m.descricao, unidade: l.unidade || m.unidade, observacoes: (l.observacoes || "").trim(), fornecedorEspecifico: fornEsp ? fornEspNome.trim() : "", concluido: false };
    });
    let nd = { ...dados, compras: [...dados.compras, ...novos] };
    const logDetalhe = novos.map((n) => `${n.codigo} — ${n.descricao} (qtd ${n.quantidade || "?"} ${n.unidade || ""}; CC ${n.centroCusto || "-"}; Conta ${n.contaContabil || "-"})`).join(" | ");
    nd = comLog(nd, usuario, "Compra", `Criou solicitação de compra (${novos.length} ${novos.length > 1 ? "itens" : "item"})`, logDetalhe, novos.map((n) => n.id).join(","));
    setDados(nd); await salvarDados(nd);
    setLinhas([linhaVazia()]); setFornEsp(false); setFornEspNome("");
    const resumo = novos.map((n) => `• ${n.codigo} — ${n.descricao} | ${n.quantidade || "?"} ${n.unidade || ""} | CC ${n.centroCusto || "-"} | Conta ${n.contaContabil || "-"}${n.capex ? ` | Capex ${n.nomeCapex}` : ""}${n.fornecedorEspecifico ? ` | Fornecedor específico: ${n.fornecedorEspecifico}` : ""}${n.observacoes ? ` | Obs: ${n.observacoes}` : ""}`).join("\n");
    // Colunas do comunicado (admin): Solicitante, Item, Qtd, Centro de Custo, Conta Contábil e Código Capex
    const tabela = {
      cabecalhos: ["Solicitante", "Cód Mat", "Descr Material", "Quantidade", "UM", "Centro de Custo", "Conta Contábil", "Capex", "Forn. Específico", "Obs."],
      linhas: novos.map((n) => [n.solicitante, n.codigo, n.descricao, n.quantidade, n.unidade, n.centroCusto, n.contaContabil, n.capex ? (n.nomeCapex || "Sim") : "—", n.fornecedorEspecifico || "—", n.observacoes || "—"]),
    };
    notificarSolicitacao("Compra", usuario, nd, resumo, dataHora, tabela);
  };

  const salvarEdicao = async () => {
    if (!editando.codigo && !editando.descricao) { avisar("Cód. Item OU Descrição é obrigatório."); return; }
    const m = buscarNaBase(editando);
    if (!m) { avisar("Este item não existe na base de materiais. Solicite a inclusão dele na tela de Solicitação de Cadastros."); return; }
    if (editando.capex && !(editando.nomeCapex || "").trim()) { avisar("Item marcado como Capex precisa do Código Capex preenchido."); return; }
    const corrigido = { ...editando, codigo: m.codigo, descricao: m.descricao, unidade: editando.unidade || m.unidade };
    let nd = { ...dados, compras: dados.compras.map((c) => (c.id === editando.id ? corrigido : c)) };
    nd = comLog(nd, usuario, "Compra", "Editou solicitação de compra", `${corrigido.codigo} — ${corrigido.descricao}`, editando.id);
    setDados(nd); await salvarDados(nd); setEditando(null);
  };

  const removerItem = async (id) => {
    const alvo = dados.compras.find((c) => c.id === id);
    if (alvo && (alvo.concluido || alvo.cancelado)) { avisar("Item concluído ou cancelado não pode ser modificado."); return; }
    avisar("Solicitação removida.");
    let nd = { ...dados, compras: dados.compras.filter((c) => c.id !== id) };
    nd = comLog(nd, usuario, "Compra", "Removeu solicitação de compra", alvo ? `${alvo.codigo || ""} — ${alvo.descricao || ""}` : "", id);
    setDados(nd); await salvarDados(nd);
  };

  // O solicitante confirma o recebimento após o Administrador marcar "Entregue" no Relatório.
  // Uma vez confirmado, só um Administrador pode desmarcar (feito na tela de Relatórios).
  const confirmarRecebimento = async (c) => {
    if (!c.entregue || c.recebido) return;
    let nd = { ...dados, compras: dados.compras.map((x) => (x.id === c.id ? { ...x, recebido: true, recebidoEm: agoraStr(), recebidoPor: usuario.nome } : x)) };
    nd = comLog(nd, usuario, "Movimentação", "Confirmou recebimento do item", `${c.codigo || ""} — ${c.descricao || ""}`, c.id);
    setDados(nd); await salvarDados(nd);
  };

  const minhas = dados.compras.filter((c) =>
    c.email === usuario.email &&
    String(c.codigo || "").toLowerCase().includes(fCod.toLowerCase()) &&
    semAcento(c.descricao).includes(semAcento(fDesc)) &&
    (fStatus === "Todos" || statusDe(c) === fStatus)
  );
  const th = { padding: "8px 8px", fontSize: 11.5, textTransform: "uppercase", letterSpacing: ".04em", color: "#fff", background: CORES.azul, textAlign: "left", whiteSpace: "nowrap" };
  const td = { padding: 6, borderBottom: `1px solid ${CORES.cinzaClaro}`, verticalAlign: "top" };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 22 }}>
      <Cartao style={{ position: "relative" }}>
        <h2 style={{ margin: "0 0 2px", color: CORES.azul }}>Solicitação de Compras</h2>
        <p style={{ margin: "0 0 6px", fontSize: 13, color: CORES.cinza }}>
          Solicitante: <strong style={{ color: CORES.azul }}>{usuario.nome}</strong> · Cód. Item ou Descrição preenchem um ao outro automaticamente.
        </p>
        <p style={{ margin: "0 0 16px", fontSize: 12.5, color: dados.materiaisAtualizadoEm ? CORES.cinza : CORES.laranja }}>
          Base de materiais: <strong>{dados.materiais.length}</strong> itens
          {dados.materiaisAtualizadoEm
            ? ` (arquivo de ${dados.materiaisAtualizadoEm})`
            : " — apenas exemplos! Carregue o MateriaisDeCompra.csv em “Atualização de Materiais” para buscar nos itens reais."}
        </p>
        <div style={{ overflowX: "auto" }}>
          <table style={{ borderCollapse: "collapse", width: "100%", minWidth: 900 }}>
            <thead><tr>
              <th style={th}>Solicitante</th><th style={th}>Cód. Item •</th><th style={th}>Descrição do Item •</th>
              <th style={th}>Qtd.</th><th style={th}>Un. Medida</th><th style={th}>Centro de Custo</th><th style={th}>Conta Contábil</th>
              <th style={{ ...th, textAlign: "center" }}>Capex</th><th style={th}>Código Capex</th><th style={{ ...th, textAlign: "center" }}>Urgente</th><th style={th}>Observações</th><th style={th}></th>
            </tr></thead>
            <tbody>
              {linhas.map((l, i) => (
                <tr key={i}>
                  <td style={td}><input style={{ ...inputStyle, background: CORES.cinzaClaro, color: CORES.cinza }} value={usuario.nome} disabled /></td>
                  <td style={{ ...td, minWidth: 120 }}>
                    <CampoBuscaMaterial campo="codigo" valor={l.codigo} materiais={dados.materiais} placeholder="Buscar código…"
                      aoMudar={(v) => mudar(i, "codigo", v)} aoEscolher={(m) => escolherMaterial(i, m)} />
                  </td>
                  <td style={{ ...td, minWidth: 220 }}>
                    <CampoBuscaMaterial campo="descricao" valor={l.descricao} materiais={dados.materiais} placeholder="Buscar descrição…"
                      aoMudar={(v) => mudar(i, "descricao", v)} aoEscolher={(m) => escolherMaterial(i, m)} />
                  </td>
                  <td style={{ ...td, width: 72, minWidth: 64 }}><input style={{ ...inputStyle, padding: "8px 6px", textAlign: "center", minWidth: 52 }} type="number" min="0" value={l.quantidade} onChange={(e) => mudar(i, "quantidade", e.target.value)} /></td>
                  <td style={{ ...td, width: 86, minWidth: 76 }}><input style={{ ...inputStyle, padding: "8px 6px", textAlign: "center", minWidth: 64 }} value={l.unidade} onChange={(e) => mudar(i, "unidade", e.target.value)} title={l.unidade || ""} /></td>
                  <td style={{ ...td, width: 130 }}><input style={inputStyle} value={l.centroCusto} onChange={(e) => mudar(i, "centroCusto", e.target.value)} /></td>
                  <td style={{ ...td, width: 130 }}><input style={inputStyle} value={l.contaContabil} onChange={(e) => mudar(i, "contaContabil", e.target.value)} /></td>
                  <td style={{ ...td, textAlign: "center", width: 54 }}>
                    <input type="checkbox" checked={!!l.capex} title="Marcar se a compra é Capex"
                      onChange={(e) => setLinhas((ls) => ls.map((x, j) => (j === i ? { ...x, capex: e.target.checked, nomeCapex: e.target.checked ? x.nomeCapex : "" } : x)))}
                      style={{ width: 17, height: 17, accentColor: CORES.laranja, cursor: "pointer", marginTop: 8 }} />
                  </td>
                  <td style={{ ...td, width: 130 }}>
                    <input style={{ ...inputStyle, background: l.capex ? "#fff" : CORES.cinzaClaro }} value={l.nomeCapex} disabled={!l.capex}
                      placeholder={l.capex ? "Código Capex" : "—"} onChange={(e) => mudar(i, "nomeCapex", e.target.value)} />
                  </td>
                  <td style={{ ...td, textAlign: "center", width: 60 }}>
                    <input type="checkbox" checked={!!l.urgente} title="Marcar se esta compra é urgente"
                      onChange={(e) => mudar(i, "urgente", e.target.checked)}
                      style={{ width: 17, height: 17, accentColor: CORES.laranja, cursor: "pointer", marginTop: 8 }} />
                  </td>
                  <td style={{ ...td, minWidth: 170 }}>
                    <input style={inputStyle} value={l.observacoes} placeholder="Obs. deste item…"
                      onChange={(e) => mudar(i, "observacoes", e.target.value)} title={l.observacoes || ""} />
                  </td>
                  <td style={td}>{linhas.length > 1 && i < linhas.length - 1 ? (
                    <button onClick={() => removerLinha(i)} title="Excluir linha" style={{ border: "none", background: "none", color: CORES.laranja, cursor: "pointer", fontSize: 16 }}>✕</button>) : null}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, fontWeight: 700, color: CORES.azul, cursor: "pointer", whiteSpace: "nowrap" }}>
            <input type="checkbox" checked={fornEsp}
              onChange={(e) => { setFornEsp(e.target.checked); if (!e.target.checked) setFornEspNome(""); }}
              style={{ width: 17, height: 17, accentColor: CORES.laranja }} />
            Fornecedor Específico
          </label>
          <input style={{ ...inputStyle, maxWidth: 420, background: fornEsp ? "#fff" : CORES.cinzaClaro }}
            disabled={!fornEsp} value={fornEspNome} onChange={(e) => setFornEspNome(e.target.value)}
            placeholder={fornEsp ? "Nome do fornecedor exigido para esta compra" : "Marque a opção para informar o fornecedor"} />
        </div>
        <div style={{ marginTop: 16, display: "flex", gap: 10 }}>
          <Botao tipo="laranja" onClick={enviar}>Enviar solicitação e notificar por e-mail</Botao>
        </div>
      </Cartao>

      <Cartao>
        <h3 style={{ margin: "0 0 12px", color: CORES.azul }}>Minhas solicitações de compra</h3>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          <div style={{ flex: "1 1 150px" }}><Campo label="Filtro: Código"><input style={inputStyle} value={fCod} onChange={(e) => setFCod(e.target.value)} placeholder="Cód. do item…" /></Campo></div>
          <div style={{ flex: "2 1 220px" }}><Campo label="Filtro: Item"><input style={inputStyle} value={fDesc} onChange={(e) => setFDesc(e.target.value)} placeholder="Descrição do item…" /></Campo></div>
          <div style={{ flex: "1 1 150px" }}><Campo label="Filtro: Status">
            <select style={inputStyle} value={fStatus} onChange={(e) => setFStatus(e.target.value)}>
              <option>Todos</option><option>Pendente</option><option>Concluído</option><option>Cancelado</option>
            </select>
          </Campo></div>
        </div>
        {minhas.length === 0 ? <p style={{ color: CORES.cinza, fontSize: 14 }}>Nenhuma solicitação encontrada. Ajuste os filtros ou envie uma nova pela tabela acima.</p> : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "100%", fontSize: 13.5, color: CORES.azul }}>
              <thead><tr>{["Data/Hora", "Cód.", "Descrição", "Qtd.", "Un.", "C. Custo", "Conta", "Capex", "Forn. Esp.", "Obs.", "Status", "Item Recebido", "Ações"].map((h) => <th key={h} style={th}>{h}</th>)}</tr></thead>
              <tbody>
                {minhas.map((c) => (
                  <tr key={c.id} style={{ opacity: c.recebido || c.cancelado ? 0.6 : 1 }}>
                    <td style={td}>{c.dataHora}</td><td style={td}>{c.codigo}</td><td style={td}>{c.descricao}</td>
                    <td style={td}>{c.quantidade}</td><td style={td}>{c.unidade}</td><td style={td}>{c.centroCusto}</td><td style={td}>{c.contaContabil}</td><td style={td}>{c.capex ? (c.nomeCapex || "Sim") : "—"}</td><td style={{ ...td, maxWidth: 120 }} title={c.fornecedorEspecifico || ""}>{c.fornecedorEspecifico || "—"}</td><td style={{ ...td, maxWidth: 160 }} title={c.observacoes || ""}>{c.observacoes ? (c.observacoes.length > 34 ? c.observacoes.slice(0, 32) + "…" : c.observacoes) : "—"}</td>
                    <td style={td}>
                      {c.cancelado ? (
